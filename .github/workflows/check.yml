# Runs on every pull request and on every change to main.
# Uses the mock model, so it needs no API keys and no secrets.
name: check

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned: Playwright 1.58 cannot install its browser on Ubuntu 26, where ubuntu-latest now points.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LLM_PROVIDER: mock
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: No secrets in the repo
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is tracked. Remove it with: git rm --cached .env"
            exit 1
          fi
          # Key formats of the providers we use: Google, Anthropic, OpenAI, GitHub.
          if git grep -nIE 'AIza[0-9A-Za-z_-]{35}|sk-ant-[0-9A-Za-z_-]{20,}|sk-(proj-)?[0-9A-Za-z_-]{40,}|gh[pousr]_[0-9A-Za-z]{36}' -- . ':!.github/workflows/check.yml'; then
            echo "::error::Something that looks like an API key is in the repo. Revoke the key at the provider first, then remove it."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Code compiles
        run: python -m compileall -q agentkit scripts

      - name: Full flow with the mock model
        run: python scripts/check_setup.py
