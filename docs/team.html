<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team · Shelf-It</title>
<meta name="description" content="The five people who built Shelf-It in two days at the Gen AI Summit Hackathon, Athens.">
<meta property="og:title" content="Team · Shelf-It">
<meta property="og:image" content="shelf-drinks.jpg">
<meta name="theme-color" content="#0c2b22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F7A5C'/%3E%3Cpath d='M7.5 10.5h17M7.5 16h17M7.5 21.5h17' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='21' cy='16' r='2.1' fill='%23A7F3D0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0c2b22; --green: #1f7a5c; --mint: #a7f3d0;
    --paper: #f6f3ec; --card: #ffffff; --ink: #142019; --soft: #4f5d55; --line: #dcd6c9;
    --on-dark: rgba(255,255,255,0.82); --on-dark-soft: rgba(255,255,255,0.66); --line-dark: rgba(255,255,255,0.14);
    --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--sans); -webkit-text-size-adjust: 100%; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 4px; }
  .hero :focus-visible, nav.top :focus-visible { outline-color: var(--mint); }
  ::selection { background: var(--mint); color: var(--night); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }

  /* nav + tabs (same as index.html) */
  nav.top { position: absolute; inset: 0 0 auto 0; z-index: 10; }
  nav.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 1.12rem var(--display); color: #fff; text-decoration: none; }
  .brand svg { width: 28px; height: 28px; }
  .tabs { display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 1px solid var(--line-dark); }
  .tabs a { padding: 6px 14px; border-radius: 6px; color: var(--on-dark); font-weight: 600; font-size: 0.88rem; text-decoration: none; }
  .tabs a:hover { color: #fff; }
  .tabs a[aria-current] { background: var(--mint); color: var(--night); }

  /* hero */
  .hero { background: var(--night); color: #fff; padding: 120px 0 56px; }
  .hero h1 { font-size: clamp(2.6rem, 7vw, 4.6rem); font-weight: 800; line-height: 1.04; letter-spacing: -0.035em; max-width: 14em; }
  .hero h1 em { font-style: normal; color: var(--mint); }
  .hero p { font-size: 1.08rem; color: var(--on-dark); max-width: 58ch; margin: 16px 0 0; }

  /* cards */
  section.people { padding: 56px 0 72px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  @media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; display: flex; flex-direction: column; }
  .card.empty { border-style: dashed; background: transparent; }
  .head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; font: 700 1.1rem var(--display); color: var(--night); background: var(--mint); }
  .card.empty .avatar { background: var(--line); color: var(--soft); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .head h3 { font-size: 1.15rem; font-weight: 700; line-height: 1.25; }
  .card.empty .head h3 { color: var(--soft); font-weight: 500; }
  .role { display: block; margin-top: 2px; font-size: 0.9rem; font-weight: 600; color: var(--green); }
  .label { font-size: 0.8rem; font-weight: 600; color: var(--soft); margin: 12px 0 2px; }
  .card p { margin: 0; font-size: 0.95rem; }
  .card p.muted { color: var(--soft); }
  .card p.skills { margin: 14px 0 0; font-size: 0.86rem; color: var(--soft); }
  .links { margin-top: auto; padding-top: 16px; display: flex; gap: 18px; }
  .links a { font-size: 0.9rem; font-weight: 600; color: var(--green); text-underline-offset: 3px; display: inline-block; padding: 4px 0; }
  .back-link { display: inline-block; margin-top: 32px; font-weight: 600; color: var(--green); text-underline-offset: 3px; }
  footer { background: var(--night); padding: 22px 20px; font-size: 0.92rem; }
  footer .wrap { padding: 0; }
  footer a { color: #fff; font-weight: 600; text-underline-offset: 3px; display: inline-block; padding: 8px 0; }
  footer :focus-visible { outline-color: var(--mint); }
</style>
</head>
<body>

<nav class="top" aria-label="Main">
  <div class="wrap">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1F7A5C"/><path d="M7.5 10.5h17M7.5 16h17M7.5 21.5h17" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="21" cy="16" r="2.1" fill="#A7F3D0"/></svg>
      Shelf-It
    </a>
    <div class="tabs" role="navigation" aria-label="Pages">
      <a href="index.html">Product</a>
      <a href="index.html#team" aria-current="true">Team</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <h1>Five people, two days, <em>one shelf.</em></h1>
    <p>The team behind Shelf-It. Built at the Gen AI Summit Hackathon, Athens, November 2026.</p>
  </div>
</header>

<main id="people">
  <section class="people">
    <div class="wrap">
      <div class="grid" id="grid"></div>
      <a class="back-link" href="index.html">Back to the project page</a>
    </div>
  </section>
</main>

<footer><div class="wrap"><a href="https://github.com/Koutsourelis/Gen-AI-Hackathon-Agent" target="_blank" rel="noopener">GitHub</a></div></footer>

<script src="team.js"></script>
<script>
(function () {
  const esc = (t) => String(t || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const team = window.TEAM || [];
  const initials = (n) => n.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();

  document.getElementById("grid").innerHTML = team.map((m) => {
    const named = !!(m.name && m.name.trim());
    const avatar = m.photo ? `<img src="${esc(m.photo)}" alt="${esc(m.name)}">` : (named ? esc(initials(m.name)) : "?");
    const skills = (m.skills || []).length ? `<p class="skills">${m.skills.map(esc).join(" · ")}</p>` : "";
    const url = (u) => /^https?:\/\//i.test(u) ? u : "https://" + u.replace(/^\/+/, "");
    const gh = (g) => /github\.com/i.test(g) ? url(g) : "https://github.com/" + g.replace(/^@/, "");
    const links = [
      m.linkedin ? `<a href="${esc(url(m.linkedin.trim()))}" target="_blank" rel="noopener">LinkedIn</a>` : "",
      m.github ? `<a href="${esc(gh(m.github.trim()))}" target="_blank" rel="noopener">GitHub</a>` : "",
    ].join("");
    return `<article class="card${named ? "" : " empty"}">
      <div class="head"><div class="avatar">${avatar}</div><div><h3>${named ? esc(m.name) : "Name to be added"}</h3><span class="role">${esc(m.role)}</span></div></div>
      <div class="label">Built</div><p>${esc(m.built)}</p>
      <div class="label">Background</div>${m.background ? `<p>${esc(m.background)}</p>` : `<p class="muted">To be added.</p>`}
      ${skills}
      ${links ? `<div class="links">${links}</div>` : ""}
    </article>`;
  }).join("");
})();
</script>
</body>
</html>
