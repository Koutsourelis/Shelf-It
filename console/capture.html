<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Σάρωση · ShelfSense</title>
<link rel="icon" href="/ui/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/shell.js"></script>
<!-- Κινητό: φωτογραφία του ραφιού → POST /api/shelf/frame?single=1 → /tasks -->
<style>
  .mobile-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px 36px;
  }
  .lead {
    margin: 6px 0 18px;
    color: var(--label-secondary);
    font-size: var(--fs-callout);
    line-height: 1.45;
  }
  .full-btn {
    width: 100%;
  }
  input[type=file] { display: none; }

  .vf {
    margin-top: 14px;
    border-radius: var(--r-control);
    overflow: hidden;
    background: #141416;
    border: 1px solid var(--surface-border);
    display: none;
  }
  #preview {
    width: 100%;
    max-height: 280px;
    object-fit: contain;
    display: block;
  }

  #status { margin-top: 12px; }
  #status:empty { display: none; }
  label.btn[aria-disabled="true"] { opacity: 0.72; cursor: progress; pointer-events: none; }
  .secondary-nav { margin-top: 12px; }
</style>
</head>
<body class="has-tabbar">
<header class="topbar">
  <a class="brand" href="/"><img src="/ui/logo.svg" alt="">ShelfSense</a>
  <nav class="seg-nav" aria-label="Κύρια πλοήγηση">
    <a href="/">Αρχική</a>
    <a href="/shelf">Ράφι</a>
    <a href="/tasks">Εργασίες</a>
    <a href="/portal/orders">Αποθήκη</a>
    <a href="/dev">Κονσόλα</a>
  </nav>
  <div class="right">
    <button type="button" class="theme-btn" data-theme-toggle aria-label="Εναλλαγή θέματος">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16Z" fill="currentColor" stroke="none"/></svg>
      <span class="theme-lbl">Auto</span>
    </button>
  </div>
</header>

<main class="mobile-wrap">
  <h1 class="page-title">Σάρωση ραφιού</h1>
  <p class="lead">Στάσου μετωπικά ώστε να φαίνονται καθαρά και τα τρία επίπεδα. Η φωτογραφία αναλύεται αμέσως και ενημερώνει την ουρά εργασιών.</p>

  <div class="group-surface group-pad">
    <label id="open" class="btn full-btn" for="photo" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span id="openLbl">Άνοιγμα κάμερας</span>
    </label>
    <input id="photo" type="file" accept="image/*" capture="environment">

    <div class="vf" id="vf">
      <img id="preview" alt="Προεπισκόπηση φωτογραφίας ραφιού">
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <div class="secondary-nav">
    <a id="results" class="btn ghost full-btn" href="/tasks">Προβολή εργασιών</a>
  </div>
</main>

<nav class="ios-tabbar" aria-label="Πλοήγηση κινητού">
  <a href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5Z" stroke-linejoin="round"/></svg>
    <span>Αρχική</span>
  </a>
  <a href="/tasks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke-linecap="round"/></svg>
    <span>Εργασίες</span>
    <span class="tab-badge" data-tab-tasks-badge hidden>0</span>
  </a>
  <a class="on" href="/capture">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span>Σάρωση</span>
  </a>
  <a href="/portal/orders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8Z" stroke-linejoin="round"/><path d="M3.3 8L12 13l8.7-5M12 13v8"/></svg>
    <span>Αποθήκη</span>
  </a>
</nav>

<script>
const $ = id => document.getElementById(id);
const MAX_SIDE = 1600;

fetch("/api/live/status").then(r => r.json()).then(st => window.ShelfSenseShell?.setTaskBadge(st.open)).catch(() => {});

async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(b => ok(b || file), "image/jpeg", 0.88));
  } catch { return file; }
}
const S = window.ShelfSenseShell;
let working = false;
function busy(on, label = "Ανάλυση εικόνας…") {
  working = on;
  $("open").setAttribute("aria-disabled", String(on));
  $("open").setAttribute("aria-busy", String(on));
  $("photo").disabled = on;             // the label opens the picker; block it during the request
  $("openLbl").textContent = on ? label : "Νέα φωτογραφία";
}
$("open").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && !working) { e.preventDefault(); $("photo").click(); }
});
function setMsg(kind, label, detail = "") {
  $("status").innerHTML = kind ? S.stateHTML(kind, label, detail, { box: true }) : "";
}
$("photo").onchange = async () => {
  const file = $("photo").files[0];
  if (!file || working) return;
  $("preview").src = URL.createObjectURL(file);
  $("vf").style.display = "block";
  setMsg("loading", "Αποστολή και έλεγχος ραφιού…", "Μην κλείσεις τη σελίδα.");
  busy(true);
  let redirect = false;
  try {
    const body = new FormData();
    body.append("file", await shrink(file), "shelf.jpg");
    const { data: d } = await S.api("/api/shelf/frame?single=1", { method: "POST", body });
    if (d.status === "busy") {
      // The server was busy with another frame: this photo was NOT analysed. Never shown as a result.
      setMsg("warning", "Η φωτογραφία δεν ελέγχθηκε", "Εκτελείται ήδη άλλη ανάλυση. Πάτησε «Νέα φωτογραφία» σε λίγο.");
    } else if (d.status === "occluded") {
      setMsg("warning", "Περιορισμένη ορατότητα", "Κάτι κρύβει το ράφι. Τράβηξε νέα φωτογραφία χωρίς εμπόδια.");
    } else if ((d.status === "acted" || d.status === "confirmed") && d.unknown_shelf) {
      setMsg("warning", "Ράφι εκτός καταλόγου", "Αξιολογήθηκε μόνο η διάταξη, χωρίς αυτόματες εργασίες. Δες τις προτάσεις.");
    } else if (d.status === "acted" || d.status === "confirmed") {
      const n = (d.tasks || []).length;
      S.setTaskBadge(n);
      setMsg(n ? "warning" : "success",
        n ? `Ελέγχθηκε: ${n} ${n === 1 ? "εκκρεμής εργασία" : "εκκρεμείς εργασίες"}` : "Ελέγχθηκε: το ράφι είναι σωστό",
        "Μετάβαση στις εργασίες…");
      redirect = true;
    } else {
      setMsg("unknown", "Η φωτογραφία ελήφθη", "Το αποτέλεσμα δεν είναι ακόμη οριστικό. Δες τις εργασίες.");
    }
  } catch (e) {
    S.devLog("capture", e);
    setMsg("error", "Ο έλεγχος απέτυχε", S.errorCopy(e, "Πάτησε «Νέα φωτογραφία» για νέα προσπάθεια."));
    S.announce("Ο έλεγχος της φωτογραφίας απέτυχε.", true);
  }
  busy(false);
  if (redirect) setTimeout(() => location.href = "/tasks", 1400);
  $("photo").value = "";
};
</script>
</body>
</html>
