<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Σάρωση Ραφιού · ShelfSense</title>
<link rel="icon" href="/ui/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
<!-- Κινητό: φωτογραφία του ραφιού → POST /api/shelf/frame?single=1 → /tasks.
     Χρησιμοποιεί <input capture>, όχι getUserMedia, άρα δουλεύει και με απλό http στο τοπικό δίκτυο. -->
<style>
  body { padding-bottom: env(safe-area-inset-bottom); }
  .mbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 11px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mbar a.brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--fg);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.02em;
  }
  .mbar a.brand img { width: 22px; height: 22px; border-radius: 5px; }
  .mbar a.back { font-size: 13.5px; font-weight: 500; color: var(--mut); text-decoration: none; }

  .wrap { max-width: 540px; padding: 18px 15px 44px; }
  .lead-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 18px;
    box-shadow: var(--shadow);
  }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
  p.lead { color: var(--mut); font-size: 14px; margin: 0 0 18px; line-height: 1.45; }

  .big {
    display: flex;
    justify-content: center;
    width: 100%;
    min-height: 50px;
    font-size: 15.5px;
  }
  input[type=file] { display: none; }

  .viewfinder {
    position: relative;
    margin-top: 14px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #141b17;
    display: none;
  }
  #preview { width: 100%; max-height: 300px; object-fit: contain; display: block; }

  #status {
    margin: 14px 0 0;
    padding: 10px 12px;
    border-radius: 7px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 14px;
    line-height: 1.4;
    display: none;
  }
  #status.on { display: block; }
  #results { margin-top: 12px; }
</style>
</head>
<body>
<header class="mbar">
  <a class="brand" href="/"><img src="/ui/logo.svg" alt="">Σάρωση ραφιού</a>
  <a class="back" href="/tasks">← Εργασίες</a>
</header>

<main class="wrap">
  <div class="lead-card">
    <h1>Φωτογράφισε το ράφι</h1>
    <p class="lead">Στάσου μετωπικά ώστε να φαίνονται καθαρά και τα τρία επίπεδα. Το σύστημα αναλύει την εικόνα και ενημερώνει αμέσως τις εργασίες.</p>

    <label id="open" class="btn big" for="photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span id="openLbl">Άνοιγμα κάμερας</span>
    </label>
    <input id="photo" type="file" accept="image/*" capture="environment">

    <div class="viewfinder" id="vf">
      <img id="preview" alt="Προεπισκόπηση φωτογραφίας ραφιού">
    </div>

    <div id="status" role="status"></div>
  </div>

  <a id="results" class="btn ghost big" href="/tasks">Προβολή ουράς εργασιών</a>
</main>

<script>
const $ = id => document.getElementById(id);
const MAX_SIDE = 1600;

async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(b => ok(b || file), "image/jpeg", 0.88));
  } catch { return file; }
}
function busy(on) {
  $("open").setAttribute("aria-disabled", on);
  $("openLbl").textContent = on ? "Ανάλυση εικόνας…" : "Νέα φωτογραφία";
}
function setMsg(text) {
  const s = $("status");
  s.textContent = text;
  s.classList.toggle("on", Boolean(text));
}
$("photo").onchange = async () => {
  const file = $("photo").files[0];
  if (!file) return;
  $("preview").src = URL.createObjectURL(file);
  $("vf").style.display = "block";
  setMsg("Αποστολή και έλεγχος ραφιού…");
  busy(true);
  try {
    const body = new FormData();
    body.append("file", await shrink(file), "shelf.jpg");
    const r = await fetch("/api/shelf/frame?single=1", { method: "POST", body });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    if (d.status === "busy" || d.status === "occluded") {
      setMsg(d.status === "busy"
        ? "Εκτελείται ήδη ανάλυση προηγούμενης εικόνας. Δοκίμασε ξανά σε λίγο."
        : "Περιορισμένη ορατότητα στο πλάνο. Δοκίμασε ξανά χωρίς εμπόδια.");
    } else {
      const n = (d.tasks || []).length;
      setMsg((n ? `Ολοκληρώθηκε: ${n} ${n === 1 ? "ενεργή εργασία" : "ενεργές εργασίες"}.` : "Ολοκληρώθηκε: το ράφι είναι σωστό.")
        + " Μετάβαση στις εργασίες…");
      setTimeout(() => location.href = "/tasks", 1100);
    }
  } catch (e) {
    setMsg("Αποτυχία ανάγνωσης: " + e.message);
  }
  busy(false);
  $("photo").value = "";
};
</script>
</body>
</html>
