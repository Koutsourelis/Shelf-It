<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Εργασίες · ShelfSense</title>
<link rel="icon" href="/ui/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/shell.js"></script>
<!-- iOS Inset Grouped Field Queue για κινητό υπαλλήλου -->
<style>
  .mobile-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px 36px;
  }
  .title-bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .sound-btn {
    min-height: 32px;
    padding: 0 10px;
    font-size: 12.5px;
    border-radius: 999px;
  }
  @media (max-width: 767px) {
    .sound-btn { min-height: 44px; padding: 0 12px; }
  }

  .scan-cta {
    width: 100%;
    margin-bottom: 18px;
  }

  /* Flat Inset Grouped Task List (No Card-inside-Card) */
  .task-item {
    border-bottom: 1px solid var(--separator);
  }
  .task-item:last-child { border-bottom: 0; }
  .task-item.fresh {
    animation: highlightRow 600ms var(--apple-ease);
  }
  @keyframes highlightRow {
    from { background: var(--sys-blue-tint); }
    to { background: transparent; }
  }

  .task-item img {
    width: 100%;
    max-height: 210px;
    object-fit: contain;
    display: block;
    background: #141416;
    border-bottom: 1px solid var(--separator);
  }
  .task-body {
    padding: 14px 16px;
  }
  .task-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .task-idx {
    font-family: var(--font-mono);
    font-size: var(--fs-mono);
    color: var(--sys-red);
    font-weight: 600;
    flex: none;
  }
  .task-item.in_progress .task-idx { color: var(--sys-orange); }
  .task-head b {
    font-size: var(--fs-title);
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.012em;
    color: var(--label-primary);
  }
  .task-meta {
    margin-top: 5px;
    font-family: var(--font-mono);
    font-size: var(--fs-mono);
    color: var(--label-secondary);
    font-variant-numeric: tabular-nums;
  }
  .task-actions {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }
  .task-actions button {
    flex: 1;
  }
  .task-progress-note {
    margin-top: 8px;
    font-size: var(--fs-callout);
    color: var(--sys-orange);
  }

  .done-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .done-list li {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--separator);
    font-size: var(--fs-callout);
    color: var(--label-secondary);
  }
  .done-list li:last-child { border-bottom: 0; }
  .done-list svg {
    width: 15px;
    height: 15px;
    stroke-width: 2;
    color: var(--sys-green);
    flex: none;
    transform: translateY(2px);
  }
</style>
</head>
<body class="has-tabbar">
<header class="topbar">
  <a class="brand" href="/"><img src="/ui/logo.svg" alt="">ShelfSense</a>
  <nav class="seg-nav" aria-label="Κύρια πλοήγηση">
    <a href="/">Αρχική</a>
    <a href="/shelf">Ράφι</a>
    <a class="on" href="/tasks">Εργασίες</a>
    <a href="/portal/orders">Αποθήκη</a>
    <a href="/dev">Κονσόλα</a>
  </nav>
  <div class="right">
    <button type="button" id="sound" class="ghost sound-btn" aria-label="Ηχητική ειδοποίηση">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span id="soundLbl">Ήχος</span>
    </button>
    <button type="button" class="theme-btn" data-theme-toggle aria-label="Εναλλαγή θέματος">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16Z" fill="currentColor" stroke="none"/></svg>
      <span class="theme-lbl">Auto</span>
    </button>
  </div>
</header>

<main class="mobile-wrap">
  <div class="title-bar">
    <h1 class="page-title">Εργασίες</h1>
    <span id="stateWrap" role="status" aria-live="polite"><span class="state" data-kind="loading"><span class="state-txt"><span class="state-lbl">Φόρτωση…</span></span></span></span>
  </div>

  <a id="scan" class="btn tinted scan-cta" href="/capture">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
    Σάρωση ραφιού με κάμερα
  </a>

  <div class="sec-head"><h2 class="sec-title">Εκκρεμείς ενέργειες</h2></div>
  <div class="group-surface" id="list"></div>

  <div class="sec-head"><h2 class="sec-title">Προτάσεις διάταξης</h2></div>
  <div class="group-surface" id="proposals"></div>

  <div class="sec-head"><h2 class="sec-title">Ολοκληρώθηκαν πρόσφατα</h2></div>
  <div class="group-surface">
    <ul class="done-list" id="done"></ul>
  </div>
</main>

<nav class="ios-tabbar" aria-label="Πλοήγηση κινητού">
  <a href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5Z" stroke-linejoin="round"/></svg>
    <span>Αρχική</span>
  </a>
  <a class="on" href="/tasks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke-linecap="round"/></svg>
    <span>Εργασίες</span>
    <span class="tab-badge" data-tab-tasks-badge hidden>0</span>
  </a>
  <a href="/capture">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span>Σάρωση</span>
  </a>
  <a href="/portal/orders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8Z" stroke-linejoin="round"/><path d="M3.3 8L12 13l8.7-5M12 13v8"/></svg>
    <span>Αποθήκη</span>
  </a>
</nav>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const WHO = localStorage.getItem("shelf_worker") || "υπάλληλος";
let known = null, soundOn = false, audio;

function beep() {
  navigator.vibrate?.([180, 90, 180]);
  if (!soundOn) return;
  audio = audio || new AudioContext();
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.18);
}

const RULE = { K3: "Χώρος στο ράφι", K4: "Ύψος ματιών", K5: "Κέντρο ραφιού" };
const S = window.ShelfSenseShell;
const claimErr = {};     // task id -> [label, detail] (user-facing only; diagnostics go to S.devLog)
const claiming = new Set();
function propCard(p) {
  const ds = S.decisionState(p.decision);
  return `<div class="prop">
    <div class="prop-head"><span>${esc(p.rule || "Πρόταση")} · ${esc(RULE[p.rule] || "Διάταξη")}</span>${ds ? `<span style="margin-left:auto">${S.stateHTML(ds[0], ds[1])}</span>` : ""}</div>
    <b>${esc(p.text)}</b>
    <p class="why">${esc(p.reason)}</p>
    <div class="num">${esc(p.numbers)}</div>
    <small>${esc(p.note)} Πηγή: ${esc(p.source)}.</small>
  </div>`;
}

function card(t, i, fresh) {
  const order = t.order && t.order.order_no ? ` · Παραγγέλθηκε ${esc(t.order.order_no)}` : "";
  const m = Math.round((Date.now() / 1000 - t.created) / 60), since = m < 1 ? "μόλις τώρα" : `πριν από ${m}′`;
  const idx = String(i + 1).padStart(2, "0");
  const busyNow = claiming.has(t.id);
  const err = claimErr[t.id];
  const act = t.status === "open"
    ? `<div class="task-actions"><button data-claim="${esc(t.id)}"${busyNow ? ` disabled aria-busy="true"` : ""}>${busyNow ? "Καταχώρηση…" : "Ανάληψη"}</button></div>`
      + (err ? `<div style="margin-top:8px">${S.stateHTML("error", err[0], err[1], { box: true })}</div>` : "")
    : `<div class="task-progress-note">${S.stateHTML("pending", "Σε εξέλιξη από " + (t.claimed_by || "υπάλληλο"), "κλείνει αυτόματα όταν η κάμερα δει το ράφι σωστό")}</div>`;
  return `<div class="task-item ${t.status} ${fresh ? "fresh" : ""}">
    ${t.image ? `<img src="/files/${encodeURI(t.image)}" alt="Σημείο στο ράφι">` : ""}
    <div class="task-body">
      <div class="task-head"><span class="task-idx">${idx}</span><b>${esc(t.text)}</b></div>
      <div class="task-meta">${since}${order}</div>
      ${act}
    </div>
  </div>`;
}

let lastData = null;
async function refresh() {
  let d;
  try { d = (await S.api("/api/tasks")).data; }
  catch (e) {
    S.devLog("tasks", e);
    $("stateWrap").innerHTML = S.stateHTML("error", "Χωρίς σύνδεση", "Η λίστα μπορεί να μην είναι τρέχουσα");
    if (!lastData) $("list").innerHTML = `<div class="empty">${S.stateHTML("error", "Οι εργασίες δεν φορτώθηκαν", "Νέα προσπάθεια σε 15 δευτερόλεπτα.")}</div>`;
    return;
  }
  lastData = d;
  const ids = new Set(d.tasks.map(t => t.id));
  const fresh = known ? d.tasks.filter(t => !known.has(t.id)).map(t => t.id) : [];
  if (fresh.length) beep();
  known = ids;
  window.ShelfSenseShell?.setTaskBadge(d.tasks.length);

  $("stateWrap").innerHTML = d.tasks.length
    ? S.stateHTML("warning", `${d.tasks.length} ${d.tasks.length === 1 ? "εκκρεμής" : "εκκρεμείς"}`)
    : S.stateHTML("idle", "Καμία εκκρεμότητα");
  Object.keys(claimErr).forEach(id => { if (!ids.has(id)) delete claimErr[id]; });

  $("list").innerHTML = d.tasks.length
    ? d.tasks.map((t, i) => card(t, i, fresh.includes(t.id))).join("")
    : `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>Καμία εκκρεμής εργασία. Θα ειδοποιηθείς αν προκύψει έλλειψη.</div>`;

  const ps = d.proposals || [];
  $("proposals").innerHTML = ps.length
    ? ps.map(propCard).join("")
    : `<div class="empty">${d.agent_status === "running" ? S.stateHTML("loading", "Ανάλυση πωλήσεων και διάταξης σε εξέλιξη…") : "Καμία πρόταση αλλαγής θέσης."}</div>`;

  $("done").innerHTML = (d.done || []).map(t =>
    `<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${esc(t.text)}</span></li>`
  ).join("") || `<li><span class="tert">Καμία ολοκληρωμένη εργασία ακόμη.</span></li>`;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-claim]"); if (!b) return;
  const id = b.dataset.claim;
  if (claiming.has(id)) return;
  claiming.add(id); delete claimErr[id];
  S.busy(b, "Καταχώρηση…");
  try {
    await S.api(`/api/tasks/${encodeURIComponent(id)}/claim`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ who: WHO })
    });
    S.announce("Η εργασία αναλήφθηκε.");
  } catch (err) {
    S.devLog("claim", err);
    claimErr[id] = ["Η ανάληψη δεν καταχωρήθηκε", err.status === 404 ? "Την έχει ήδη αναλάβει κάποιος ή έκλεισε." : S.errorCopy(err)];
    S.announce("Η ανάληψη δεν καταχωρήθηκε.", true);
  } finally { claiming.delete(id); }
  refresh();
});

$("sound").onclick = () => {
  soundOn = !soundOn;
  $("sound").classList.toggle("on", soundOn);
  $("soundLbl").textContent = soundOn ? "Ενεργός" : "Ήχος";
  if (soundOn) { audio = audio || new AudioContext(); audio.resume(); }
};

const es = new EventSource("/api/events");
es.onmessage = m => {
  const ev = JSON.parse(m.data);
  if (ev.run_id === "system" && ev.type === "shelf_log" && Date.now() / 1000 - ev.ts < 5) refresh();
};
setInterval(refresh, 15000);
refresh();
</script>
</body>
</html>
