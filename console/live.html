<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live ράφι</title>
<!-- Κάτοχος: Άτομο Β. Κάμερα → frame κάθε N δευτερόλεπτα → POST /api/shelf/frame → ζωγραφίζει τα ευρήματα.
     Τα κουτιά έρχονται σε [ymin, xmin, ymax, xmax] 0–1000· η μετατροπή σε pixel γίνεται ΜΟΝΟ στο toPx(). -->
<style>
  :root { --bg:#0f1720; --card:#17212c; --fg:#e8eef4; --mut:#9fb0c0; --ok:#2ea043; --warn:#e69600; --bad:#cf222e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; flex-wrap:wrap; border-bottom:1px solid #253241; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  button, select { background:#1f6feb; color:#fff; border:0; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; }
  button.alt, select { background:#253241; }
  #badge { margin-left:auto; padding:6px 12px; border-radius:999px; font-weight:600; background:#253241; }
  #badge.ok { background:var(--ok); } #badge.bad { background:var(--bad); }
  main { display:grid; grid-template-columns: minmax(0,1fr) 380px; gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .stage { position:relative; background:#000; border-radius:12px; overflow:hidden; }
  video, canvas { width:100%; display:block; }
  canvas { position:absolute; inset:0; height:100%; pointer-events:none; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:14px; color:var(--mut); margin:0 0 10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  ol { margin:0; padding-left:20px; } li { margin:6px 0; line-height:1.35; }
  li.missing, li.misplaced { color:#ffb4b4; } li.low, li.gap { color:#ffd58a; }
  #meta { color:var(--mut); font-size:13px; line-height:1.6; }
  #log { font-family: ui-monospace, Consolas, monospace; font-size:12px; color:var(--mut); max-height:180px; overflow:auto; white-space:pre-wrap; }
  .mock { display:none; } body.is-mock .mock { display:inline-block; }
</style>
</head>
<body>
<header>
  <h1>Live ράφι</h1>
  <select id="cam" title="Κάμερα"></select>
  <button id="toggle">Έναρξη</button>
  <button id="now" class="alt">Scan τώρα</button>
  <button id="file" class="alt">Από αρχείο…</button>
  <input id="fileInput" type="file" accept="image/*" hidden>
  <span class="mock">
    <button class="alt" data-mock="sample_before">mock: χαλασμένο</button>
    <button class="alt" data-mock="sample_after">mock: σωστό</button>
  </span>
  <span id="badge">σε αναμονή</span>
</header>
<main>
  <div>
    <div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div>
  </div>
  <aside>
    <div class="card"><h2>Εργασίες για τον αποθηκάριο</h2><ol id="tasks"><li>Δεν έχει γίνει σάρωση ακόμη.</li></ol></div>
    <div class="card"><h2>Κατάσταση</h2><div id="meta"></div></div>
    <div class="card"><h2>Ιστορικό</h2><div id="log"></div></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
let interval = 30, timer = null, countdown = 0, last = null, sending = false;
const COLORS = { ok:"#2ea043", low:"#e69600", missing:"#cf222e", misplaced:"#cf222e", unknown:"#a371f7", gap:"#cf222e" };

function log(text) {
  const t = new Date().toLocaleTimeString("el-GR");
  $("log").textContent = `${t}  ${text}\n` + $("log").textContent;
}

// ---- κάμερα ----------------------------------------------------------------
async function listCameras() {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  $("cam").innerHTML = devices.map((d, i) => `<option value="${d.deviceId}">${d.label || "Κάμερα " + (i + 1)}</option>`).join("");
}
async function openCamera(deviceId) {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const constraints = { video: deviceId ? { deviceId: { exact: deviceId } }
                                        : { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } };
  video.srcObject = await navigator.mediaDevices.getUserMedia(constraints);
  await video.play();
}

// ---- frame → server ----------------------------------------------------------
function snapshot() {
  const c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext("2d").drawImage(video, 0, 0);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.88));
}
async function send(blob, force = false) {
  if (sending || !blob) return;
  sending = true;
  $("badge").textContent = "διαβάζω…";
  const body = new FormData(); body.append("file", blob, "frame.jpg");
  try {
    const r = await fetch("/api/shelf/frame" + (force ? "?force=1" : ""), { method: "POST", body });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    render(data);
  } catch (e) {
    $("badge").textContent = "σφάλμα"; $("badge").className = "bad"; log("Σφάλμα: " + e.message);
  } finally { sending = false; }
}
async function scan(force = false) { if (video.videoWidth) await send(await snapshot(), force); }

// ---- εμφάνιση ------------------------------------------------------------------
function toPx(box) {                       // [ymin, xmin, ymax, xmax] 0-1000 → [x, y, w, h] στο canvas
  const [y0, x0, y1, x1] = box, W = overlay.width, H = overlay.height;
  return [x0 * W / 1000, y0 * H / 1000, (x1 - x0) * W / 1000, (y1 - y0) * H / 1000];
}
function draw() {
  overlay.width = overlay.clientWidth; overlay.height = overlay.clientHeight;
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (!last || !last.items) return;
  const statusOf = {};
  (last.findings || []).forEach(f => { if (f.sku) statusOf[f.sku] = f.type; });
  ctx.lineWidth = 3; ctx.font = "bold 14px system-ui";
  const box = (b, color, text) => {
    const [x, y, w, h] = toPx(b);
    ctx.strokeStyle = color; ctx.strokeRect(x, y, w, h);
    const tw = ctx.measureText(text).width + 10;
    ctx.fillStyle = color; ctx.fillRect(x, Math.max(y - 20, 0), tw, 20);
    ctx.fillStyle = "#fff"; ctx.fillText(text, x + 5, Math.max(y - 5, 15));
  };
  last.items.forEach(it => { if (it.box_2d) {
    const st = !it.sku ? "unknown" : (statusOf[it.sku] || "ok");
    box(it.box_2d, COLORS[st], it.sku || "?");
  }});
  (last.gaps || []).forEach(g => box(g.box_2d, COLORS.gap, "κενό"));
}
function render(d) {
  if (d.status === "busy") return;
  if (d.status === "occluded") { $("badge").textContent = "κάτι κρύβει το ράφι"; $("badge").className = ""; log(d.detail); return; }
  last = d; draw();
  const bad = d.findings && d.findings.length;
  $("badge").textContent = d.shelf_ok ? "ράφι σωστό" : `${bad} ευρήματα`;
  $("badge").className = d.shelf_ok ? "ok" : "bad";
  $("tasks").innerHTML = d.shelf_ok ? "<li>Όλα στη θέση τους.</li>"
    : d.findings.map(f => `<li class="${f.type}">${f.msg}</li>`).join("");
  $("meta").innerHTML = `Frame: ${d.frame || "-"} · ${d.seconds ?? "-"} s<br>`
    + `Επιβεβαίωση: ${d.confirm || "-"} · κατάσταση: <b>${d.status}</b>`
    + (d.agent_run ? `<br>Agent: <a href="/" target="_blank" style="color:#7cb7ff">${d.agent_run}</a>` : "");
  log(d.status === "unchanged" ? `ίδιο frame (διαφορά ${d.diff}), χωρίς κλήση στο μοντέλο`
    : `${d.status}: ${bad || 0} ευρήματα σε ${d.seconds} s`);
}

// ---- βρόχος -----------------------------------------------------------------
function tick() {
  countdown -= 1;
  if (!sending) $("toggle").textContent = `Παύση (${Math.max(countdown, 0)} s)`;
  if (countdown <= 0) { countdown = interval; scan(); }
}
$("toggle").onclick = () => {
  if (timer) { clearInterval(timer); timer = null; $("toggle").textContent = "Έναρξη"; return; }
  countdown = 1; timer = setInterval(tick, 1000);
};
$("now").onclick = () => { scan(true); countdown = interval; };
$("cam").onchange = e => openCamera(e.target.value);
$("file").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => { const f = e.target.files[0]; if (f) send(f, true); };
document.querySelectorAll("[data-mock]").forEach(b => b.onclick = async () => {
  await fetch("/api/live/mock/" + b.dataset.mock, { method: "POST" }); log("mock → " + b.dataset.mock); scan(true);
});
window.addEventListener("resize", draw);

(async () => {
  const s = await (await fetch("/api/live/status")).json();
  interval = s.interval; if (s.provider === "mock") document.body.classList.add("is-mock");
  $("meta").textContent = `Μοντέλο: ${s.provider} · frame κάθε ${interval} s · επιβεβαίωση σε ${s.confirm_frames} frames`;
  try { await openCamera(); await listCameras(); }
  catch (e) { log("Κάμερα: " + e.message + " (θέλει localhost ή https). Χρησιμοποίησε «Από αρχείο…»."); }
})();
</script>
</body>
</html>
