<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Ράφι · Shelf-it</title>
<link rel="icon" href="/ui/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/shell.js"></script>
<!-- Οθόνη ραφιού (macOS Split View: Stage + Inspector Sidebar).
     Τα κουτιά έρχονται σε [ymin, xmin, ymax, xmax] 0–1000· η μετατροπή σε pixel γίνεται ΜΟΝΟ στο toPx(). -->
<style>
  @media (min-width: 1024px) {
    html, body { height: 100%; overflow: hidden; }
    main.split-view {
      height: calc(100dvh - 52px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 376px;
    }
    .stage-pane {
      overflow-y: auto;
      padding: 16px 20px 24px;
    }
    aside.inspector {
      height: 100%;
      overflow-y: auto;
      background: var(--bg-primary);
      border-left: 1px solid var(--separator);
      display: flex;
      flex-direction: column;
    }
  }

  @media (max-width: 1023px) {
    main.split-view {
      display: flex;
      flex-direction: column;
    }
    .stage-pane { padding: 14px 16px 18px; }
    aside.inspector {
      background: var(--bg-primary);
      border-top: 1px solid var(--separator);
    }
  }

  /* Flat Status Header above Camera Stage */
  .light {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 4px 2px 12px;
    flex-wrap: wrap;
  }
  .light { align-items: flex-start; flex-wrap: nowrap; }
  .light .light-ico { display: inline-flex; flex: none; margin-top: 1px; color: var(--label-tertiary); }
  .light .light-main { flex: 1 1 0; }
  .light .light-ico .state-ico { width: 18px; height: 18px; margin: 0; color: inherit; }
  .light[data-kind="loading"] .light-ico { color: var(--sys-blue); }
  .light[data-kind="pending"] .light-ico { color: var(--sys-indigo); }
  .light[data-kind="success"] .light-ico { color: var(--sys-green); }
  .light[data-kind="warning"] .light-ico { color: var(--sys-orange); }
  .light[data-kind="error"] .light-ico { color: var(--sys-red); }
  .light-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .light b {
    font-size: var(--fs-title);
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--label-primary);
  }
  .light span {
    font-size: var(--fs-callout);
    color: var(--label-secondary);
  }
  .light .right {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: var(--fs-mono);
    color: var(--label-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* 16:9 Camera Stage */
  .stage {
    position: relative;
    background: #141416;
    border: 1px solid var(--surface-border);
    border-radius: var(--r-group);
    overflow: hidden;
    aspect-ratio: 16 / 9;
    box-shadow: var(--surface-shadow);
  }
  .stage canvas, .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .stage canvas { pointer-events: none; }
  .stage .hint {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(235, 235, 245, 0.72);
    text-align: center;
    padding: 24px;
    font-size: var(--fs-body);
    line-height: 1.5;
  }
  .stage .hint[hidden], .stage img[hidden] { display: none !important; }
  .stage .hint a { color: #64D2FF; }
  .stage .hint code { background: rgba(255, 255, 255, 0.12); color: #F5F5F7; }

  /* Floating Apple HIG View Switcher & Status Pill on Stage */
  .stage-bar {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 6;
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    border-radius: 999px;
    background: rgba(28, 28, 30, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.14);
  }
  .stage-bar[hidden] { display: none !important; }
  .stage-bar button {
    min-height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: rgba(235, 235, 245, 0.82);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }
  .stage-bar button:hover { color: #FFFFFF; background: rgba(255, 255, 255, 0.08); }
  .stage-bar button.on {
    background: var(--sys-blue);
    color: #FFFFFF;
    font-weight: 600;
  }
  .stage-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 6;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: #FFFFFF;
    background: rgba(28, 28, 30, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    pointer-events: none;
  }
  .stage-badge[hidden] { display: none !important; }
  .stage-badge::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #34C759;
  }
  .stage-badge.loading::before {
    background: #0A84FF;
    animation: pulseDot 1.1s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  /* Subtle top indeterminate progress bar instead of theatrical laser */
  .scan {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 2px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 150ms var(--apple-ease);
  }
  .scan::after {
    content: "";
    display: block;
    width: 38%;
    height: 100%;
    background: var(--sys-blue);
    transform: translateX(-100%);
  }
  .scan.on { opacity: 1; }
  .scan.on::after { animation: barSlide 1.2s var(--apple-ease) infinite; }
  @keyframes barSlide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(360%); }
  }

  /* Action Bar & Optional Dev Row */
  .bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .bar .bar-state { flex: 1 1 220px; min-width: 0; }
  .bar .bar-state:empty { display: none; }
  .bar .count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: var(--fs-mono);
    color: var(--label-secondary);
    font-variant-numeric: tabular-nums;
  }

  .devbar {
    display: none;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--separator);
  }
  .devonly { display: none !important; }
  body.dev .devonly { display: block !important; }
  body.dev .devbar { display: flex !important; }
  #devinfo {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--label-secondary);
    background: var(--bg-primary);
    border: 1px solid var(--surface-border);
    border-radius: var(--r-control);
    padding: 10px 12px;
    white-space: pre-wrap;
    margin-top: 10px;
    max-height: 180px;
    overflow: auto;
  }

  /* Right Inspector Sidebar — Flat Hairline Sections (NO Card-in-Card) */
  .insp-sec {
    border-bottom: 1px solid var(--separator);
  }
  .insp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 8px;
  }
  .insp-count {
    font-family: var(--font-mono);
    font-size: var(--fs-foot);
    color: var(--label-secondary);
  }

  .task-row {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    gap: 12px;
    padding: 10px 16px;
    border-top: 1px solid var(--separator);
    align-items: start;
  }
  .task-row:first-child { border-top: 0; }
  .task-row .thumb {
    width: 48px;
    height: 48px;
    border-radius: 6px;
    background: var(--bg-secondary) center / cover no-repeat;
    border: 1px solid var(--surface-border);
    display: grid;
    place-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--label-secondary);
  }
  .task-row .thumb.restock { color: var(--sys-red); background-color: var(--sys-red-tint); border-color: transparent; }
  .task-row .thumb.relocate, .task-row .thumb.tidy, .task-row .thumb.remove {
    color: var(--sys-orange); background-color: var(--sys-orange-tint); border-color: transparent;
  }
  .task-row b {
    display: block;
    font-size: var(--fs-body);
    font-weight: 600;
    line-height: 1.36;
    color: var(--label-primary);
  }
  .task-row .meta {
    margin-top: 3px;
    font-size: var(--fs-callout);
    color: var(--label-secondary);
    line-height: 1.38;
  }
  .task-row .row-state { margin-top: 6px; }
  .task-row .acts {
    margin-top: 8px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .insp-tabs-wrap {
    padding: 12px 16px 8px;
  }
  .insp-panel[hidden] { display: none !important; }

  /* 3-Tier Layout Rows */
  .lay-summary {
    margin: 0;
    padding: 8px 16px 10px;
    font-size: var(--fs-callout);
    color: var(--label-secondary);
    line-height: 1.45;
    border-bottom: 1px solid var(--separator);
  }
  .lay {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr);
    gap: 2px 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--separator);
    font-size: var(--fs-body);
  }
  .lay:last-child { border-bottom: 0; }
  .lay b {
    font-size: var(--fs-callout);
    font-weight: 500;
    color: var(--label-secondary);
  }
  .lay span { color: var(--label-primary); line-height: 1.4; }
  .lay small {
    grid-column: 2;
    font-size: var(--fs-foot);
    color: var(--label-tertiary);
    line-height: 1.38;
  }

  /* Suggestions in the layout panel: what to refill, what to move, and why */
  .sug-head {
    padding: 12px 16px 4px;
    font-size: var(--fs-foot);
    font-weight: 600;
    color: var(--label-secondary);
  }
  .sug {
    padding: 8px 16px 9px;
    border-bottom: 1px solid var(--separator);
    font-size: var(--fs-body);
    line-height: 1.38;
  }
  .sug b { font-weight: 600; color: var(--label-primary); overflow-wrap: anywhere; }
  .sug .to { font-weight: 600; white-space: nowrap; }
  .sug.move .to { color: var(--sys-indigo); }
  .sug.task .to { color: var(--sys-red); }
  .sug.fill .to { color: var(--sys-orange); }
  .sug p { margin: 3px 0 0; font-size: var(--fs-callout); color: var(--label-secondary); }
  .sug small { display: block; margin-top: 3px; font-size: var(--fs-foot); color: var(--label-tertiary); }

  /* Product list: what the camera read, with its Open Food Facts identity */
  .prod-level {
    padding: 10px 16px 4px;
    font-size: var(--fs-foot);
    font-weight: 600;
    color: var(--label-secondary);
  }
  .prod-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2px 10px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--separator);
    font-size: var(--fs-body);
  }
  .prod-row b { font-weight: 600; color: var(--label-primary); line-height: 1.36; overflow-wrap: anywhere; }
  .prod-row .n { font-family: var(--font-mono); font-size: var(--fs-mono); color: var(--label-secondary); }
  .prod-row small { grid-column: 1 / -1; font-size: var(--fs-foot); color: var(--label-tertiary); line-height: 1.38; }
  .prod-row small a { color: var(--sys-blue); }
  .prod-note { margin: 0; padding: 10px 16px; font-size: var(--fs-foot); color: var(--label-tertiary); line-height: 1.4; }

  /* Flat Event Log */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li {
    display: grid;
    grid-template-columns: 38px 8px minmax(0, 1fr);
    gap: 8px;
    align-items: baseline;
    padding: 8px 16px;
    border-bottom: 1px solid var(--separator);
    font-size: var(--fs-callout);
    line-height: 1.4;
    color: var(--label-primary);
  }
  .tl li:last-child { border-bottom: 0; }
  .tl time {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--label-tertiary);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body class="has-tabbar">
<header class="topbar">
  <a class="brand" href="/"><img src="/ui/logo.svg" alt="">Shelf-it</a>
  <nav class="seg-nav" aria-label="Κύρια πλοήγηση">
    <a href="/">Αρχική</a>
    <a class="on" href="/shelf">Ράφι</a>
    <a href="/tasks">Εργασίες</a>
    <a href="/portal/orders">Αποθήκη</a>
    <a href="/dev">Κονσόλα</a>
  </nav>
  <div class="right">
    <button type="button" class="ghost" id="devToggle" style="min-height:24px;padding:0 9px;font-size:12px">Δοκιμές</button>
    <span class="mono mut" id="mode" style="font-size:11.5px">…</span>
    <button type="button" class="theme-btn" data-theme-toggle aria-label="Εναλλαγή θέματος">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16Z" fill="currentColor" stroke="none"/></svg>
      <span class="theme-lbl">Auto</span>
    </button>
  </div>
</header>

<main class="split-view">
  <section class="stage-pane">
    <div class="light" id="light" data-kind="loading" role="status" aria-live="polite">
      <span class="light-ico" id="lightIco" aria-hidden="true"></span>
      <div class="light-main">
        <span id="lightPrev" hidden>Προηγούμενο αποτέλεσμα:</span>
        <b id="lightTitle">Φόρτωση…</b>
        <span id="lightSub"></span>
      </div>
      <div class="right" id="lightRight"></div>
    </div>

    <div class="stage" id="stage">
      <img id="still" alt="Εικόνα ραφιού" hidden>
      <canvas id="overlay"></canvas>
      <div class="stage-badge" id="stageBadge" hidden></div>
      <div class="stage-bar" id="stageBar" role="tablist" aria-label="Προβολή εικόνας ραφιού" hidden>
        <button type="button" data-sview="corrected" class="on">Διορθωμένο ράφι</button>
        <button type="button" data-sview="ar">Αρχική λήψη (AR)</button>
        <button type="button" data-sview="live" id="sviewLiveBtn" hidden>Κάμερα κινητού</button>
      </div>
      <div class="scan" id="scan"></div>
      <div class="hint" id="hint" hidden></div>
    </div>

    <div class="bar">
      <button id="now" type="button">Έλεγχος τώρα</button>
      <button id="pickPhotoBtn" type="button" class="ghost">Από αρχείο…</button>
      <button id="pause" class="ghost" title="Παύση ή συνέχεια της κάμερας κινητού (/cam)">Παύση</button>
      <button id="ref" class="ghost" title="Αποθήκευση τρέχοντος frame ως εικόνας αναφοράς">Ορισμός αναφοράς</button>
      <span class="bar-state" id="barState"></span>
      <span class="count" id="count" aria-hidden="true"></span>
    </div>

    <div class="devbar">
      <button class="ghost" id="file">Από αρχείο…</button>
      <button class="ghost" data-mock="sample_before">Mock: Έλλειψη</button>
      <button class="ghost" data-mock="sample_after">Mock: Σωστό</button>
      <button class="ghost" id="reset">Μηδενισμός</button>
      <input id="fileInput" type="file" accept="image/*" hidden>
    </div>

    <div id="devinfo" class="devonly"></div>
  </section>

  <aside class="inspector" aria-label="Πίνακας στοιχείων ραφιού">
    <div class="insp-sec">
      <div class="insp-head">
        <h2 class="sec-title">Εργασίες υπαλλήλου</h2>
        <span class="insp-count" id="taskCount">0</span>
      </div>
      <div id="tasks"></div>
    </div>

    <div class="insp-tabs-wrap">
      <div class="seg" role="tablist" aria-label="Προβολή λεπτομερειών">
        <button type="button" class="on" role="tab" aria-selected="true" data-insp="plan">Διάταξη</button>
        <button type="button" role="tab" aria-selected="false" data-insp="products">Προϊόντα</button>
        <button type="button" role="tab" aria-selected="false" data-insp="timeline">Ιστορικό</button>
      </div>
    </div>

    <div id="panel-plan" class="insp-panel">
      <div id="plan"><div class="empty">Αναμονή πρώτης λήψης…</div></div>
    </div>

    <div id="panel-products" class="insp-panel" hidden>
      <div id="products"><div class="empty">Αναμονή πρώτης λήψης…</div></div>
    </div>

    <div id="panel-timeline" class="insp-panel" hidden>
      <ul class="tl" id="timeline"></ul>
    </div>
  </aside>
</main>

  </a>

</nav>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let isDev = params.has("dev");
function applyDev() {
  document.body.classList.toggle("dev", isDev);
  $("devToggle").classList.toggle("on", isDev);
}
$("devToggle").onclick = () => {
  isDev = !isDev;
  const url = new URL(location.href);
  if (isDev) url.searchParams.set("dev", "1"); else url.searchParams.delete("dev");
  history.replaceState(null, "", url);
  applyDev();
};
applyDev();

// Segmented Control in Inspector (Διάταξη | Ιστορικό)
document.querySelectorAll("[data-insp]").forEach(btn => {
  btn.onclick = () => {
    const target = btn.dataset.insp;
    document.querySelectorAll("[data-insp]").forEach(b => {
      const on = b === btn;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", String(on));
    });
    $("panel-plan").hidden = target !== "plan";
    $("panel-products").hidden = target !== "products";
    $("panel-timeline").hidden = target !== "timeline";
  };
});

// Η οθόνη δεν ανοίγει κάμερα του υπολογιστή. Δείχνει την τελευταία φωτογραφία που αναλύθηκε: από αρχείο, από το
// κινητό (/cam, /capture) ή από το Telegram. Ζωντανή εικόνα υπάρχει μόνο όταν τη στέλνει το κινητό από το /cam.
const overlay = $("overlay"), ctx = overlay.getContext("2d");
let paused = false, last = null, sending = false, usingFile = false;
let lastPreviewTs = 0, prevBlobUrl = null, previewPolling = false, lastShownFrame = "";
let stageView = "auto", userPickedViewForFrame = "", lastCorrectedShown = "", activeStillUrl = "";

// Apple System Colors for AR Bounding Boxes
const COLORS = {
  ok: "#34C759",
  low: "#FF9500",
  missing: "#FF3B30",
  misplaced: "#FF3B30",
  unknown: "#AF52DE",
  seen: "#0A84FF",
  gap: "#FF3B30"
};
const KIND_LABEL = { restock: "Έλλειψη", relocate: "Θέση", remove: "Ξένο", tidy: "Τάξη" };
const KIND_DOT = {
  restock: "bad", relocate: "warn", remove: "warn", tidy: "warn", task: "bad",
  order: "blue", done: "ok", claim: "warn", approval: "warn", setup: "blue",
  proposal: "indigo", agent: "indigo", foreign: "warn"
};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hhmm = ts => new Date(ts * 1000).toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit", hour12: false });

const S = window.ShelfSenseShell;
const devLog = (label, err) => {
  if (!err) return;
  S.devLog(label, err);
  const line = `[${new Date().toLocaleTimeString("el-GR", { hour12: false })}] ${label}: ${err.tech || err.message || err}`;
  $("devinfo").dataset.err = line;
  $("devinfo").textContent = line + "\n" + ($("devinfo").dataset.base || "");
};
function setBarState(kind, label, detail = "") {
  $("barState").innerHTML = kind ? S.stateHTML(kind, label, detail) : "";
}
function syncNow() {
  const b = $("now");
  b.disabled = sending;
  if (sending) { b.setAttribute("aria-busy", "true"); b.textContent = "Έλεγχος…"; }
  else { b.removeAttribute("aria-busy"); b.textContent = "Έλεγχος τώρα"; }
}

async function send(blob, force = false) {
  if (sending || !blob) return;
  sending = true; $("scan").classList.add("on"); syncNow();
  if (hasPrevResult() && $("light").dataset.assessment === "1") {
    // Keep the last completed result visible, but label it as previous while the new frame is analysed.
    $("lightPrev").hidden = false;
    $("lightRight").innerHTML = S.stateHTML("loading", "Ανάλυση νέας λήψης…");
  } else {
    setLight("loading", "Ανάλυση λήψης…", "Το αποτέλεσμα εμφανίζεται μόλις ολοκληρωθεί.");
  }
  const body = new FormData(); body.append("file", blob, "frame.jpg");
  try {
    const { data } = await S.api("/api/shelf/frame" + (force ? "?force=1" : ""), { method: "POST", body });
    render(data);
    if (data && data.correcting && !data.corrected_frame) {
      setTimeout(() => { if (last && !last.corrected_frame) refreshStatus().catch(() => {}); }, 11500);
    }
  } catch (e) {
    devLog("frame", e);
    setLight("error", "Ο έλεγχος απέτυχε", S.errorCopy(e, "Πάτησε «Έλεγχος τώρα» για νέα προσπάθεια."));
    S.announce("Ο έλεγχος του ραφιού απέτυχε.", true);
  } finally { sending = false; $("scan").classList.remove("on"); syncNow(); }
}
function frameRect() {
  const W = overlay.clientWidth, H = overlay.clientHeight;
  const el = $("still");
  const vw = el.naturalWidth || 16, vh = el.naturalHeight || 9;
  const s = Math.min(W / vw, H / vh), w = vw * s, h = vh * s;
  return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}
function toPx(box, f) {
  const [y0, x0, y1, x1] = box;
  return [f.x + x0 * f.w / 1000, f.y + y0 * f.h / 1000, (x1 - x0) * f.w / 1000, (y1 - y0) * f.h / 1000];
}
function draw() {
  overlay.width = overlay.clientWidth; overlay.height = overlay.clientHeight;
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (!last || !last.shelves) return;
  if (stageView === "corrected" && last.corrected_frame) return;
  const f = frameRect(), statusOf = {};
  (last.findings || []).forEach(x => { if (x.sku) statusOf[x.sku] = x.type; });
  ctx.lineWidth = 2;
  ctx.font = "600 12px 'SF Mono', ui-monospace, Menlo, monospace";
  const box = (b, color, text) => {
    const [x, y, w, h] = toPx(b, f);
    ctx.strokeStyle = color;
    ctx.strokeRect(x, y, w, h);
    if (!text) return;
    const room = Math.max(w, 64) - 10;                 // το όνομα κόβεται στο πλάτος του πλαισίου
    if (ctx.measureText(text).width > room) {
      while (text.length > 1 && ctx.measureText(text + "…").width > room) text = text.slice(0, -1);
      text = text.trimEnd() + "…";
    }
    const tw = ctx.measureText(text).width + 10;
    const ty = Math.max(y - 20, 0);
    ctx.fillStyle = color;
    ctx.fillRect(x, ty, tw, 20);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillText(text, x + 5, ty + 14);
  };
  // Ομάδες χωρίς κωδικό με εύρημα (γέμισμα, αλλαγή επιπέδου, ξένο): ταιριάζουν με το εύρημα από το όνομα.
  const flagged = {}, need = {};
  (last.findings || []).forEach(x => {
    if (!x.sku && ["misplaced", "unknown", "low"].includes(x.type) && !flagged[x.label]) flagged[x.label] = x.type;
    if (x.type === "low") need[x.sku || x.label] = x.need;
  });
  (last.shelves || []).forEach(sh => (sh.items || []).forEach(it => {
    if (!it.box_2d) return;
    const name = it.name || it.label || "";
    const st = it.sku ? (statusOf[it.sku] || (it.placement_ok === false ? "misplaced" : "ok"))
      : (flagged[it.label] || (it.placement_ok === false ? "misplaced" : (last.unknown_shelf && name ? "seen" : "unknown")));
    const more = st === "low" && need[it.sku || it.label] ? `+${need[it.sku || it.label]} · ` : "";   // πόσες προσόψεις λείπουν
    box(it.box_2d, COLORS[st], more + (name || it.sku || "?"));
  }));
  // Κενά του ραφιού που θέλουν γέμισμα: διακεκομμένο πλαίσιο πάνω στον άδειο χώρο.
  (last.findings || []).forEach(x => {
    if (x.type !== "gap" && x.type !== "missing") return;
    const color = x.type === "gap" ? COLORS.low : COLORS.missing;      // το άδειο σημείο ενός κωδικού που λείπει: κόκκινο
    (x.boxes || []).forEach((b, i) => {
      const [gx, gy, gw, gh] = toPx(b, f);
      ctx.save(); ctx.setLineDash([6, 4]); ctx.lineWidth = 2.5; ctx.strokeStyle = color;
      ctx.fillStyle = x.type === "gap" ? "rgba(255,149,0,0.16)" : "rgba(255,59,48,0.16)";
      ctx.fillRect(gx, gy, gw, gh); ctx.strokeRect(gx, gy, gw, gh); ctx.restore();
      if (i === 0) box(b, color, x.type === "gap" ? `Γέμισε +${x.need}` : `Λείπει · ${x.label}`);
    });
  });
  // Ένα βέλος για κάθε προϊόν που πρέπει να αλλάξει ράφι: κόκκινο = εργασία υπαλλήλου, indigo = πρόταση διάταξης.
  const bands = levelBands();
  (last.findings || []).forEach(x => {
    if (x.type === "misplaced" && x.boxes && x.boxes[0]) moveArrow(x.boxes[0], x.to_level, COLORS.misplaced, bands, f);
  });
  (last.moves || []).forEach(m => { if (m.box) moveArrow(m.box, m.to_level, "#5856D6", bands, f); });
  (last.proposals || []).forEach(p => arrow(p, f));
}

const SHELF_EL = { top: "Πάνω ράφι", eye: "Ύψος ματιών", bottom: "Κάτω ράφι" };
// Πού βρίσκεται κάθε επίπεδο στην εικόνα (0–1000), από τα πλαίσια των προϊόντων που στέκονται εκεί.
function levelBands() {
  const acc = {};
  (last.shelves || []).forEach(sh => (sh.items || []).forEach(it => {
    if (!it.box_2d) return;
    const a = acc[sh.level] || (acc[sh.level] = { y0: 1000, y1: 0 });
    a.y0 = Math.min(a.y0, it.box_2d[0]); a.y1 = Math.max(a.y1, it.box_2d[2]);
  }));
  const all = Object.values(acc);
  if (!all.length) return acc;
  const lo = Math.min(...all.map(a => a.y0)), hi = Math.max(...all.map(a => a.y1));
  ["top", "eye", "bottom"].forEach((lv, i) => {        // επίπεδο χωρίς προϊόντα: το αντίστοιχο τρίτο του ραφιού
    if (!acc[lv]) acc[lv] = { y0: lo + (hi - lo) * i / 3, y1: lo + (hi - lo) * (i + 1) / 3 };
  });
  return acc;
}
// Βέλος από το προϊόν προς το ράφι όπου πρέπει να πάει, με το όνομα του ραφιού στην άκρη.
function moveArrow(b, toLevel, color, bands, f) {
  const band = bands[toLevel];
  if (!band) return;
  const [x, y, w, h] = toPx(b, f);
  const down = (band.y0 + band.y1) / 2 > (b[0] + b[2]) / 2;
  const edge = down ? band.y0 + (band.y1 - band.y0) * 0.22 : band.y1 - (band.y1 - band.y0) * 0.22;
  const cx = x + w / 2, y0 = down ? y + h : y, y1 = f.y + edge * f.h / 1000;
  if (Math.abs(y1 - y0) < 14) return;
  ctx.save();
  ctx.setLineDash([6, 4]); ctx.lineWidth = 2.5; ctx.strokeStyle = color;
  ctx.strokeRect(x - 3, y - 3, w + 6, h + 6);
  ctx.setLineDash([]); ctx.lineCap = "round";
  const line = (width, style) => {
    ctx.lineWidth = width; ctx.strokeStyle = style;
    ctx.beginPath(); ctx.moveTo(cx, y0); ctx.lineTo(cx, y1 - (down ? 10 : -10)); ctx.stroke();
  };
  line(7, "rgba(255,255,255,0.9)"); line(3.5, color);              // λευκό περίγραμμα: φαίνεται πάνω σε κάθε συσκευασία
  const r = 12, dir = down ? 1 : -1;
  ctx.beginPath(); ctx.moveTo(cx, y1); ctx.lineTo(cx - r * 0.75, y1 - dir * r); ctx.lineTo(cx + r * 0.75, y1 - dir * r); ctx.closePath();
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.stroke();
  ctx.fillStyle = color; ctx.fill();
  // Η ετικέτα κάθεται πάνω στο ίδιο το προϊόν (στην άκρη απ' όπου φεύγει το βέλος): δύο ετικέτες δεν πέφτουν ποτέ
  // η μία πάνω στην άλλη, ακόμη κι όταν πολλά βέλη καταλήγουν στο ίδιο ράφι.
  const label = (down ? "↓ " : "↑ ") + (SHELF_EL[toLevel] || toLevel);
  ctx.font = "600 11.5px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
  const tw = ctx.measureText(label).width + 12, ly = down ? y + h - 24 : y + 4;
  const lx = Math.min(Math.max(cx - tw / 2, f.x), f.x + f.w - tw);
  ctx.fillStyle = color; ctx.fillRect(lx, ly, tw, 20);
  ctx.fillStyle = "#FFFFFF"; ctx.fillText(label, lx + 6, ly + 14);
  ctx.restore();
}

function arrow(p, f) {
  const INDIGO = "#5856D6", sides = [p.a, p.b].filter(s => s && s.box);
  ctx.save();
  ctx.strokeStyle = INDIGO; ctx.fillStyle = INDIGO; ctx.lineWidth = 2.5; ctx.setLineDash([7, 5]);
  sides.forEach(s => { const [x, y, w, h] = toPx(s.box, f); ctx.strokeRect(x - 3, y - 3, w + 6, h + 6); });
  ctx.setLineDash([]);
  if (sides.length === 2) {
    const mid = s => { const [x, y, w, h] = toPx(s.box, f); return [x + w / 2, y + h / 2]; };
    const [x0, y0] = mid(p.a), [x1, y1] = mid(p.b);
    const cx = (x0 + x1) / 2 + (y1 - y0) * 0.22, cy = (y0 + y1) / 2 - (x1 - x0) * 0.22;
    ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke();
    const head = (x, y, fx, fy) => {
      const a = Math.atan2(y - fy, x - fx), r = 13;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - r * Math.cos(a - 0.45), y - r * Math.sin(a - 0.45));
      ctx.lineTo(x - r * Math.cos(a + 0.45), y - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
    };
    head(x1, y1, cx, cy);
    if (p.kind === "swap") head(x0, y0, cx, cy);
    const label = p.kind === "swap" ? "Αλλαγή θέσης" : "+1 πρόσοψη";
    ctx.font = "500 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
    const tw = ctx.measureText(label).width + 12;
    const lx = (x0 + 2 * cx + x1) / 4, ly = (y0 + 2 * cy + y1) / 4;
    ctx.fillRect(lx - tw / 2, ly - 10, tw, 20);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillText(label, lx - tw / 2 + 6, ly + 4);
  }
  ctx.restore();
}

const RULE = { K3: "Χώρος στο ράφι", K4: "Ύψος ματιών", K5: "Κέντρο ραφιού", K7: "Προορισμός κάτω δεξιά", K8: "Βαριά συσκευασία κάτω" };
const evidCache = {};          // proposal id -> html (successful loads only; errors are retried)
const evidErr = {};            // proposal id -> state html
const openTalkerForms = new Set();
const inflight = new Set();    // "rec:<rid>", "order:<taskId>", "evid:<pid>" — survives re-renders from SSE
const propUi = {};             // rid -> [kind, label, detail, tech] shown next to the proposal
const rowUi = {};              // task id -> [kind, label, detail, tech]

const busyAttr = (key, label) => inflight.has(key) ? ` disabled aria-busy="true" data-busy-label="${esc(label)}"` : "";

function propCard(p) {
  const rid = p.recommendation_id || "";
  const sku = p.featured_sku || (p.b && p.b.sku) || "";
  const dec = p.decision;
  const ds = S.decisionState(dec);
  const decBadge = ds ? `<span style="margin-left:auto">${S.stateHTML(ds[0], ds[1])}</span>` : "";
  const recBusy = inflight.has("rec:" + rid);
  const decided = dec === "accepted" || dec === "corrected";

  let actions = "";
  if (rid) {
    const lock = recBusy ? " disabled" : "";
    actions = `<div class="prop-acts">
      ${!decided ? `<button type="button" data-rec="${esc(rid)}" data-dec="accepted"${recBusy && propUi[rid]?.[4] === "accepted" ? ` disabled aria-busy="true"` : lock}>${recBusy && propUi[rid]?.[4] === "accepted" ? "Αποθήκευση…" : "Αποδοχή"}</button>` : ""}
      <button type="button" class="${decided && !p.talker_file ? "tinted" : "ghost"}" data-talker-toggle="${esc(rid)}" aria-expanded="${openTalkerForms.has(rid)}"${lock}>Ταμπελάκι</button>
      ${sku ? `<button type="button" class="ghost" data-evid="${esc(sku)}" data-prop="${esc(p.id)}" aria-expanded="${Boolean(evidCache[p.id])}"${busyAttr("evid:" + p.id, "Φόρτωση…")}>${inflight.has("evid:" + p.id) ? "Φόρτωση…" : (evidCache[p.id] ? "Απόκρυψη τεκμηρίων" : "Τεκμήρια")}</button>` : ""}
      ${dec !== "rejected" ? `<button type="button" class="ghost" data-rec="${esc(rid)}" data-dec="rejected"${recBusy && propUi[rid]?.[4] === "rejected" ? ` disabled aria-busy="true"` : lock}>${recBusy && propUi[rid]?.[4] === "rejected" ? "Αποθήκευση…" : "Απόρριψη"}</button>` : ""}
    </div>`;
  }

  const formOpen = rid && openTalkerForms.has(rid);
  const defName = p.featured_name || (p.b && p.b.name) || "";
  const defPrice = p.unit_price ? Number(p.unit_price).toFixed(2) : "2.50";
  const talkBusy = recBusy && propUi[rid]?.[4] === "corrected";
  const formHtml = rid ? `<form class="prop-form" data-talker-form="${esc(rid)}" data-sku="${esc(sku)}" ${formOpen ? "" : "hidden"}>
      <input type="text" name="pname" value="${esc(defName)}" aria-label="Όνομα προϊόντος" required${talkBusy ? " disabled" : ""}>
      <input type="number" name="pprice" step="0.01" min="0.05" value="${esc(defPrice)}" aria-label="Τιμή EUR" class="mono" required${talkBusy ? " disabled" : ""}>
      <button type="submit"${talkBusy ? ` disabled aria-busy="true"` : ""}>${talkBusy ? "Δημιουργία…" : "Δημιουργία"}</button>
    </form>` : "";

  // Shown only when the backend reports a generated file for this proposal.
  const talkerHtml = p.talker_file
    ? `<div class="prop-talker"><img src="/files/${encodeURI(p.talker_file)}" alt="Ταμπελάκι ${esc(defName)}">
       <span>${S.stateHTML("success", "Ταμπελάκι έτοιμο", p.talker_source === "fal" ? "εικόνα fal" : "τοπική απόδοση")}<br>
       <a href="/files/${encodeURI(p.talker_file)}" target="_blank" rel="noopener">Άνοιγμα PNG</a></span></div>`
    : "";

  const ui = propUi[rid];
  const uiHtml = ui ? `<div style="margin-top:8px">${S.stateHTML(ui[0], ui[1], ui[2], { box: true })}</div>` : "";
  const evidHtml = evidCache[p.id] ? `<div class="prop-evid">${evidCache[p.id]}</div>`
    : evidErr[p.id] ? `<div class="prop-evid">${evidErr[p.id]}</div>` : "";

  return `<div class="prop">
    <div class="prop-head"><span>${esc(p.rule || "Πρόταση")} · ${esc(RULE[p.rule] || "Διάταξη")}</span>${decBadge}</div>
    <b>${esc(p.text)}</b>
    <p class="why">${esc(p.reason)}</p>
    <div class="num">${esc(p.numbers)}</div>
    <small>${esc(p.note)} Πηγή: ${esc(p.source)}.</small>
    ${offLine(p.off)}
    ${talkerHtml}${actions}${formHtml}${uiHtml}${evidHtml}
  </div>`;
}

const LEVEL_EL = { top: "Πάνω", eye: "Ύψος ματιών", bottom: "Κάτω" };
function offLine(o) {
  if (!o) return "";
  const what = [o.brand, o.name, o.quantity].filter(Boolean).join(" · ");
  const kind = o.status === "matched" ? "Open Food Facts" : "Συγκρίσιμο προϊόν (Open Food Facts)";
  const link = /^https:\/\//.test(o.url || "") ? ` · <a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.barcode)}</a>` : "";
  return `<small>${kind}: ${esc(what)}${link}</small>`;
}
// «Διάταξη»: τι θέλει γέμισμα, τι αλλάζει ράφι, και ο λόγος για το καθένα.
function suggestionsHtml(d) {
  const nameOf = {};
  (d.shelves || []).forEach(sh => (sh.items || []).forEach(it => { if (it.sku) nameOf[it.sku] = it.name || it.label; }));
  const label = x => nameOf[x.sku] || x.name || x.label || x.sku || "";
  const fills = (d.findings || []).filter(x => x.type === "low" || x.type === "missing" || x.type === "gap");
  const fillHtml = fills.map(x => {
    const what = x.type === "missing" ? "Λείπει εντελώς από το ράφι"
      : x.type === "gap" ? `Άδειος χώρος στο ράφι · ${x.need === 1 ? "χωράει 1 τεμάχιο" : "χωράνε " + x.need + " τεμάχια"}`
      : `Φαίνονται ${x.seen ?? "λίγες"} από ${x.target ?? "τις"} προσόψεις · λείπουν ${x.need}`;
    const why = x.type === "missing" ? (x.why || "Κωδικός του καταλόγου που δεν φαίνεται στη φωτογραφία.")
      : x.type === "gap" ? "Το ράφι δεν είναι γεμάτο σε αυτό το σημείο· ό,τι δεν φαίνεται δεν πουλιέται."
      : (x.sku ? "Λιγότερες προσόψεις από όσες έχει με το ράφι γεμάτο (πλανόγραμμα)· κάθε άδεια θέση είναι πώληση που χάνεται."
               : "Το μοντέλο βλέπει κενό δίπλα στην ομάδα· χωρίς κωδικό καταλόγου δεν γίνεται παραγγελία.");
    return `<div class="sug fill"><b>${esc(label(x) || "Κενό στο ράφι")}</b> <span class="to">· ${esc(SHELF_EL[x.level] || "")}</span>
      <p>${esc(what)}</p><small>${esc(why)}</small></div>`;
  }).join("");
  const misplaced = (d.findings || []).filter(x => x.type === "misplaced");
  const tasked = misplaced.map(x =>
    `<div class="sug task"><b>${esc(label(x))}</b> <span class="to">→ ${esc(SHELF_EL[x.to_level] || x.to_level)}</span>
      <p>${esc(x.why || "Δεν ταιριάζει στο επίπεδο που στέκει.")}</p><small>Εργασία υπαλλήλου.</small></div>`).join("");
  const moves = (d.moves || []).map(m =>
    `<div class="sug move"><b>${esc(m.name)}</b> <span class="to">→ ${esc(SHELF_EL[m.to_level] || m.to_level)}</span>
      <p>${esc(m.why.charAt(0).toUpperCase() + m.why.slice(1))}.</p>
      <small>${m.source === "rules" ? "Από τις πωλήσεις 28 ημερών, με κώδικα. Την αλλαγή την εγκρίνει ο υπεύθυνος."
        : "Κρίση του μοντέλου με τους κανόνες κατηγορίας· δεν υπάρχουν στοιχεία πωλήσεων για αυτό το ράφι."}</small></div>`).join("");
  return (fillHtml ? `<div class="sug-head">Θέλουν γέμισμα (${fills.length})</div>${fillHtml}` : "")
    + (tasked || moves ? `<div class="sug-head">Αλλάζουν ράφι (${(d.moves || []).length + misplaced.length})</div>${tasked}${moves}` : "")
    + (d.moves_more ? `<p class="prod-note">Οι ${(d.moves || []).length} σημαντικότερες αλλαγές. Άλλες ${d.moves_more} μικρότερες φαίνονται στη διάταξη ανά επίπεδο παρακάτω.</p>` : "");
}

function productsHtml(d) {
  const shelves = (d.shelves || []).filter(sh => (sh.items || []).length);
  if (!shelves.length) return `<div class="empty">Κανένα προϊόν στην τελευταία λήψη.</div>`;
  const moves = {};
  (d.moves || []).forEach(x => { moves[x.sku || x.label] = x; });
  (d.findings || []).forEach(x => { if (x.type === "misplaced") moves[x.sku || x.label] = x; });
  let n = 0, known = 0;
  const rows = shelves.map(sh => `<div class="prod-level">${esc(LEVEL_EL[sh.level] || sh.level)}</div>` + sh.items.map(it => {
    n += 1; if (it.off && it.off.status === "matched") known += 1;
    const mv = moves[it.sku || it.label];
    const move = mv ? `<small class="warn">Μετακίνηση: ${esc(LEVEL_EL[mv.to_level] || mv.to_level)}${mv.why ? " — " + esc(mv.why) : ""}</small>` : "";
    const code = it.sku ? `<span class="mono">${esc(it.sku)}</span> · ` : "";
    return `<div class="prod-row"><b>${code}${esc(it.name || it.label || "Δεν διαβάστηκε")}</b>
      <span class="n">× ${it.facings}</span>${move}${offLine(it.off)}</div>`;
  }).join("")).join("");
  return `<p class="prod-note">${n} ομάδες προϊόντων · ${known} με barcode από το Open Food Facts (ODbL). `
    + `Η αναζήτηση για προϊόντα εκτός καταλόγου τρέχει στο παρασκήνιο, λίγα ανά λήψη.</p>` + rows;
}

function setLight(kind, title, sub, right = "") {
  $("lightPrev").hidden = true;
  $("light").dataset.assessment = "";   // set to "1" only by render() when the light shows a shelf assessment
  $("light").dataset.kind = kind || "idle";
  $("lightIco").innerHTML = S.stateIcon(kind || "idle");
  $("lightTitle").textContent = title;
  $("lightSub").textContent = sub || "";
  $("lightRight").innerHTML = right;
}
function orderNote(orders) {
  const n = (orders || []).length;
  return n ? ` · ${n === 1 ? "1 παραγγελία" : n + " παραγγελίες"}` : "";
}
function ago(ts) {
  const m = Math.round((Date.now() / 1000 - ts) / 60);
  return m < 1 ? "μόλις τώρα" : `πριν από ${m}′`;
}
function taskCard(t) {
  const img = t.image ? `style="background-image:url('/files/${encodeURI(t.image)}')"` : "";
  const thumbCls = t.image ? "thumb" : `thumb ${esc(t.kind || "")}`;
  const orderInfo = t.order && t.order.order_no
    ? ` · <span class="mono">${esc(t.order.order_no)} (${t.order.eur.toFixed(2)} €)</span>`
    : "";
  const orderRejected = t.order && t.order.rejected
    ? `<div class="row-state">${S.stateHTML("neutral", "Παραγγελία απορρίφθηκε από εσάς")}</div>` : "";
  const key = "order:" + t.id, busyNow = inflight.has(key), which = rowUi[t.id]?.[4];
  const appr = t.needs_approval
    ? `<div class="acts"><button class="ok" data-order="${esc(t.id)}" data-v="1"${busyNow ? (which === "1" ? ` disabled aria-busy="true"` : " disabled") : ""}>${busyNow && which === "1" ? "Έγκριση…" : `Έγκριση ${t.needs_approval.cases} κιβ. (${t.needs_approval.eur.toFixed(2)} €)`}</button>
       <button class="ghost" data-order="${esc(t.id)}" data-v="0"${busyNow ? (which === "0" ? ` disabled aria-busy="true"` : " disabled") : ""}>${busyNow && which === "0" ? "Απόρριψη…" : "Απόρριψη"}</button></div>
       <div class="row-state">${S.stateHTML("warning", "Χρειάζεται έγκριση", t.needs_approval.why)}</div>`
    : "";
  const worker = t.status === "in_progress"
    ? `<div class="row-state">${S.stateHTML("pending", "Σε εξέλιξη", t.claimed_by || "υπάλληλος")}</div>` : "";
  const ui = rowUi[t.id] && !busyNow ? `<div class="row-state">${S.stateHTML(rowUi[t.id][0], rowUi[t.id][1], rowUi[t.id][2], { box: true })}</div>` : "";
  return `<div class="task-row">
    <div class="${thumbCls}" ${img}>${t.image ? "" : (KIND_LABEL[t.kind] || "SKU")}</div>
    <div>
      <b>${esc(t.text)}</b>
      <div class="meta"><span class="mono">${ago(t.created)}</span>${orderInfo}</div>
      ${worker}${orderRejected}${appr}${ui}
    </div>
  </div>`;
}

// Only a confirmed assessment can read as success. "busy", "unchanged", missing or unknown statuses never do.
const SETTLED = new Set(["confirmed", "acted"]);
const KNOWN = new Set(["idle", "pending", "occluded", "confirmed", "acted"]);
let prevAssessment = null;   // { status } of the last assessment shown on screen
// "idle" (no frame analysed yet) is not a result, so it is never presented as a "previous result".
const hasPrevResult = () => Boolean(prevAssessment && prevAssessment.status !== "idle");

function assessment(d, status) {
  const tasks = d.tasks || [];
  if (d.unknown_shelf) return ["warning", "Ράφι εκτός καταλόγου", "Αξιολόγηση διάταξης χωρίς αυτόματες παραγγελίες."];
  if (status === "dark") return ["warning", "Πολύ σκοτεινή εικόνα", "Η λήψη δεν μέτρησε. Έλεγξε ότι η κάμερα δεν είναι καλυμμένη."];
  if (status === "occluded") return ["warning", "Περιορισμένη ορατότητα", "Η λήψη δεν μέτρησε. Καθάρισε το πλάνο και ξαναδοκίμασε."];
  if (status === "idle") return ["idle", "Αναμονή πρώτης λήψης", "Επίλεξε φωτογραφία «Από αρχείο…» ή στείλε μία από το κινητό."];
  if (tasks.length) return ["warning", `${tasks.length} ${tasks.length === 1 ? "εκκρεμής εργασία" : "εκκρεμείς εργασίες"}`,
    "Στάλθηκαν στον υπάλληλο" + orderNote(d.orders)];
  if (status === "pending") return ["pending", "Αναμονή επιβεβαίωσης", `Χρειάζεται ίδιο αποτέλεσμα σε επόμενη λήψη (${d.confirm || "-"}).`];
  if (SETTLED.has(status)) return ["success", "Το ράφι είναι σωστό",
    d.done && d.done.length ? `Τελευταία διόρθωση: ${d.done[0].text}` : "Όλοι οι κωδικοί στη θέση τους."];
  return ["unknown", "Άγνωστη κατάσταση ραφιού", "Περίμενε την επόμενη λήψη."];
}

function setStillSrc(url) {
  if (!url) return;
  if (activeStillUrl !== url) {
    activeStillUrl = url;
    $("still").src = url;
  }
  $("still").hidden = false;
  $("hint").hidden = true;
}

function syncStageImage(d) {
  const bar = $("stageBar"), badge = $("stageBadge");
  const hasLive = lastPreviewTs > 0;          // ζωντανή εικόνα υπάρχει μόνο αν τη στέλνει το κινητό
  $("sviewLiveBtn").hidden = !hasLive;

  if (!d || !d.frame) {
    bar.hidden = true;
    badge.hidden = true;
    return;
  }
  bar.hidden = false;

  // Μόλις ετοιμαστεί η διορθωμένη φωτογραφία του μοντέλου για το τρέχον frame, εμφάνισέ την αυτόματα!
  if (d.corrected_frame && d.corrected_frame !== lastCorrectedShown) {
    lastCorrectedShown = d.corrected_frame;
    if (userPickedViewForFrame !== d.frame) stageView = "corrected";
  } else if (stageView === "auto" || (stageView === "corrected" && !d.corrected_frame)) {
    stageView = (!hasLive || usingFile) ? "ar" : "live";
  }

  document.querySelectorAll("[data-sview]").forEach(b => {
    b.classList.toggle("on", b.dataset.sview === stageView);
  });

  if (stageView === "corrected" && d.corrected_frame) {
    setStillSrc("/files/live/" + encodeURIComponent(d.corrected_frame));
    badge.hidden = false;
    badge.className = "stage-badge";
    badge.textContent = "Διορθωμένο ράφι μετά την επεξεργασία";
  } else if (stageView === "ar") {
    setStillSrc("/files/live/" + encodeURIComponent(d.frame));
    if (d.correcting) {
      badge.hidden = false;
      badge.className = "stage-badge loading";
      badge.textContent = "Δημιουργία διορθωμένης εικόνας ραφιού…";
    } else {
      badge.hidden = true;
    }
  } else {
    // stageView === "live": η εικόνα έρχεται από το polling του preview του κινητού
    if (d.correcting) {
      badge.hidden = false;
      badge.className = "stage-badge loading";
      badge.textContent = "Δημιουργία διορθωμένης εικόνας ραφιού…";
    } else {
      badge.hidden = true;
    }
  }
  draw();
}

document.querySelectorAll("[data-sview]").forEach(btn => {
  btn.onclick = async () => {
    const mode = btn.dataset.sview;
    if (mode === "corrected" && last && last.frame && !last.corrected_frame && !last.correcting) {
      stageView = "ar";
      $("stageBadge").hidden = false;
      $("stageBadge").className = "stage-badge loading";
      $("stageBadge").textContent = "Δημιουργία διορθωμένης εικόνας ραφιού…";
      try {
        await S.api("/api/shelf/reconstruct?force=true", { method: "POST" });
        userPickedViewForFrame = "";
        await refreshStatus();
      } catch (e) {
        setBarState("error", "Αποτυχία δημιουργίας διορθωμένης εικόνας", S.errorCopy(e));
        $("stageBadge").hidden = true;
      }
      return;
    }
    stageView = mode;
    if (last && last.frame) userPickedViewForFrame = last.frame;
    if (mode === "live") usingFile = false;
    syncStageImage(last);
  };
});

function render(d) {
  last = d;
  syncStageImage(d);
  const tasks = d.tasks || [];
  $("taskCount").textContent = String(tasks.length);
  window.ShelfSenseShell?.setTaskBadge(tasks.length);

  // "unchanged": the scene did not change, so the last completed assessment still stands (whatever it was).
  let status = d.status;
  if (status === "unchanged") status = prevAssessment ? prevAssessment.status : "unknown";

  if (status === "busy") {
    // Another frame is being analysed: progress first, the earlier result only as a labelled "previous".
    const prev = hasPrevResult() ? assessment(d, prevAssessment.status) : null;
    setLight("loading", "Άλλη ανάλυση σε εξέλιξη",
      prev ? `Προηγούμενο αποτέλεσμα: ${prev[1]}` : "Το αποτέλεσμα εμφανίζεται μόλις ολοκληρωθεί.");
  } else {
    const [k, t, sub] = assessment(d, status);
    setLight(k, t, sub);
    $("light").dataset.assessment = "1";
    if (KNOWN.has(status)) prevAssessment = { status };
    if (status === "pending" && tasks.length) $("lightRight").textContent = `επιβεβαίωση ${d.confirm || ""}`;
  }

  $("tasks").innerHTML = tasks.length
    ? tasks.map(taskCard).join("")
    : `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>Καμία εκκρεμής εργασία</div>`;

  const planHtml = suggestionsHtml(d) + ((d.proposals || []).map(propCard).join(""))
    + (d.summary ? `<p class="lay-summary">${esc(d.summary)}</p>` : "")
    + (d.suggested_layout || []).map(l => `<div class="lay"><b>${esc({top:"Πάνω",eye:"Μάτια",bottom:"Κάτω"}[l.level] || l.level)}</b>
        <span>${esc((l.order || []).join(" → "))}</span><small>${esc(l.why || "")}</small></div>`).join("");
  $("plan").innerHTML = planHtml || (d.status === "idle"
    ? `<div class="empty">${S.stateHTML("idle", "Αναμονή πρώτης λήψης")}</div>`
    : `<div class="empty">Καμία παρατήρηση διάταξης.</div>`);
  $("products").innerHTML = productsHtml(d);

  $("timeline").innerHTML = (d.history || []).slice().reverse().map(h =>
    `<li><time>${hhmm(h.ts)}</time><span class="sdot ${KIND_DOT[h.kind] || ""}"></span><span>${esc(h.text)}</span></li>`
  ).join("") || `<li><time>—</time><span class="sdot"></span><span class="mut">Καμία λήψη ακόμη.</span></li>`;

  if (d.model) $("mode").textContent = (d.provider === "mock" ? "mock" : d.model) + (d.shelf_title ? " · ράφι: " + d.shelf_title : "");
  const base = `frame ${d.frame || "-"} · ${d.status} · ${d.seconds ?? "-"}s · επιβεβαίωση ${d.confirm || "-"} · ` +
    `${d.frames} frames / ${d.model_calls} κλήσεις μοντέλου` + (d.diff !== undefined ? ` · διαφορά ${d.diff}` : "") +
    (d.agent_run ? ` · agent ${d.agent_run}` : "") + "\n" + JSON.stringify(d.findings || [], null, 1).slice(0, 1500);
  $("devinfo").dataset.base = base;
  $("devinfo").textContent = ($("devinfo").dataset.err ? $("devinfo").dataset.err + "\n" : "") + base;
}
async function refreshStatus() {
  const { data } = await S.api("/api/live/status");
  render(data);
}

const PICK_HINT = `<button type="button" class="tinted" style="margin-top:10px" onclick="document.getElementById('fileInput').click()">Επιλογή φωτογραφίας ραφιού…</button>`;
// Πριν από την πρώτη λήψη: τι να κάνει ο χρήστης για να δει ράφι στην οθόνη.
function showWaiting() {
  if (last && (last.corrected_frame || last.frame)) { syncStageImage(last); return; }
  if ($("still").getAttribute("src")) return;
  $("hint").hidden = false;
  $("hint").innerHTML = `<div><strong>Δεν υπάρχει ακόμη φωτογραφία ραφιού.</strong><br>Στείλε μία από το κινητό (<code>/cam</code>, <code>/capture</code> ή Telegram) ή επίλεξε εικόνα:<br>${PICK_HINT}</div>`;
}

$("still").addEventListener("load", draw);

// Poll mobile live preview stream: appears on its own when a phone opens /cam
setInterval(async () => {
  if (previewPolling || usingFile || document.hidden) return;
  previewPolling = true;
  try {
    const r = await fetch(`/api/shelf/preview.jpg?since=${lastPreviewTs}`);
    if (r.status === 200) {
      const ts = parseFloat(r.headers.get("X-Preview-Ts") || "0");
      const blob = await r.blob();
      if (ts > lastPreviewTs && blob.size > 0) {
        lastPreviewTs = ts;
        $("sviewLiveBtn").hidden = false;
        // Ενημέρωσε την εικόνα του stage μόνο αν βλέπουμε τη ζωντανή κάμερα (όχι πάνω από το Διορθωμένο ράφι!)
        if (stageView === "live" || (!last?.frame && !last?.corrected_frame)) {
          const nextUrl = URL.createObjectURL(blob);
          const oldUrl = prevBlobUrl;
          prevBlobUrl = nextUrl;
          activeStillUrl = nextUrl;
          $("still").src = nextUrl;
          $("still").hidden = false;
          $("hint").hidden = true;
          if (oldUrl) setTimeout(() => URL.revokeObjectURL(oldUrl), 300);
        }
      }
    }
  } catch {}
  finally { previewPolling = false; }
}, 950);

// Δεν υπάρχει αυτόματος έλεγχος από αυτή την οθόνη: εδώ φαίνεται μόνο από πού ήρθε η εικόνα.
setInterval(() => {
  const phone = lastPreviewTs > 0 && Date.now() / 1000 - lastPreviewTs < 20;
  $("count").textContent = sending ? "ανάλυση…" : paused ? "κινητό σε παύση"
    : usingFile ? "αρχείο εικόνας" : phone ? "ζωντανά από κινητό" : (last && last.frame ? "τελευταία φωτογραφία" : "");
}, 1000);

const sseStart = Date.now() / 1000 - 2;
new EventSource("/api/events").onmessage = m => {
  const ev = JSON.parse(m.data);
  if (ev.run_id !== "system" || ev.ts < sseStart) return;
  if (["shelf_log", "live_frame", "live_report", "live_correcting", "live_corrected", "recommendation_feedback"].includes(ev.type)) {
    if (ev.type === "live_corrected") userPickedViewForFrame = "";
    S.api("/api/live/status").then(({ data: s }) => {
      if (!sending) render(s);
    }).catch(() => {});
  }
};

// «Παύση» και «Έλεγχος τώρα» τηλεχειρίζονται την κάμερα του κινητού (/cam). Χωρίς κινητό, ο έλεγχος γίνεται με
// φωτογραφία «Από αρχείο…».
$("pause").onclick = async () => {
  try {
    const { data } = await S.api("/api/shelf/remote_trigger?mode=toggle_pause", { method: "POST" });
    paused = !!data.paused;
    $("pause").textContent = paused ? "Συνέχεια" : "Παύση";
    $("pause").setAttribute("aria-pressed", String(paused));
    setBarState("info", paused ? "Η κάμερα κινητού τέθηκε σε παύση" : "Η κάμερα κινητού συνεχίζει");
  } catch (e) { setBarState("error", "Αδυναμία επικοινωνίας με το κινητό", S.errorCopy(e)); }
};
$("now").onclick = async () => {
  if (sending) return;
  const restore = S.busy($("now"), "Λήψη από κινητό…");
  setBarState("loading", "Εντολή λήψης στη σταθερή κάμερα κινητού…");
  try {
    await S.api("/api/shelf/remote_trigger?mode=live", { method: "POST" });
    usingFile = false;                       // η επόμενη εικόνα της οθόνης είναι του κινητού, όχι το αρχείο
    setBarState("info", "Η κάμερα κινητού έστειλε νέα λήψη", "Αναμονή αποτελέσματος Gemini…");
    await refreshStatus().catch(() => {});
  } catch (e) {
    devLog("remote_trigger", e);
    setBarState("warning", "Δεν βρέθηκε ενεργή κάμερα κινητού", "Άνοιξε το /cam στο κινητό ή επίλεξε εικόνα «Από αρχείο…».");
  } finally { restore(); }
};
$("ref").onclick = async () => {
  const btn = $("ref");
  if (btn.disabled) return;
  let blob = null;
  if (!$("still").hidden && $("still").naturalWidth) {
    const c = document.createElement("canvas");
    c.width = $("still").naturalWidth; c.height = $("still").naturalHeight;
    c.getContext("2d").drawImage($("still"), 0, 0);
    blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.9));
  }
  if (!blob) {
    setBarState("warning", "Δεν υπάρχει φωτογραφία στην οθόνη", "Η αναφορά χρειάζεται φωτογραφία του σωστού ραφιού.");
    return;
  }
  const restore = S.busy(btn, "Αποθήκευση…");
  try {
    const body = new FormData(); body.append("file", blob, "ref.jpg");
    await S.api("/api/shelf/reference", { method: "POST", body });
    restore();
    setBarState("success", "Η αναφορά αποθηκεύτηκε");
    S.announce("Η εικόνα αναφοράς αποθηκεύτηκε.");
    refreshStatus().catch(() => {});
  } catch (e) {
    restore(); devLog("reference", e);
    setBarState("error", "Η αναφορά δεν αποθηκεύτηκε", S.errorCopy(e));
    S.announce("Η εικόνα αναφοράς δεν αποθηκεύτηκε.", true);
  }
};
$("file").onclick = () => $("fileInput").click();
$("pickPhotoBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  usingFile = true;
  userPickedViewForFrame = "";
  stageView = "ar";
  const localUrl = URL.createObjectURL(f);
  activeStillUrl = localUrl;
  $("still").src = localUrl; $("still").hidden = false; $("hint").hidden = true;
  setBarState(""); send(f, true);
  e.target.value = "";
};
async function devAction(btn, label, url, okLabel) {
  if (btn.disabled) return false;
  const restore = S.busy(btn, label);
  try {
    await S.api(url, { method: "POST" });
    restore(); setBarState("success", okLabel);
    return true;
  } catch (e) {
    restore(); devLog(url, e);
    setBarState("error", "Η ενέργεια απέτυχε", S.errorCopy(e));
    return false;
  }
}
$("reset").onclick = async () => {
  if (await devAction($("reset"), "Μηδενισμός…", "/api/live/reset", "Η κατάσταση μηδενίστηκε"))
    refreshStatus().catch(e => devLog("status", e));
};
document.querySelectorAll("[data-mock]").forEach(b => b.onclick = async () => {
  if (await devAction(b, "Φόρτωση…", "/api/live/mock/" + b.dataset.mock, "Η δοκιμαστική κατάσταση ορίστηκε")) {
    // Η δοκιμαστική φωτογραφία του ενεργού σετ περνά από τον ίδιο έλεγχο με ένα αρχείο του χρήστη.
    try {
      const r = await fetch("/photo/" + encodeURIComponent(b.dataset.mock));
      if (!r.ok) throw new Error("sample photo " + r.status);
      const blob = await r.blob();
      usingFile = true; userPickedViewForFrame = ""; stageView = "ar";

      activeStillUrl = url;
      $("still").src = url; $("still").hidden = false; $("hint").hidden = true;
      send(blob, true);
    } catch (e) {
      devLog("mock", e);
      setBarState("info", "Η δοκιμαστική κατάσταση ορίστηκε", "Φόρτωσε εικόνα «Από αρχείο…» για έλεγχο.");
    }
  }
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-order]");
  if (b) {
    const id = b.dataset.order, key = "order:" + id;
    if (inflight.has(key)) return;
    inflight.add(key); rowUi[id] = [null, "", "", "", b.dataset.v];
    if (last) render(last);
    try {
      await S.api(`/api/tasks/${encodeURIComponent(id)}/order`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approved: b.dataset.v === "1" })
      });
      delete rowUi[id];
      S.announce(b.dataset.v === "1" ? "Η παραγγελία εγκρίθηκε." : "Η παραγγελία απορρίφθηκε.");
    } catch (err) {
      devLog("order", err);
      rowUi[id] = ["error", b.dataset.v === "1" ? "Η έγκριση δεν καταχωρήθηκε" : "Η απόρριψη δεν καταχωρήθηκε", S.errorCopy(err)];
      S.announce("Η απόφαση για την παραγγελία δεν καταχωρήθηκε.", true);
    } finally { inflight.delete(key); }
    await refreshStatus().catch(() => { if (last) render(last); });
    return;
  }

  const fb = e.target.closest("[data-rec]");
  if (fb) {
    const rid = fb.dataset.rec, dec = fb.dataset.dec, key = "rec:" + rid;
    if (inflight.has(key)) return;
    inflight.add(key); propUi[rid] = ["loading", "Αποθήκευση απόφασης…", "", "", dec];
    if (last) render(last);
    try {
      await S.api(`/api/recommendations/${encodeURIComponent(rid)}/feedback`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ submission_id: `ui-${dec}-${Date.now()}`, decision: dec, decided_by: "manager" })
      });
      delete propUi[rid];   // the saved decision now shows from the backend's own proposal state
      S.announce(dec === "accepted" ? "Η αποδοχή αποθηκεύτηκε. Η μετακίνηση δεν έχει επιβεβαιωθεί." : "Η απόρριψη αποθηκεύτηκε.");
    } catch (err) {
      devLog("feedback", err);
      propUi[rid] = ["error", "Η απόφαση δεν αποθηκεύτηκε", S.errorCopy(err)];
      S.announce("Η απόφαση δεν αποθηκεύτηκε.", true);
    } finally { inflight.delete(key); }
    await refreshStatus().catch(() => { if (last) render(last); });
    return;
  }

  const tg = e.target.closest("[data-talker-toggle]");
  if (tg) {
    const rid = tg.dataset.talkerToggle;
    if (openTalkerForms.has(rid)) openTalkerForms.delete(rid); else openTalkerForms.add(rid);
    if (last) render(last);
    if (openTalkerForms.has(rid)) document.querySelector(`[data-talker-form="${CSS.escape(rid)}"] input`)?.focus();
    return;
  }

  const evBtn = e.target.closest("[data-evid]");
  if (evBtn) {
    const pid = evBtn.dataset.prop, sku = evBtn.dataset.evid, key = "evid:" + pid;
    if (inflight.has(key)) return;
    if (evidCache[pid]) { delete evidCache[pid]; if (last) render(last); return; }
    inflight.add(key); delete evidErr[pid];
    if (last) render(last);
    try {
      const { data: pack } = await S.api(`/api/evidence/${encodeURIComponent(sku)}`);
      const srcs = (pack.sources || []).slice(0, 3);
      evidCache[pid] = srcs.length
        ? srcs.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.domain || s.url)}</a>`).join("")
        : `<span>Περιθώριο ${esc(pack.margin_pct ?? "—")}% · Δεν βρέθηκαν εξωτερικές πηγές.</span>`;
    } catch (err) {
      devLog("evidence", err);
      evidErr[pid] = S.stateHTML("error", "Τα τεκμήρια δεν φορτώθηκαν", "Πάτησε «Τεκμήρια» ξανά.");
    } finally { inflight.delete(key); }
    if (last) render(last);
  }
});

document.addEventListener("submit", async e => {
  const form = e.target.closest("[data-talker-form]");
  if (!form) return;
  e.preventDefault();
  const rid = form.dataset.talkerForm, sku = form.dataset.sku, key = "rec:" + rid;
  if (inflight.has(key)) return;
  const pname = form.elements.pname.value.trim();
  const pprice = parseFloat(form.elements.pprice.value);
  inflight.add(key); propUi[rid] = ["loading", "Δημιουργία ταμπελακιού…", "Αποθήκευση ονόματος και τιμής", "", "corrected"];
  if (last) render(last);
  let saved = false;
  try {
    await S.api(`/api/recommendations/${encodeURIComponent(rid)}/feedback`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        submission_id: `ui-corr-${Date.now()}`,
        decision: "corrected",
        decided_by: "manager",
        correction: {
          product: { sku: sku || null, name: pname },
          price: { amount: pprice, currency: "EUR", source: "owner_confirmation" }
        }
      })
    });
    saved = true;
    propUi[rid] = ["loading", "Δημιουργία ταμπελακιού…", "Η διόρθωση αποθηκεύτηκε", "", "corrected"];
    if (last) render(last);
    await S.api(`/api/recommendations/${encodeURIComponent(rid)}/talker`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ theme: "fresh" })
    });
    openTalkerForms.delete(rid);
    delete propUi[rid];
  } catch (err) {
    devLog("talker", err);
    const st = err.status === 409 ? "missing_inputs" : err.status === 404 ? "not_found"
      : err.status === 422 ? "invalid_input" : err.status === 502 ? "provider_failed" : null;
    const [k, l, dtl] = !saved
      ? ["error", "Η διόρθωση δεν αποθηκεύτηκε", S.errorCopy(err)]
      : st ? S.talkerState(st) : ["error", "Το ταμπελάκι δεν δημιουργήθηκε", S.errorCopy(err)];
    propUi[rid] = [k, l, saved ? `Η διόρθωση αποθηκεύτηκε. ${dtl}` : dtl];
    S.announce(l, true);
  } finally { inflight.delete(key); }
  try {
    const { data } = await S.api("/api/live/status");
    const p = (data.proposals || []).find(x => x.recommendation_id === rid);
    if (!propUi[rid] && p && !p.talker_file)
      propUi[rid] = ["unknown", "Δεν επιβεβαιώθηκε αρχείο ταμπελακιού", "Ανανέωσε σε λίγο", ""];
    else if (!propUi[rid] && p && p.talker_file) S.announce("Το ταμπελάκι είναι έτοιμο.");
    render(data);
  } catch { if (last) render(last); }
});
window.addEventListener("resize", draw);
(async () => {
  setLight("loading", "Φόρτωση…", "");
  try {
    const { data: s } = await S.api("/api/live/status");
    render(s);
    $("mode").textContent = (s.provider === "mock" ? "mock" : s.model) + (s.shelf_title ? " · ράφι: " + s.shelf_title : "");
  } catch (e) {
    devLog("status", e);
    setLight("error", "Δεν υπάρχει σύνδεση με τον διακομιστή", "Έλεγξε ότι τρέχει ο server και ανανέωσε τη σελίδα.");
    $("mode").textContent = "εκτός σύνδεσης";
    return;
  }
  showWaiting();
  if (!(last && last.frame))
    setLight("idle", "Έτοιμο για έλεγχο ραφιού", "Επίλεξε φωτογραφία «Από αρχείο…» ή στείλε μία από το κινητό.");
})();
</script>
