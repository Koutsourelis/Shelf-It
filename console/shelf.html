<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Ράφι · ShelfSense</title>
<link rel="icon" href="/ui/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/shell.js"></script>
<!-- Οθόνη ραφιού (macOS Split View: Stage + Inspector Sidebar).
     Τα κουτιά έρχονται σε [ymin, xmin, ymax, xmax] 0–1000· η μετατροπή σε pixel γίνεται ΜΟΝΟ στο toPx(). -->
<style>
  @media (min-width: 1024px) {
    html, body { height: 100%; overflow: hidden; }
    main.split-view {
      height: calc(100dvh - 52px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 376px;
    }
    .stage-pane {
      overflow-y: auto;
      padding: 16px 20px 24px;
    }
    aside.inspector {
      height: 100%;
      overflow-y: auto;
      background: var(--bg-primary);
      border-left: 1px solid var(--separator);
      display: flex;
      flex-direction: column;
    }
  }

  @media (max-width: 1023px) {
    main.split-view {
      display: flex;
      flex-direction: column;
    }
    .stage-pane { padding: 14px 16px 18px; }
    aside.inspector {
      background: var(--bg-primary);
      border-top: 1px solid var(--separator);
    }
  }

  /* Flat Status Header above Camera Stage */
  .light {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 4px 2px 12px;
    flex-wrap: wrap;
  }
  .light { align-items: flex-start; flex-wrap: nowrap; }
  .light .light-ico { display: inline-flex; flex: none; margin-top: 1px; color: var(--label-tertiary); }
  .light .light-main { flex: 1 1 0; }
  .light .light-ico .state-ico { width: 18px; height: 18px; margin: 0; color: inherit; }
  .light[data-kind="loading"] .light-ico { color: var(--sys-blue); }
  .light[data-kind="pending"] .light-ico { color: var(--sys-indigo); }
  .light[data-kind="success"] .light-ico { color: var(--sys-green); }
  .light[data-kind="warning"] .light-ico { color: var(--sys-orange); }
  .light[data-kind="error"] .light-ico { color: var(--sys-red); }
  .light-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .light b {
    font-size: var(--fs-title);
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--label-primary);
  }
  .light span {
    font-size: var(--fs-callout);
    color: var(--label-secondary);
  }
  .light .right {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: var(--fs-mono);
    color: var(--label-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* 16:9 Camera Stage */
  .stage {
    position: relative;
    background: #141416;
    border: 1px solid var(--surface-border);
    border-radius: var(--r-group);
    overflow: hidden;
    aspect-ratio: 16 / 9;
    box-shadow: var(--surface-shadow);
  }
  .stage video, .stage canvas, .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .stage canvas { pointer-events: none; }
  .stage .hint {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(235, 235, 245, 0.72);
    text-align: center;
    padding: 24px;
    font-size: var(--fs-body);
    line-height: 1.5;
  }
  .stage .hint[hidden], .stage img[hidden], .stage video[hidden] { display: none !important; }
  .stage .hint a { color: #64D2FF; }
  .stage .hint code { background: rgba(255, 255, 255, 0.12); color: #F5F5F7; }

  /* Subtle top indeterminate progress bar instead of theatrical laser */
  .scan {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 2px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 150ms var(--apple-ease);
  }
  .scan::after {
    content: "";
    display: block;
    width: 38%;
    height: 100%;
    background: var(--sys-blue);
    transform: translateX(-100%);
  }
  .scan.on { opacity: 1; }
  .scan.on::after { animation: barSlide 1.2s var(--apple-ease) infinite; }
  @keyframes barSlide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(360%); }
  }

  /* Action Bar & Optional Dev Row */
  .bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .bar .bar-state { flex: 1 1 220px; min-width: 0; }
  .bar .bar-state:empty { display: none; }
  .bar .count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: var(--fs-mono);
    color: var(--label-secondary);
    font-variant-numeric: tabular-nums;
  }

  .devbar {
    display: none;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--separator);
  }
  .devonly { display: none !important; }
  body.dev .devonly { display: block !important; }
  body.dev .devbar { display: flex !important; }
  #devinfo {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--label-secondary);
    background: var(--bg-primary);
    border: 1px solid var(--surface-border);
    border-radius: var(--r-control);
    padding: 10px 12px;
    white-space: pre-wrap;
    margin-top: 10px;
    max-height: 180px;
    overflow: auto;
  }

  /* Right Inspector Sidebar — Flat Hairline Sections (NO Card-in-Card) */
  .insp-sec {
    border-bottom: 1px solid var(--separator);
  }
  .insp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 8px;
  }
  .insp-count {
    font-family: var(--font-mono);
    font-size: var(--fs-foot);
    color: var(--label-secondary);
  }

  .task-row {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    gap: 12px;
    padding: 10px 16px;
    border-top: 1px solid var(--separator);
    align-items: start;
  }
  .task-row:first-child { border-top: 0; }
  .task-row .thumb {
    width: 48px;
    height: 48px;
    border-radius: 6px;
    background: var(--bg-secondary) center / cover no-repeat;
    border: 1px solid var(--surface-border);
    display: grid;
    place-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--label-secondary);
  }
  .task-row .thumb.restock { color: var(--sys-red); background-color: var(--sys-red-tint); border-color: transparent; }
  .task-row .thumb.relocate, .task-row .thumb.tidy, .task-row .thumb.remove {
    color: var(--sys-orange); background-color: var(--sys-orange-tint); border-color: transparent;
  }
  .task-row b {
    display: block;
    font-size: var(--fs-body);
    font-weight: 600;
    line-height: 1.36;
    color: var(--label-primary);
  }
  .task-row .meta {
    margin-top: 3px;
    font-size: var(--fs-callout);
    color: var(--label-secondary);
    line-height: 1.38;
  }
  .task-row .row-state { margin-top: 6px; }
  .task-row .acts {
    margin-top: 8px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .insp-tabs-wrap {
    padding: 12px 16px 8px;
  }
  .insp-panel[hidden] { display: none !important; }

  /* 3-Tier Layout Rows */
  .lay-summary {
    margin: 0;
    padding: 8px 16px 10px;
    font-size: var(--fs-callout);
    color: var(--label-secondary);
    line-height: 1.45;
    border-bottom: 1px solid var(--separator);
  }
  .lay {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr);
    gap: 2px 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--separator);
    font-size: var(--fs-body);
  }
  .lay:last-child { border-bottom: 0; }
  .lay b {
    font-size: var(--fs-callout);
    font-weight: 500;
    color: var(--label-secondary);
  }
  .lay span { color: var(--label-primary); line-height: 1.4; }
  .lay small {
    grid-column: 2;
    font-size: var(--fs-foot);
    color: var(--label-tertiary);
    line-height: 1.38;
  }

  /* Flat Event Log */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li {
    display: grid;
    grid-template-columns: 38px 8px minmax(0, 1fr);
    gap: 8px;
    align-items: baseline;
    padding: 8px 16px;
    border-bottom: 1px solid var(--separator);
    font-size: var(--fs-callout);
    line-height: 1.4;
    color: var(--label-primary);
  }
  .tl li:last-child { border-bottom: 0; }
  .tl time {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--label-tertiary);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body class="has-tabbar">
<header class="topbar">

  <nav class="seg-nav" aria-label="Κύρια πλοήγηση">

<main class="split-view">
  <section class="stage-pane">
    <div class="light" id="light" data-kind="loading" role="status" aria-live="polite">
      <span class="light-ico" id="lightIco" aria-hidden="true"></span>
      <div class="light-main">
        <span id="lightPrev" hidden>Προηγούμενο αποτέλεσμα:</span>

        <span id="lightSub"></span>
      </div>
      <div class="right" id="lightRight"></div>

    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <img id="still" alt="Εικόνα ραφιού" hidden>
      <canvas id="overlay"></canvas>
      <div class="scan" id="scan"></div>
      <div class="hint" id="hint" hidden></div>
    </div>

    <div class="bar">
      <button id="now" type="button">Έλεγχος τώρα</button>

      <button id="ref" class="ghost" title="Αποθήκευση τρέχοντος frame ως εικόνας αναφοράς">Ορισμός αναφοράς</button>

    <div class="devbar">

      <button class="ghost" id="file">Από αρχείο…</button>
      <button class="ghost" data-mock="sample_before">Mock: Έλλειψη</button>
      <button class="ghost" data-mock="sample_after">Mock: Σωστό</button>
      <button class="ghost" id="reset">Μηδενισμός</button>
      <input id="fileInput" type="file" accept="image/*" hidden>

    <div id="devinfo" class="devonly"></div>

  <aside class="inspector" aria-label="Πίνακας στοιχείων ραφιού">
    <div class="insp-sec">

    <div class="insp-tabs-wrap">
      <div class="seg" role="tablist" aria-label="Προβολή λεπτομερειών">
        <button type="button" class="on" role="tab" aria-selected="true" data-insp="plan">Διάταξη</button>
        <button type="button" role="tab" aria-selected="false" data-insp="timeline">Ιστορικό</button>

    </div>

    <div id="panel-plan" class="insp-panel">
      <div id="plan"><div class="empty">Αναμονή πρώτης λήψης…</div></div>
    </div>

    <div id="panel-timeline" class="insp-panel" hidden>
      <ul class="tl" id="timeline"></ul>
    </div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let isDev = params.has("dev");
function applyDev() {
  document.body.classList.toggle("dev", isDev);
  $("devToggle").classList.toggle("on", isDev);
}
$("devToggle").onclick = () => {
  isDev = !isDev;
  const url = new URL(location.href);
  if (isDev) url.searchParams.set("dev", "1"); else url.searchParams.delete("dev");
  history.replaceState(null, "", url);
  applyDev();
};
applyDev();

// Segmented Control in Inspector (Διάταξη | Ιστορικό)
document.querySelectorAll("[data-insp]").forEach(btn => {
  btn.onclick = () => {
    const target = btn.dataset.insp;
    document.querySelectorAll("[data-insp]").forEach(b => {
      const on = b === btn;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", String(on));
    });
    $("panel-plan").hidden = target !== "plan";
    $("panel-timeline").hidden = target !== "timeline";
  };
});

const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
let interval = 30, countdown = 0, paused = false, last = null, sending = false, usingFile = false;

// Apple System Colors for AR Bounding Boxes
const COLORS = {
  ok: "#34C759",
  low: "#FF9500",
  missing: "#FF3B30",
  misplaced: "#FF3B30",
  unknown: "#AF52DE",
  gap: "#FF3B30"
};
const KIND_LABEL = { restock: "Έλλειψη", relocate: "Θέση", remove: "Ξένο", tidy: "Τάξη" };
const KIND_DOT = {
  restock: "bad", relocate: "warn", remove: "warn", tidy: "warn", task: "bad",
  order: "blue", done: "ok", claim: "warn", approval: "warn", setup: "blue",
  proposal: "indigo", agent: "indigo", foreign: "warn"
};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hhmm = ts => new Date(ts * 1000).toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit", hour12: false });

async function openCamera(deviceId) {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const v = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } };
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: v });
  await video.play();
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  $("cam").innerHTML = devices.map((d, i) => `<option value="${d.deviceId}">${esc(d.label || "Κάμερα " + (i + 1))}</option>`).join("");
}
function snapshot() {
  const c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext("2d").drawImage(video, 0, 0);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.88));
}

const S = window.ShelfSenseShell;
const devLog = (label, err) => {
  if (!err) return;
  S.devLog(label, err);
  const line = `[${new Date().toLocaleTimeString("el-GR", { hour12: false })}] ${label}: ${err.tech || err.message || err}`;
  $("devinfo").dataset.err = line;
  $("devinfo").textContent = line + "\n" + ($("devinfo").dataset.base || "");
};
function setBarState(kind, label, detail = "") {
  $("barState").innerHTML = kind ? S.stateHTML(kind, label, detail) : "";
}
function syncNow() {
  const b = $("now");
  b.disabled = sending;
  if (sending) { b.setAttribute("aria-busy", "true"); b.textContent = "Έλεγχος…"; }
  else { b.removeAttribute("aria-busy"); b.textContent = "Έλεγχος τώρα"; }
}

async function send(blob, force = false) {
  if (sending || !blob) return;
  sending = true; $("scan").classList.add("on"); syncNow();
  if (hasPrevResult() && $("light").dataset.assessment === "1") {
    // Keep the last completed result visible, but label it as previous while the new frame is analysed.
    $("lightPrev").hidden = false;
    $("lightRight").innerHTML = S.stateHTML("loading", "Ανάλυση νέας λήψης…");
  } else {
    setLight("loading", "Ανάλυση λήψης…", "Το αποτέλεσμα εμφανίζεται μόλις ολοκληρωθεί.");
  }
  const body = new FormData(); body.append("file", blob, "frame.jpg");
  try {
    const { data } = await S.api("/api/shelf/frame" + (force ? "?force=1" : ""), { method: "POST", body });
    render(data);
  } catch (e) {
    devLog("frame", e);
    setLight("error", "Ο έλεγχος απέτυχε", S.errorCopy(e, "Πάτησε «Έλεγχος τώρα» για νέα προσπάθεια."));
    S.announce("Ο έλεγχος του ραφιού απέτυχε.", true);
  } finally { sending = false; $("scan").classList.remove("on"); syncNow(); }
}
async function scan(force = false) {
  if (usingFile) return;
  if (video.videoWidth) await send(await snapshot(), force);
}

function frameRect() {
  const W = overlay.clientWidth, H = overlay.clientHeight;
  const el = usingFile ? $("still") : video;
  const vw = (usingFile ? el.naturalWidth : el.videoWidth) || 16, vh = (usingFile ? el.naturalHeight : el.videoHeight) || 9;
  const s = Math.min(W / vw, H / vh), w = vw * s, h = vh * s;
  return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}
function toPx(box, f) {
  const [y0, x0, y1, x1] = box;
  return [f.x + x0 * f.w / 1000, f.y + y0 * f.h / 1000, (x1 - x0) * f.w / 1000, (y1 - y0) * f.h / 1000];
}
function draw() {
  overlay.width = overlay.clientWidth; overlay.height = overlay.clientHeight;
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (!last || !last.shelves) return;
  const f = frameRect(), statusOf = {};
  (last.findings || []).forEach(x => { if (x.sku) statusOf[x.sku] = x.type; });
  ctx.lineWidth = 2;
  ctx.font = "600 12px 'SF Mono', ui-monospace, Menlo, monospace";
  const box = (b, color, text) => {
    const [x, y, w, h] = toPx(b, f);
    ctx.strokeStyle = color;
    ctx.strokeRect(x, y, w, h);
    if (!text) return;
    const tw = ctx.measureText(text).width + 10;
    const ty = Math.max(y - 20, 0);
    ctx.fillStyle = color;
    ctx.fillRect(x, ty, tw, 20);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillText(text, x + 5, ty + 14);
  };
  (last.shelves || []).forEach(sh => (sh.items || []).forEach(it => {
    if (!it.box_2d) return;
    const st = !it.sku ? "unknown" : (statusOf[it.sku] || (it.placement_ok === false ? "misplaced" : "ok"));
    box(it.box_2d, COLORS[st], st === "ok" ? "" : (it.sku || "?"));
  }));
  (last.proposals || []).forEach(p => arrow(p, f));
}

function arrow(p, f) {
  const INDIGO = "#5856D6", sides = [p.a, p.b].filter(s => s && s.box);
  ctx.save();
  ctx.strokeStyle = INDIGO; ctx.fillStyle = INDIGO; ctx.lineWidth = 2.5; ctx.setLineDash([7, 5]);
  sides.forEach(s => { const [x, y, w, h] = toPx(s.box, f); ctx.strokeRect(x - 3, y - 3, w + 6, h + 6); });
  ctx.setLineDash([]);
  if (sides.length === 2) {
    const mid = s => { const [x, y, w, h] = toPx(s.box, f); return [x + w / 2, y + h / 2]; };
    const [x0, y0] = mid(p.a), [x1, y1] = mid(p.b);
    const cx = (x0 + x1) / 2 + (y1 - y0) * 0.22, cy = (y0 + y1) / 2 - (x1 - x0) * 0.22;
    ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke();
    const head = (x, y, fx, fy) => {
      const a = Math.atan2(y - fy, x - fx), r = 13;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - r * Math.cos(a - 0.45), y - r * Math.sin(a - 0.45));
      ctx.lineTo(x - r * Math.cos(a + 0.45), y - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
    };
    head(x1, y1, cx, cy);
    if (p.kind === "swap") head(x0, y0, cx, cy);
    const label = p.kind === "swap" ? "Αλλαγή θέσης" : "+1 πρόσοψη";
    ctx.font = "500 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
    const tw = ctx.measureText(label).width + 12;
    const lx = (x0 + 2 * cx + x1) / 4, ly = (y0 + 2 * cy + y1) / 4;
    ctx.fillRect(lx - tw / 2, ly - 10, tw, 20);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillText(label, lx - tw / 2 + 6, ly + 4);
  }
  ctx.restore();
}

const busyAttr = (key, label) => inflight.has(key) ? ` disabled aria-busy="true" data-busy-label="${esc(label)}"` : "";

function propCard(p) {
  const rid = p.recommendation_id || "";
  const sku = p.featured_sku || (p.b && p.b.sku) || "";
  const dec = p.decision;
  const ds = S.decisionState(dec);
  const decBadge = ds ? `<span style="margin-left:auto">${S.stateHTML(ds[0], ds[1])}</span>` : "";
  const recBusy = inflight.has("rec:" + rid);
  const decided = dec === "accepted" || dec === "corrected";

  let actions = "";
  if (rid) {
    const lock = recBusy ? " disabled" : "";
    actions = `<div class="prop-acts">
      ${!decided ? `<button type="button" data-rec="${esc(rid)}" data-dec="accepted"${recBusy && propUi[rid]?.[4] === "accepted" ? ` disabled aria-busy="true"` : lock}>${recBusy && propUi[rid]?.[4] === "accepted" ? "Αποθήκευση…" : "Αποδοχή"}</button>` : ""}
      <button type="button" class="${decided && !p.talker_file ? "tinted" : "ghost"}" data-talker-toggle="${esc(rid)}" aria-expanded="${openTalkerForms.has(rid)}"${lock}>Ταμπελάκι</button>
      ${sku ? `<button type="button" class="ghost" data-evid="${esc(sku)}" data-prop="${esc(p.id)}" aria-expanded="${Boolean(evidCache[p.id])}"${busyAttr("evid:" + p.id, "Φόρτωση…")}>${inflight.has("evid:" + p.id) ? "Φόρτωση…" : (evidCache[p.id] ? "Απόκρυψη τεκμηρίων" : "Τεκμήρια")}</button>` : ""}
      ${dec !== "rejected" ? `<button type="button" class="ghost" data-rec="${esc(rid)}" data-dec="rejected"${recBusy && propUi[rid]?.[4] === "rejected" ? ` disabled aria-busy="true"` : lock}>${recBusy && propUi[rid]?.[4] === "rejected" ? "Αποθήκευση…" : "Απόρριψη"}</button>` : ""}
    </div>`;
  }

  const formOpen = rid && openTalkerForms.has(rid);
  const defName = p.featured_name || (p.b && p.b.name) || "";
  const defPrice = p.unit_price ? Number(p.unit_price).toFixed(2) : "2.50";
  const talkBusy = recBusy && propUi[rid]?.[4] === "corrected";
  const formHtml = rid ? `<form class="prop-form" data-talker-form="${esc(rid)}" data-sku="${esc(sku)}" ${formOpen ? "" : "hidden"}>
      <input type="text" name="pname" value="${esc(defName)}" aria-label="Όνομα προϊόντος" required${talkBusy ? " disabled" : ""}>
      <input type="number" name="pprice" step="0.01" min="0.05" value="${esc(defPrice)}" aria-label="Τιμή EUR" class="mono" required${talkBusy ? " disabled" : ""}>
      <button type="submit"${talkBusy ? ` disabled aria-busy="true"` : ""}>${talkBusy ? "Δημιουργία…" : "Δημιουργία"}</button>
    </form>` : "";

  // Shown only when the backend reports a generated file for this proposal.
  const talkerHtml = p.talker_file
    ? `<div class="prop-talker"><img src="/files/${encodeURI(p.talker_file)}" alt="Ταμπελάκι ${esc(defName)}">
       <span>${S.stateHTML("success", "Ταμπελάκι έτοιμο", p.talker_source === "fal" ? "εικόνα fal" : "τοπική απόδοση")}<br>
       <a href="/files/${encodeURI(p.talker_file)}" target="_blank" rel="noopener">Άνοιγμα PNG</a></span></div>`
    : "";

  const ui = propUi[rid];
  const uiHtml = ui ? `<div style="margin-top:8px">${S.stateHTML(ui[0], ui[1], ui[2], { box: true })}</div>` : "";
  const evidHtml = evidCache[p.id] ? `<div class="prop-evid">${evidCache[p.id]}</div>`
    : evidErr[p.id] ? `<div class="prop-evid">${evidErr[p.id]}</div>` : "";

  return `<div class="prop">
    <div class="prop-head"><span>${esc(p.rule || "Πρόταση")} · ${esc(RULE[p.rule] || "Διάταξη")}</span>${decBadge}</div>
    <b>${esc(p.text)}</b>
    <p class="why">${esc(p.reason)}</p>
    <div class="num">${esc(p.numbers)}</div>
    <small>${esc(p.note)} Πηγή: ${esc(p.source)}.</small>
    ${talkerHtml}${actions}${formHtml}${uiHtml}${evidHtml}
  </div>`;
}

function taskCard(t) {

// Only a confirmed assessment can read as success. "busy", "unchanged", missing or unknown statuses never do.
const SETTLED = new Set(["confirmed", "acted"]);
const KNOWN = new Set(["idle", "pending", "occluded", "confirmed", "acted"]);
let prevAssessment = null;   // { status } of the last assessment shown on screen
// "idle" (no frame analysed yet) is not a result, so it is never presented as a "previous result".
const hasPrevResult = () => Boolean(prevAssessment && prevAssessment.status !== "idle");

function assessment(d, status) {
  const tasks = d.tasks || [];
  if (d.unknown_shelf) return ["warning", "Ράφι εκτός καταλόγου", "Αξιολόγηση διάταξης χωρίς αυτόματες παραγγελίες."];
  if (status === "occluded") return ["warning", "Περιορισμένη ορατότητα", "Η λήψη δεν μέτρησε. Καθάρισε το πλάνο και ξαναδοκίμασε."];
  if (status === "idle") return ["idle", "Αναμονή πρώτης λήψης", "Ο έλεγχος ξεκινά αυτόματα."];
  if (tasks.length) return ["warning", `${tasks.length} ${tasks.length === 1 ? "εκκρεμής εργασία" : "εκκρεμείς εργασίες"}`,
    "Στάλθηκαν στον υπάλληλο" + orderNote(d.orders)];
  if (status === "pending") return ["pending", "Αναμονή επιβεβαίωσης", `Χρειάζεται ίδιο αποτέλεσμα σε επόμενη λήψη (${d.confirm || "-"}).`];
  if (SETTLED.has(status)) return ["success", "Το ράφι είναι σωστό",
    d.done && d.done.length ? `Τελευταία διόρθωση: ${d.done[0].text}` : "Όλοι οι κωδικοί στη θέση τους."];
  return ["unknown", "Άγνωστη κατάσταση ραφιού", "Περίμενε την επόμενη λήψη."];
}

function render(d) {
  last = d; draw();
  const tasks = d.tasks || [];
  $("taskCount").textContent = String(tasks.length);
  window.ShelfSenseShell?.setTaskBadge(tasks.length);

  // "unchanged": the scene did not change, so the last completed assessment still stands (whatever it was).
  let status = d.status;
  if (status === "unchanged") status = prevAssessment ? prevAssessment.status : "unknown";

  if (status === "busy") {
    // Another frame is being analysed: progress first, the earlier result only as a labelled "previous".
    const prev = hasPrevResult() ? assessment(d, prevAssessment.status) : null;
    setLight("loading", "Άλλη ανάλυση σε εξέλιξη",
      prev ? `Προηγούμενο αποτέλεσμα: ${prev[1]}` : "Το αποτέλεσμα εμφανίζεται μόλις ολοκληρωθεί.");
  } else {
    const [k, t, sub] = assessment(d, status);
    setLight(k, t, sub);
    $("light").dataset.assessment = "1";
    if (KNOWN.has(status)) prevAssessment = { status };
    if (status === "pending" && tasks.length) $("lightRight").textContent = `επιβεβαίωση ${d.confirm || ""}`;
  }

  $("tasks").innerHTML = tasks.length
    ? tasks.map(taskCard).join("")
    : `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>Καμία εκκρεμής εργασία</div>`;

  const planHtml = ((d.proposals || []).map(propCard).join(""))
    + (d.summary ? `<p class="lay-summary">${esc(d.summary)}</p>` : "")
    + (d.suggested_layout || []).map(l => `<div class="lay"><b>${esc({top:"Πάνω",eye:"Μάτια",bottom:"Κάτω"}[l.level] || l.level)}</b>
        <span>${esc((l.order || []).join(" → "))}</span><small>${esc(l.why || "")}</small></div>`).join("");
  $("plan").innerHTML = planHtml || (d.status === "idle"
    ? `<div class="empty">${S.stateHTML("idle", "Αναμονή πρώτης λήψης")}</div>`
    : `<div class="empty">Καμία παρατήρηση διάταξης.</div>`);

  $("timeline").innerHTML = (d.history || []).slice().reverse().map(h =>
    `<li><time>${hhmm(h.ts)}</time><span class="sdot ${KIND_DOT[h.kind] || ""}"></span><span>${esc(h.text)}</span></li>`
  ).join("") || `<li><time>—</time><span class="sdot"></span><span class="mut">Έλεγχος ανά ${interval}s.</span></li>`;

  const base = `frame ${d.frame || "-"} · ${d.status} · ${d.seconds ?? "-"}s · επιβεβαίωση ${d.confirm || "-"} · ` +
    `${d.frames} frames / ${d.model_calls} κλήσεις μοντέλου` + (d.diff !== undefined ? ` · διαφορά ${d.diff}` : "") +
    (d.agent_run ? ` · agent ${d.agent_run}` : "") + "\n" + JSON.stringify(d.findings || [], null, 1).slice(0, 1500);
  $("devinfo").dataset.base = base;
  $("devinfo").textContent = ($("devinfo").dataset.err ? $("devinfo").dataset.err + "\n" : "") + base;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-order]");
  if (b) {
    const id = b.dataset.order, key = "order:" + id;
    if (inflight.has(key)) return;
    inflight.add(key); rowUi[id] = [null, "", "", "", b.dataset.v];
    if (last) render(last);
    try {
      await S.api(`/api/tasks/${encodeURIComponent(id)}/order`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approved: b.dataset.v === "1" })
      });
      delete rowUi[id];
      S.announce(b.dataset.v === "1" ? "Η παραγγελία εγκρίθηκε." : "Η παραγγελία απορρίφθηκε.");
    } catch (err) {
      devLog("order", err);
      rowUi[id] = ["error", b.dataset.v === "1" ? "Η έγκριση δεν καταχωρήθηκε" : "Η απόρριψη δεν καταχωρήθηκε", S.errorCopy(err)];
      S.announce("Η απόφαση για την παραγγελία δεν καταχωρήθηκε.", true);
    } finally { inflight.delete(key); }
    await refreshStatus().catch(() => { if (last) render(last); });
    return;
  }

  const fb = e.target.closest("[data-rec]");
  if (fb) {
    const rid = fb.dataset.rec, dec = fb.dataset.dec, key = "rec:" + rid;
    if (inflight.has(key)) return;
    inflight.add(key); propUi[rid] = ["loading", "Αποθήκευση απόφασης…", "", "", dec];
    if (last) render(last);
    try {
      await S.api(`/api/recommendations/${encodeURIComponent(rid)}/feedback`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ submission_id: `ui-${dec}-${Date.now()}`, decision: dec, decided_by: "manager" })
      });
      delete propUi[rid];   // the saved decision now shows from the backend's own proposal state
      S.announce(dec === "accepted" ? "Η αποδοχή αποθηκεύτηκε. Η μετακίνηση δεν έχει επιβεβαιωθεί." : "Η απόρριψη αποθηκεύτηκε.");
    } catch (err) {
      devLog("feedback", err);
      propUi[rid] = ["error", "Η απόφαση δεν αποθηκεύτηκε", S.errorCopy(err)];
      S.announce("Η απόφαση δεν αποθηκεύτηκε.", true);
    } finally { inflight.delete(key); }
    await refreshStatus().catch(() => { if (last) render(last); });
    return;
  }

  const tg = e.target.closest("[data-talker-toggle]");
  if (tg) {
    const rid = tg.dataset.talkerToggle;
    if (openTalkerForms.has(rid)) openTalkerForms.delete(rid); else openTalkerForms.add(rid);
    if (last) render(last);
    if (openTalkerForms.has(rid)) document.querySelector(`[data-talker-form="${CSS.escape(rid)}"] input`)?.focus();
    return;
  }

  const evBtn = e.target.closest("[data-evid]");
  if (evBtn) {
    const pid = evBtn.dataset.prop, sku = evBtn.dataset.evid, key = "evid:" + pid;
    if (inflight.has(key)) return;
    if (evidCache[pid]) { delete evidCache[pid]; if (last) render(last); return; }
    inflight.add(key); delete evidErr[pid];
    if (last) render(last);
    try {
      const { data: pack } = await S.api(`/api/evidence/${encodeURIComponent(sku)}`);
      const srcs = (pack.sources || []).slice(0, 3);
      evidCache[pid] = srcs.length
        ? srcs.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.domain || s.url)}</a>`).join("")
        : `<span>Περιθώριο ${esc(pack.margin_pct ?? "—")}% · Δεν βρέθηκαν εξωτερικές πηγές.</span>`;
    } catch (err) {
      devLog("evidence", err);
      evidErr[pid] = S.stateHTML("error", "Τα τεκμήρια δεν φορτώθηκαν", "Πάτησε «Τεκμήρια» ξανά.");
    } finally { inflight.delete(key); }
    if (last) render(last);
  }
});

document.addEventListener("submit", async e => {
  const form = e.target.closest("[data-talker-form]");
  if (!form) return;
  e.preventDefault();
  const rid = form.dataset.talkerForm, sku = form.dataset.sku, key = "rec:" + rid;
  if (inflight.has(key)) return;
  const pname = form.elements.pname.value.trim();
  const pprice = parseFloat(form.elements.pprice.value);
  inflight.add(key); propUi[rid] = ["loading", "Δημιουργία ταμπελακιού…", "Αποθήκευση ονόματος και τιμής", "", "corrected"];
  if (last) render(last);
  let saved = false;
  try {
    await S.api(`/api/recommendations/${encodeURIComponent(rid)}/feedback`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        submission_id: `ui-corr-${Date.now()}`,
        decision: "corrected",
        decided_by: "manager",
        correction: {
          product: { sku: sku || null, name: pname },
          price: { amount: pprice, currency: "EUR", source: "owner_confirmation" }
        }
      })
    });
    saved = true;
    propUi[rid] = ["loading", "Δημιουργία ταμπελακιού…", "Η διόρθωση αποθηκεύτηκε", "", "corrected"];
    if (last) render(last);
    await S.api(`/api/recommendations/${encodeURIComponent(rid)}/talker`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ theme: "fresh" })
    });
    openTalkerForms.delete(rid);
    delete propUi[rid];
  } catch (err) {
    devLog("talker", err);
    const st = err.status === 409 ? "missing_inputs" : err.status === 404 ? "not_found"
      : err.status === 422 ? "invalid_input" : err.status === 502 ? "provider_failed" : null;
    const [k, l, dtl] = !saved
      ? ["error", "Η διόρθωση δεν αποθηκεύτηκε", S.errorCopy(err)]
      : st ? S.talkerState(st) : ["error", "Το ταμπελάκι δεν δημιουργήθηκε", S.errorCopy(err)];
    propUi[rid] = [k, l, saved ? `Η διόρθωση αποθηκεύτηκε. ${dtl}` : dtl];
    S.announce(l, true);
  } finally { inflight.delete(key); }
  try {
    const { data } = await S.api("/api/live/status");
    const p = (data.proposals || []).find(x => x.recommendation_id === rid);
    if (!propUi[rid] && p && !p.talker_file)
      propUi[rid] = ["unknown", "Δεν επιβεβαιώθηκε αρχείο ταμπελακιού", "Ανανέωσε σε λίγο", ""];
    else if (!propUi[rid] && p && p.talker_file) S.announce("Το ταμπελάκι είναι έτοιμο.");
    render(data);
  } catch { if (last) render(last); }
});
function cameraCopy(e) {
  const n = e && e.name;
  if (!navigator.mediaDevices) return "Η κάμερα ανοίγει μόνο από localhost ή HTTPS.";
  if (n === "NotAllowedError" || n === "SecurityError") return "Δεν δόθηκε άδεια για την κάμερα.";
  if (n === "NotFoundError" || n === "OverconstrainedError") return "Δεν βρέθηκε κάμερα σε αυτή τη συσκευή.";
  if (n === "NotReadableError") return "Η κάμερα χρησιμοποιείται από άλλη εφαρμογή.";
  return "Η κάμερα δεν ξεκίνησε.";
}
window.addEventListener("resize", draw);
video.addEventListener("loadedmetadata", draw);

(async () => {
  setLight("loading", "Εκκίνηση κάμερας…", "");
  try {
    const { data: s } = await S.api("/api/live/status");
    interval = s.interval; render(s);
    $("mode").textContent = s.provider === "mock" ? "mock" : s.model;
  } catch (e) {
    devLog("status", e);
    setLight("error", "Δεν υπάρχει σύνδεση με τον διακομιστή", "Έλεγξε ότι τρέχει ο server και ανανέωσε τη σελίδα.");
    $("mode").textContent = "εκτός σύνδεσης";
  }
  try { await openCamera(); $("hint").hidden = true; countdown = 2; }
  catch (e) {
    devLog("camera", e);
    $("hint").hidden = false;
    $("hint").innerHTML = `<div><strong>${esc(cameraCopy(e))}</strong><br>Άνοιξε από <code>localhost</code> / HTTPS ή ενεργοποίησε τις <a href="?dev=1">Δοκιμές</a> για φόρτωση αρχείου.</div>`;
    if (!last || last.status === "idle") setLight("warning", "Η κάμερα δεν είναι διαθέσιμη", cameraCopy(e));
  }
})();
</script>
