<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Ράφι · ShelfSense</title>
<link rel="icon" href="/ui/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/shell.js"></script>
<!-- Οθόνη ραφιού (macOS Split View: Stage + Inspector Sidebar).
     Τα κουτιά έρχονται σε [ymin, xmin, ymax, xmax] 0–1000· η μετατροπή σε pixel γίνεται ΜΟΝΟ στο toPx(). -->
<style>
  @media (min-width: 1024px) {
    html, body { height: 100%; overflow: hidden; }
    main.split-view {
      height: calc(100dvh - 52px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 376px;
    }
    .stage-pane {
      overflow-y: auto;
      padding: 16px 20px 24px;
    }
    aside.inspector {
      height: 100%;
      overflow-y: auto;
      background: var(--bg-primary);
      border-left: 1px solid var(--separator);
      display: flex;
      flex-direction: column;
    }
  }

  @media (max-width: 1023px) {
    main.split-view {
      display: flex;
      flex-direction: column;
    }
    .stage-pane { padding: 14px 16px 18px; }
    aside.inspector {
      background: var(--bg-primary);
      border-top: 1px solid var(--separator);
    }
  }

  /* Flat Status Header above Camera Stage */
  .light {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 4px 2px 12px;
    flex-wrap: wrap;
  }
  .light .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--label-tertiary);
    flex: none;
    transform: translateY(-1px);
  }
  .light.ok .dot { background: var(--sys-green); }
  .light.warn .dot { background: var(--sys-orange); }
  .light.bad .dot { background: var(--sys-red); }
  .light-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .light b {
    font-size: var(--fs-title);
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--label-primary);
  }
  .light span {
    font-size: var(--fs-callout);
    color: var(--label-secondary);
  }
  .light .right {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: var(--fs-mono);
    color: var(--label-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* 16:9 Camera Stage */
  .stage {
    position: relative;
    background: #141416;
    border: 1px solid var(--surface-border);
    border-radius: var(--r-group);
    overflow: hidden;
    aspect-ratio: 16 / 9;
    box-shadow: var(--surface-shadow);
  }
  .stage video, .stage canvas, .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .stage canvas { pointer-events: none; }
  .stage .hint {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(235, 235, 245, 0.72);
    text-align: center;
    padding: 24px;
    font-size: var(--fs-body);
    line-height: 1.5;
  }
  .stage .hint[hidden], .stage img[hidden], .stage video[hidden] { display: none !important; }
  .stage .hint a { color: #64D2FF; }
  .stage .hint code { background: rgba(255, 255, 255, 0.12); color: #F5F5F7; }

  /* Subtle top indeterminate progress bar instead of theatrical laser */
  .scan {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 2px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 150ms var(--apple-ease);
  }
  .scan::after {
    content: "";
    display: block;
    width: 38%;
    height: 100%;
    background: var(--sys-blue);
    transform: translateX(-100%);
  }
  .scan.on { opacity: 1; }
  .scan.on::after { animation: barSlide 1.2s var(--apple-ease) infinite; }
  @keyframes barSlide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(360%); }
  }

  /* Action Bar & Optional Dev Row */
  .bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .bar .count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: var(--fs-mono);
    color: var(--label-secondary);
    font-variant-numeric: tabular-nums;
  }

  .devbar {
    display: none;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--separator);
  }
  .devonly { display: none !important; }
  body.dev .devonly { display: block !important; }
  body.dev .devbar { display: flex !important; }
  #devinfo {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--label-secondary);
    background: var(--bg-primary);
    border: 1px solid var(--surface-border);
    border-radius: var(--r-control);
    padding: 10px 12px;
    white-space: pre-wrap;
    margin-top: 10px;
    max-height: 180px;
    overflow: auto;
  }

  /* Right Inspector Sidebar — Flat Hairline Sections (NO Card-in-Card) */
  .insp-sec {
    border-bottom: 1px solid var(--separator);
  }
  .insp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 8px;
  }
  .insp-count {
    font-family: var(--font-mono);
    font-size: var(--fs-foot);
    color: var(--label-secondary);
  }

  .task-row {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    gap: 12px;
    padding: 10px 16px;
    border-top: 1px solid var(--separator);
    align-items: start;
  }
  .task-row:first-child { border-top: 0; }
  .task-row .thumb {
    width: 48px;
    height: 48px;
    border-radius: 6px;
    background: var(--bg-secondary) center / cover no-repeat;
    border: 1px solid var(--surface-border);
    display: grid;
    place-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--label-secondary);
  }
  .task-row .thumb.restock { color: var(--sys-red); background-color: var(--sys-red-tint); border-color: transparent; }
  .task-row .thumb.relocate, .task-row .thumb.tidy, .task-row .thumb.remove {
    color: var(--sys-orange); background-color: var(--sys-orange-tint); border-color: transparent;
  }
  .task-row b {
    display: block;
    font-size: var(--fs-body);
    font-weight: 600;
    line-height: 1.36;
    color: var(--label-primary);
  }
  .task-row .meta {
    margin-top: 3px;
    font-size: var(--fs-callout);
    color: var(--label-secondary);
    line-height: 1.38;
  }
  .task-row .acts {
    margin-top: 8px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .insp-tabs-wrap {
    padding: 12px 16px 8px;
  }
  .insp-panel[hidden] { display: none !important; }

  /* 3-Tier Layout Rows */
  .lay-summary {
    margin: 0;
    padding: 8px 16px 10px;
    font-size: var(--fs-callout);
    color: var(--label-secondary);
    line-height: 1.45;
    border-bottom: 1px solid var(--separator);
  }
  .lay {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr);
    gap: 2px 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--separator);
    font-size: var(--fs-body);
  }
  .lay:last-child { border-bottom: 0; }
  .lay b {
    font-size: var(--fs-callout);
    font-weight: 500;
    color: var(--label-secondary);
  }
  .lay span { color: var(--label-primary); line-height: 1.4; }
  .lay small {
    grid-column: 2;
    font-size: var(--fs-foot);
    color: var(--label-tertiary);
    line-height: 1.38;
  }

  /* Suggestions in the layout panel: what to refill, what to move, and why */
  .sug-head {
    padding: 12px 16px 4px;
    font-size: var(--fs-foot);
    font-weight: 600;
    color: var(--label-secondary);
  }
  .sug {
    padding: 8px 16px 9px;
    border-bottom: 1px solid var(--separator);
    font-size: var(--fs-body);
    line-height: 1.38;
  }
  .sug b { font-weight: 600; color: var(--label-primary); overflow-wrap: anywhere; }
  .sug .to { font-weight: 600; white-space: nowrap; }
  .sug.move .to { color: var(--sys-indigo); }
  .sug.task .to { color: var(--sys-red); }
  .sug.fill .to { color: var(--sys-orange); }
  .sug p { margin: 3px 0 0; font-size: var(--fs-callout); color: var(--label-secondary); }
  .sug small { display: block; margin-top: 3px; font-size: var(--fs-foot); color: var(--label-tertiary); }

  /* Product list: what the camera read, with its Open Food Facts identity */
  .prod-level {
    padding: 10px 16px 4px;
    font-size: var(--fs-foot);
    font-weight: 600;
    color: var(--label-secondary);
  }
  .prod-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2px 10px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--separator);
    font-size: var(--fs-body);
  }
  .prod-row b { font-weight: 600; color: var(--label-primary); line-height: 1.36; overflow-wrap: anywhere; }
  .prod-row .n { font-family: var(--font-mono); font-size: var(--fs-mono); color: var(--label-secondary); }
  .prod-row small { grid-column: 1 / -1; font-size: var(--fs-foot); color: var(--label-tertiary); line-height: 1.38; }
  .prod-row small a { color: var(--sys-blue); }
  .prod-note { margin: 0; padding: 10px 16px; font-size: var(--fs-foot); color: var(--label-tertiary); line-height: 1.4; }

  /* Flat Event Log */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li {
    display: grid;
    grid-template-columns: 38px 8px minmax(0, 1fr);
    gap: 8px;
    align-items: baseline;
    padding: 8px 16px;
    border-bottom: 1px solid var(--separator);
    font-size: var(--fs-callout);
    line-height: 1.4;
    color: var(--label-primary);
  }
  .tl li:last-child { border-bottom: 0; }
  .tl time {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--label-tertiary);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>

<header class="topbar">

<main class="split-view">
  <section class="stage-pane">
    <div class="light" id="light" role="status" aria-live="polite">
      <span class="dot"></span>
      <div class="light-main">
        <b id="lightTitle">Εκκίνηση κάμερας…</b>

    <div class="stage" id="stage">

    <div class="bar">

      <button id="mirrorBtn" class="ghost">Κάμερα κινητού</button>

  <aside class="inspector" aria-label="Πίνακας στοιχείων ραφιού">

    <div class="insp-tabs-wrap">

    <div id="panel-plan" class="insp-panel">

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let isDev = params.has("dev");
function applyDev() {
  document.body.classList.toggle("dev", isDev);
  $("devToggle").classList.toggle("on", isDev);
}
$("devToggle").onclick = () => {
  isDev = !isDev;
  const url = new URL(location.href);
  if (isDev) url.searchParams.set("dev", "1"); else url.searchParams.delete("dev");
  history.replaceState(null, "", url);
  applyDev();
};
applyDev();

// Segmented Control in Inspector (Διάταξη | Ιστορικό)
document.querySelectorAll("[data-insp]").forEach(btn => {
  btn.onclick = () => {
    const target = btn.dataset.insp;
    document.querySelectorAll("[data-insp]").forEach(b => {
      const on = b === btn;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", String(on));
    });
    $("panel-plan").hidden = target !== "plan";
    $("panel-products").hidden = target !== "products";
    $("panel-timeline").hidden = target !== "timeline";
  };
});

const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
let interval = 30, countdown = 0, paused = false, last = null, sending = false, usingFile = false;
// Χωρίς ζωντανή κάμερα (π.χ. κινητό σε σκέτο http: ο browser δεν δίνει getUserMedia): η οθόνη δείχνει την
// τελευταία φωτογραφία που αναλύθηκε (από /capture, Telegram ή το κουμπί «Λήψη φωτογραφίας») με τα πλαίσια.
let noCamera = false, shownFrame = null;
let mirrorMode = new URLSearchParams(location.search).has("mirror"), manualLocal = false;
let lastPreviewTs = 0, prevBlobUrl = null, previewPolling = false, lastShownFrame = "";

// Apple System Colors for AR Bounding Boxes
const COLORS = {
  ok: "#34C759",
  low: "#FF9500",
  missing: "#FF3B30",
  misplaced: "#FF3B30",
  unknown: "#AF52DE",
  seen: "#0A84FF",
  gap: "#FF3B30"
};
const KIND_LABEL = { restock: "Έλλειψη", relocate: "Θέση", remove: "Ξένο", tidy: "Τάξη" };
const KIND_DOT = {
  restock: "bad", relocate: "warn", remove: "warn", tidy: "warn", task: "bad",
  order: "blue", done: "ok", claim: "warn", approval: "warn", setup: "blue",
  proposal: "indigo", agent: "indigo", foreign: "warn"
};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hhmm = ts => new Date(ts * 1000).toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit", hour12: false });

async function openCamera(deviceId) {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const v = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } };
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: v });
  await video.play();
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  $("cam").innerHTML = devices.map((d, i) => `<option value="${d.deviceId}">${esc(d.label || "Κάμερα " + (i + 1))}</option>`).join("");
}
function snapshot() {
  const c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext("2d").drawImage(video, 0, 0);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.88));
}

function showFrame(name) {
  if (!name || name === shownFrame) return;
  shownFrame = name;
  $("still").src = "/files/live/" + encodeURIComponent(name);
  $("still").hidden = false; $("hint").hidden = true;
}
async function shrink(file, max = 1600) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(b => ok(b || file), "image/jpeg", 0.88));
  } catch { return file; }
}

async function send(blob, force = false, single = false) {
  if (sending || !blob) return;
  sending = true; $("scan").classList.add("on");
  const body = new FormData(); body.append("file", blob, "frame.jpg");
  try {
    const r = await fetch("/api/shelf/frame" + (single ? "?single=1" : force ? "?force=1" : ""), { method: "POST", body });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    render(data);
  } catch (e) {
    setLight("warn", "Αδυναμία ανάγνωσης ραφιού", e.message);
  } finally { sending = false; $("scan").classList.remove("on"); }
}
async function scan(force = false) {
  if (usingFile) return;
  if (video.videoWidth) await send(await snapshot(), force);
}

function frameRect() {
  const W = overlay.clientWidth, H = overlay.clientHeight;
  const useStill = usingFile || noCamera || mirrorMode || !$("still").hidden;
  const el = useStill ? $("still") : video;
  const vw = (useStill ? el.naturalWidth : el.videoWidth) || 16, vh = (useStill ? el.naturalHeight : el.videoHeight) || 9;
  const s = Math.min(W / vw, H / vh), w = vw * s, h = vh * s;
  return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}
function toPx(box, f) {
  const [y0, x0, y1, x1] = box;
  return [f.x + x0 * f.w / 1000, f.y + y0 * f.h / 1000, (x1 - x0) * f.w / 1000, (y1 - y0) * f.h / 1000];
}
function draw() {
  overlay.width = overlay.clientWidth; overlay.height = overlay.clientHeight;
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (!last || !last.shelves) return;
  const f = frameRect(), statusOf = {};
  (last.findings || []).forEach(x => { if (x.sku) statusOf[x.sku] = x.type; });
  ctx.lineWidth = 2;
  ctx.font = "600 12px 'SF Mono', ui-monospace, Menlo, monospace";
  const box = (b, color, text) => {
    const [x, y, w, h] = toPx(b, f);
    ctx.strokeStyle = color;
    ctx.strokeRect(x, y, w, h);
    if (!text) return;
    const room = Math.max(w, 64) - 10;                 // το όνομα κόβεται στο πλάτος του πλαισίου
    if (ctx.measureText(text).width > room) {
      while (text.length > 1 && ctx.measureText(text + "…").width > room) text = text.slice(0, -1);
      text = text.trimEnd() + "…";
    }
    const tw = ctx.measureText(text).width + 10;
    const ty = Math.max(y - 20, 0);
    ctx.fillStyle = color;
    ctx.fillRect(x, ty, tw, 20);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillText(text, x + 5, ty + 14);
  };
  // Ομάδες χωρίς κωδικό με εύρημα (γέμισμα, αλλαγή επιπέδου, ξένο): ταιριάζουν με το εύρημα από το όνομα.
  const flagged = {}, need = {};
  (last.findings || []).forEach(x => {
    if (!x.sku && ["misplaced", "unknown", "low"].includes(x.type) && !flagged[x.label]) flagged[x.label] = x.type;
    if (x.type === "low") need[x.sku || x.label] = x.need;
  });
  (last.shelves || []).forEach(sh => (sh.items || []).forEach(it => {
    if (!it.box_2d) return;
    const name = it.name || it.label || "";
    const st = it.sku ? (statusOf[it.sku] || (it.placement_ok === false ? "misplaced" : "ok"))
      : (flagged[it.label] || (it.placement_ok === false ? "misplaced" : (last.unknown_shelf && name ? "seen" : "unknown")));
    const more = st === "low" && need[it.sku || it.label] ? `+${need[it.sku || it.label]} · ` : "";   // πόσες προσόψεις λείπουν
    box(it.box_2d, COLORS[st], more + (name || it.sku || "?"));
  }));
  // Κενά του ραφιού που θέλουν γέμισμα: διακεκομμένο πλαίσιο πάνω στον άδειο χώρο.
  (last.findings || []).forEach(x => {
    if (x.type !== "gap" && x.type !== "missing") return;
    const color = x.type === "gap" ? COLORS.low : COLORS.missing;      // το άδειο σημείο ενός κωδικού που λείπει: κόκκινο
    (x.boxes || []).forEach((b, i) => {
      const [gx, gy, gw, gh] = toPx(b, f);
      ctx.save(); ctx.setLineDash([6, 4]); ctx.lineWidth = 2.5; ctx.strokeStyle = color;
      ctx.fillStyle = x.type === "gap" ? "rgba(255,149,0,0.16)" : "rgba(255,59,48,0.16)";
      ctx.fillRect(gx, gy, gw, gh); ctx.strokeRect(gx, gy, gw, gh); ctx.restore();
      if (i === 0) box(b, color, x.type === "gap" ? `Γέμισε +${x.need}` : `Λείπει · ${x.label}`);
    });
  });
  // Ένα βέλος για κάθε προϊόν που πρέπει να αλλάξει ράφι: κόκκινο = εργασία υπαλλήλου, indigo = πρόταση διάταξης.
  const bands = levelBands();
  (last.findings || []).forEach(x => {
    if (x.type === "misplaced" && x.boxes && x.boxes[0]) moveArrow(x.boxes[0], x.to_level, COLORS.misplaced, bands, f);
  });
  (last.moves || []).forEach(m => { if (m.box) moveArrow(m.box, m.to_level, "#5856D6", bands, f); });
  (last.proposals || []).forEach(p => arrow(p, f));
}

const SHELF_EL = { top: "Πάνω ράφι", eye: "Ύψος ματιών", bottom: "Κάτω ράφι" };
// Πού βρίσκεται κάθε επίπεδο στην εικόνα (0–1000), από τα πλαίσια των προϊόντων που στέκονται εκεί.
function levelBands() {
  const acc = {};
  (last.shelves || []).forEach(sh => (sh.items || []).forEach(it => {
    if (!it.box_2d) return;
    const a = acc[sh.level] || (acc[sh.level] = { y0: 1000, y1: 0 });
    a.y0 = Math.min(a.y0, it.box_2d[0]); a.y1 = Math.max(a.y1, it.box_2d[2]);
  }));
  const all = Object.values(acc);
  if (!all.length) return acc;
  const lo = Math.min(...all.map(a => a.y0)), hi = Math.max(...all.map(a => a.y1));
  ["top", "eye", "bottom"].forEach((lv, i) => {        // επίπεδο χωρίς προϊόντα: το αντίστοιχο τρίτο του ραφιού
    if (!acc[lv]) acc[lv] = { y0: lo + (hi - lo) * i / 3, y1: lo + (hi - lo) * (i + 1) / 3 };
  });
  return acc;
}
// Βέλος από το προϊόν προς το ράφι όπου πρέπει να πάει, με το όνομα του ραφιού στην άκρη.
function moveArrow(b, toLevel, color, bands, f) {
  const band = bands[toLevel];
  if (!band) return;
  const [x, y, w, h] = toPx(b, f);
  const down = (band.y0 + band.y1) / 2 > (b[0] + b[2]) / 2;
  const edge = down ? band.y0 + (band.y1 - band.y0) * 0.22 : band.y1 - (band.y1 - band.y0) * 0.22;
  const cx = x + w / 2, y0 = down ? y + h : y, y1 = f.y + edge * f.h / 1000;
  if (Math.abs(y1 - y0) < 14) return;
  ctx.save();
  ctx.setLineDash([6, 4]); ctx.lineWidth = 2.5; ctx.strokeStyle = color;
  ctx.strokeRect(x - 3, y - 3, w + 6, h + 6);
  ctx.setLineDash([]); ctx.lineCap = "round";
  const line = (width, style) => {
    ctx.lineWidth = width; ctx.strokeStyle = style;
    ctx.beginPath(); ctx.moveTo(cx, y0); ctx.lineTo(cx, y1 - (down ? 10 : -10)); ctx.stroke();
  };
  line(7, "rgba(255,255,255,0.9)"); line(3.5, color);              // λευκό περίγραμμα: φαίνεται πάνω σε κάθε συσκευασία
  const r = 12, dir = down ? 1 : -1;
  ctx.beginPath(); ctx.moveTo(cx, y1); ctx.lineTo(cx - r * 0.75, y1 - dir * r); ctx.lineTo(cx + r * 0.75, y1 - dir * r); ctx.closePath();
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.stroke();
  ctx.fillStyle = color; ctx.fill();
  // Η ετικέτα κάθεται πάνω στο ίδιο το προϊόν (στην άκρη απ' όπου φεύγει το βέλος): δύο ετικέτες δεν πέφτουν ποτέ
  // η μία πάνω στην άλλη, ακόμη κι όταν πολλά βέλη καταλήγουν στο ίδιο ράφι.
  const label = (down ? "↓ " : "↑ ") + (SHELF_EL[toLevel] || toLevel);
  ctx.font = "600 11.5px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
  const tw = ctx.measureText(label).width + 12, ly = down ? y + h - 24 : y + 4;
  const lx = Math.min(Math.max(cx - tw / 2, f.x), f.x + f.w - tw);
  ctx.fillStyle = color; ctx.fillRect(lx, ly, tw, 20);
  ctx.fillStyle = "#FFFFFF"; ctx.fillText(label, lx + 6, ly + 14);
  ctx.restore();
}

function arrow(p, f) {
  const INDIGO = "#5856D6", sides = [p.a, p.b].filter(s => s && s.box);
  ctx.save();
  ctx.strokeStyle = INDIGO; ctx.fillStyle = INDIGO; ctx.lineWidth = 2.5; ctx.setLineDash([7, 5]);
  sides.forEach(s => { const [x, y, w, h] = toPx(s.box, f); ctx.strokeRect(x - 3, y - 3, w + 6, h + 6); });
  ctx.setLineDash([]);
  if (sides.length === 2) {
    const mid = s => { const [x, y, w, h] = toPx(s.box, f); return [x + w / 2, y + h / 2]; };
    const [x0, y0] = mid(p.a), [x1, y1] = mid(p.b);
    const cx = (x0 + x1) / 2 + (y1 - y0) * 0.22, cy = (y0 + y1) / 2 - (x1 - x0) * 0.22;
    ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke();
    const head = (x, y, fx, fy) => {
      const a = Math.atan2(y - fy, x - fx), r = 13;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - r * Math.cos(a - 0.45), y - r * Math.sin(a - 0.45));
      ctx.lineTo(x - r * Math.cos(a + 0.45), y - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
    };
    head(x1, y1, cx, cy);
    if (p.kind === "swap") head(x0, y0, cx, cy);
    const label = p.kind === "swap" ? "Αλλαγή θέσης" : "+1 πρόσοψη";
    ctx.font = "500 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
    const tw = ctx.measureText(label).width + 12;
    const lx = (x0 + 2 * cx + x1) / 4, ly = (y0 + 2 * cy + y1) / 4;
    ctx.fillRect(lx - tw / 2, ly - 10, tw, 20);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillText(label, lx - tw / 2 + 6, ly + 4);
  }
  ctx.restore();
}

const RULE = { K3: "Χώρος στο ράφι", K4: "Ύψος ματιών", K5: "Κέντρο ραφιού", K7: "Προορισμός κάτω δεξιά" };
const evidCache = {};
const openTalkerForms = new Set();

function propCard(p) {
  const rid = p.recommendation_id || "";
  const sku = p.featured_sku || (p.b && p.b.sku) || "";
  const dec = p.decision;
  const decBadge = dec === "accepted" || dec === "corrected"
    ? `<span class="ok-txt" style="margin-left:auto">✓ Εγκρίθηκε</span>`
    : dec === "rejected"
    ? `<span class="tert" style="margin-left:auto">Απορρίφθηκε</span>`
    : "";

  let actions = "";
  if (rid) {
    actions = `<div class="prop-acts">
      ${dec !== "accepted" && dec !== "corrected" ? `<button type="button" data-rec="${esc(rid)}" data-dec="accepted">Αποδοχή</button>` : ""}
      <button type="button" class="ghost" data-talker-toggle="${esc(rid)}">Ταμπελάκι</button>
      ${sku ? `<button type="button" class="ghost" data-evid="${esc(sku)}" data-prop="${esc(p.id)}">Τεκμήρια</button>` : ""}
      ${dec !== "rejected" ? `<button type="button" class="ghost" data-rec="${esc(rid)}" data-dec="rejected">Απόρριψη</button>` : ""}
    </div>`;
  }

  const formOpen = rid && openTalkerForms.has(rid);
  const defName = p.featured_name || (p.b && p.b.name) || "";
  const defPrice = p.unit_price ? Number(p.unit_price).toFixed(2) : "2.50";
  const formHtml = rid ? `<form class="prop-form" data-talker-form="${esc(rid)}" data-sku="${esc(sku)}" ${formOpen ? "" : "hidden"}>
      <input type="text" name="pname" value="${esc(defName)}" aria-label="Όνομα προϊόντος" required>
      <input type="number" name="pprice" step="0.01" min="0.05" value="${esc(defPrice)}" aria-label="Τιμή EUR" class="mono" required>
      <button type="submit">Δημιουργία</button>
    </form>` : "";

  const talkerHtml = p.talker_file
    ? `<div class="prop-talker"><img src="/files/${encodeURI(p.talker_file)}" alt="Ταμπελάκι">
       <a href="/files/${encodeURI(p.talker_file)}" target="_blank" rel="noopener">Άνοιγμα ταμπέλας PNG (${p.talker_source === "fal" ? "fal" : "έτοιμο"})</a></div>`
    : "";

  const evidHtml = evidCache[p.id] ? `<div class="prop-evid">${evidCache[p.id]}</div>` : "";

  return `<div class="prop">
    <div class="prop-head"><span>${esc(p.rule || "Πρόταση")} · ${esc(RULE[p.rule] || "Διάταξη")}</span>${decBadge}</div>
    <b>${esc(p.text)}</b>
    <p class="why">${esc(p.reason)}</p>
    <div class="num">${esc(p.numbers)}</div>
    <small>${esc(p.note)} Πηγή: ${esc(p.source)}.</small>
    ${offLine(p.off)}
    ${talkerHtml}${actions}${formHtml}${evidHtml}
  </div>`;
}

const LEVEL_EL = { top: "Πάνω", eye: "Ύψος ματιών", bottom: "Κάτω" };
function offLine(o) {
  if (!o) return "";
  const what = [o.brand, o.name, o.quantity].filter(Boolean).join(" · ");
  const kind = o.status === "matched" ? "Open Food Facts" : "Συγκρίσιμο προϊόν (Open Food Facts)";
  const link = /^https:\/\//.test(o.url || "") ? ` · <a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.barcode)}</a>` : "";
  return `<small>${kind}: ${esc(what)}${link}</small>`;
}
// «Διάταξη»: τι θέλει γέμισμα, τι αλλάζει ράφι, και ο λόγος για το καθένα.
function suggestionsHtml(d) {
  const nameOf = {};
  (d.shelves || []).forEach(sh => (sh.items || []).forEach(it => { if (it.sku) nameOf[it.sku] = it.name || it.label; }));
  const label = x => nameOf[x.sku] || x.name || x.label || x.sku || "";
  const fills = (d.findings || []).filter(x => x.type === "low" || x.type === "missing" || x.type === "gap");
  const fillHtml = fills.map(x => {
    const what = x.type === "missing" ? "Λείπει εντελώς από το ράφι"
      : x.type === "gap" ? `Άδειος χώρος στο ράφι · ${x.need === 1 ? "χωράει 1 τεμάχιο" : "χωράνε " + x.need + " τεμάχια"}`
      : `Φαίνονται ${x.seen ?? "λίγες"} από ${x.target ?? "τις"} προσόψεις · λείπουν ${x.need}`;
    const why = x.type === "missing" ? (x.why || "Κωδικός του καταλόγου που δεν φαίνεται στη φωτογραφία.")
      : x.type === "gap" ? "Το ράφι δεν είναι γεμάτο σε αυτό το σημείο· ό,τι δεν φαίνεται δεν πουλιέται."
      : (x.sku ? "Λιγότερες προσόψεις από όσες έχει με το ράφι γεμάτο (πλανόγραμμα)· κάθε άδεια θέση είναι πώληση που χάνεται."
               : "Το μοντέλο βλέπει κενό δίπλα στην ομάδα· χωρίς κωδικό καταλόγου δεν γίνεται παραγγελία.");
    return `<div class="sug fill"><b>${esc(label(x) || "Κενό στο ράφι")}</b> <span class="to">· ${esc(SHELF_EL[x.level] || "")}</span>
      <p>${esc(what)}</p><small>${esc(why)}</small></div>`;
  }).join("");
  const misplaced = (d.findings || []).filter(x => x.type === "misplaced");
  const tasked = misplaced.map(x =>
    `<div class="sug task"><b>${esc(label(x))}</b> <span class="to">→ ${esc(SHELF_EL[x.to_level] || x.to_level)}</span>
      <p>${esc(x.why || "Δεν ταιριάζει στο επίπεδο που στέκει.")}</p><small>Εργασία υπαλλήλου.</small></div>`).join("");
  const moves = (d.moves || []).map(m =>
    `<div class="sug move"><b>${esc(m.name)}</b> <span class="to">→ ${esc(SHELF_EL[m.to_level] || m.to_level)}</span>
      <p>${esc(m.why.charAt(0).toUpperCase() + m.why.slice(1))}.</p>
      <small>${m.source === "rules" ? "Από τις πωλήσεις 28 ημερών, με κώδικα. Την αλλαγή την εγκρίνει ο υπεύθυνος."
        : "Κρίση του μοντέλου με τους κανόνες κατηγορίας· δεν υπάρχουν στοιχεία πωλήσεων για αυτό το ράφι."}</small></div>`).join("");
  return (fillHtml ? `<div class="sug-head">Θέλουν γέμισμα (${fills.length})</div>${fillHtml}` : "")
    + (tasked || moves ? `<div class="sug-head">Αλλάζουν ράφι (${(d.moves || []).length + misplaced.length})</div>${tasked}${moves}` : "")
    + (d.moves_more ? `<p class="prod-note">Οι ${(d.moves || []).length} σημαντικότερες αλλαγές. Άλλες ${d.moves_more} μικρότερες φαίνονται στη διάταξη ανά επίπεδο παρακάτω.</p>` : "");
}

function productsHtml(d) {
  const shelves = (d.shelves || []).filter(sh => (sh.items || []).length);
  if (!shelves.length) return `<div class="empty">Κανένα προϊόν στην τελευταία λήψη.</div>`;
  const moves = {};
  (d.moves || []).forEach(x => { moves[x.sku || x.label] = x; });
  (d.findings || []).forEach(x => { if (x.type === "misplaced") moves[x.sku || x.label] = x; });
  let n = 0, known = 0;
  const rows = shelves.map(sh => `<div class="prod-level">${esc(LEVEL_EL[sh.level] || sh.level)}</div>` + sh.items.map(it => {
    n += 1; if (it.off && it.off.status === "matched") known += 1;
    const mv = moves[it.sku || it.label];
    const move = mv ? `<small class="warn">Μετακίνηση: ${esc(LEVEL_EL[mv.to_level] || mv.to_level)}${mv.why ? " — " + esc(mv.why) : ""}</small>` : "";
    const code = it.sku ? `<span class="mono">${esc(it.sku)}</span> · ` : "";
    return `<div class="prod-row"><b>${code}${esc(it.name || it.label || "Δεν διαβάστηκε")}</b>
      <span class="n">× ${it.facings}</span>${move}${offLine(it.off)}</div>`;
  }).join("")).join("");
  return `<p class="prod-note">${n} ομάδες προϊόντων · ${known} με barcode από το Open Food Facts (ODbL). `
    + `Η αναζήτηση για προϊόντα εκτός καταλόγου τρέχει στο παρασκήνιο, λίγα ανά λήψη.</p>` + rows;
}

function setLight(cls, title, sub, right = "") {
  $("light").className = "light " + cls;
  $("lightTitle").textContent = title;
  $("lightSub").textContent = sub || "";
  $("lightRight").innerHTML = right;
}
function orderNote(orders) {
  const n = (orders || []).length;
  return n ? ` · ${n === 1 ? "1 παραγγελία" : n + " παραγγελίες"}` : "";
}
function ago(ts) {
  const m = Math.round((Date.now() / 1000 - ts) / 60);
  return m < 1 ? "μόλις τώρα" : `πριν από ${m}′`;
}
function taskCard(t) {
  const img = t.image ? `style="background-image:url('/files/${encodeURI(t.image)}')"` : "";
  const thumbCls = t.image ? "thumb" : `thumb ${esc(t.kind || "")}`;
  const orderInfo = t.order && t.order.order_no
    ? ` · <span class="mono">${esc(t.order.order_no)} (${t.order.eur.toFixed(2)} €)</span>`
    : t.order && t.order.rejected ? ` · <span class="warn">Απορρίφθηκε</span>` : "";
  const appr = t.needs_approval
    ? `<div class="acts"><button class="ok" data-order="${esc(t.id)}" data-v="1">Έγκριση ${t.needs_approval.cases} κιβ. (${t.needs_approval.eur.toFixed(2)} €)</button>
       <button class="ghost" data-order="${esc(t.id)}" data-v="0">Απόρριψη</button></div><div class="meta warn">${esc(t.needs_approval.why)}</div>`
    : "";
  const worker = t.status === "in_progress" ? `<span class="warn">Σε εξέλιξη (${esc(t.claimed_by || "υπάλληλος")})</span> · ` : "";
  return `<div class="task-row">
    <div class="${thumbCls}" ${img}>${t.image ? "" : (KIND_LABEL[t.kind] || "SKU")}</div>
    <div>
      <b>${esc(t.text)}</b>
      <div class="meta">${worker}<span class="mono">${ago(t.created)}</span>${orderInfo}</div>
      ${appr}
    </div>
  </div>`;
}

function render(d) {
  last = d;
  if (noCamera && !usingFile) showFrame(d.frame);
  draw();
  const tasks = d.tasks || [];
  $("taskCount").textContent = String(tasks.length);
  window.ShelfSenseShell?.setTaskBadge(tasks.length);

  if (d.unknown_shelf) setLight("warn", "Ράφι εκτός καταλόγου",
    "Τα προϊόντα αναγνωρίζονται από την ετικέτα· διάταξη από το μοντέλο, χωρίς αυτόματες παραγγελίες.");
  else if (d.status === "occluded") setLight("warn", "Περιορισμένη ορατότητα",
    "Αναμονή για καθαρή εικόνα ραφιού.");
  else if (d.status === "idle") setLight("", "Αναμονή πρώτης λήψης…", noCamera ? "Πάτα «Λήψη φωτογραφίας»." : "");
  else if (!tasks.length) setLight("ok", "Το ράφι είναι σωστό",
    d.done && d.done.length ? `Τελευταία διόρθωση: ${esc(d.done[0].text)}` : "Όλοι οι κωδικοί στη θέση τους.");
  else setLight("bad", `${tasks.length} ${tasks.length === 1 ? "εκκρεμής εργασία" : "εκκρεμείς εργασίες"}`,
    "Στάλθηκαν στον υπάλληλο" + orderNote(d.orders));

  if (d.status === "pending") $("lightRight").innerHTML = `επιβεβαίωση ${esc(d.confirm || "")}`;

  $("tasks").innerHTML = tasks.length
    ? tasks.map(taskCard).join("")
    : `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>Καμία εκκρεμής εργασία</div>`;

  const planHtml = suggestionsHtml(d) + ((d.proposals || []).map(propCard).join(""))
    + (d.summary ? `<p class="lay-summary">${esc(d.summary)}</p>` : "")
    + (d.suggested_layout || []).map(l => `<div class="lay"><b>${esc({top:"Πάνω",eye:"Μάτια",bottom:"Κάτω"}[l.level] || l.level)}</b>
        <span>${esc((l.order || []).join(" → "))}</span><small>${esc(l.why || "")}</small></div>`).join("");
  $("plan").innerHTML = planHtml || `<div class="empty">Καμία παρατήρηση διάταξης.</div>`;
  $("products").innerHTML = productsHtml(d);

  $("timeline").innerHTML = (d.history || []).slice().reverse().map(h =>
    `<li><time>${hhmm(h.ts)}</time><span class="sdot ${KIND_DOT[h.kind] || ""}"></span><span>${esc(h.text)}</span></li>`
  ).join("") || `<li><time>—</time><span class="sdot"></span><span class="mut">Έλεγχος ανά ${interval}s.</span></li>`;

  if (d.model) $("mode").textContent = (d.provider === "mock" ? "mock" : d.model) + (d.shelf_title ? " · ράφι: " + d.shelf_title : "");
  $("devinfo").textContent = `frame ${d.frame || "-"} · ${d.status} · ${d.seconds ?? "-"}s · επιβεβαίωση ${d.confirm || "-"} · ` +
    `${d.frames} frames / ${d.model_calls} κλήσεις μοντέλου` + (d.diff !== undefined ? ` · διαφορά ${d.diff}` : "") +
    (d.agent_run ? ` · agent ${d.agent_run}` : "") + "\n" + JSON.stringify(d.findings || [], null, 1).slice(0, 1500);
}

function setMirror(on, isManual = false) {
  mirrorMode = on;
  if (isManual) manualLocal = !on;
  $("mirrorBtn").textContent = on ? "Τοπική κάμερα" : "Κάμερα κινητού";
  $("now").hidden = on;
  $("pause").hidden = on;
  if (on) {
    if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
    if (!$("still").getAttribute("src") && last && last.frame) {
      $("still").src = "/files/live/" + encodeURIComponent(last.frame);
      $("still").hidden = false;
      $("hint").hidden = true;
      lastShownFrame = last.frame;
    } else if (!$("still").getAttribute("src")) {
      $("hint").hidden = false;
      $("hint").innerHTML = `<div>Αναμονή ζωντανής εικόνας από το κινητό (<code>/cam</code> ή <code>/capture</code>)…</div>`;
    }
  } else {
    $("still").hidden = true;
    usingFile = false;
    openCamera().then(() => { $("hint").hidden = true; countdown = 2; }).catch(() => {});
  }
  draw();
}

$("still").addEventListener("load", draw);

// Poll mobile live preview stream (auto-switches to mirror if phone opens /cam, unless user forced local camera)
setInterval(async () => {
  if (previewPolling || usingFile || document.hidden) return;
  if (!mirrorMode && manualLocal) return;
  previewPolling = true;
  try {
    const r = await fetch(`/api/shelf/preview.jpg?since=${lastPreviewTs}`);
    if (r.status === 200) {
      const ts = parseFloat(r.headers.get("X-Preview-Ts") || "0");
      const blob = await r.blob();
      if (ts > lastPreviewTs && blob.size > 0) {
        lastPreviewTs = ts;
        if (!mirrorMode) setMirror(true, false);
        const nextUrl = URL.createObjectURL(blob);
        const oldUrl = prevBlobUrl;
        prevBlobUrl = nextUrl;
        $("still").src = nextUrl;
        $("still").hidden = false;
        $("hint").hidden = true;
        if (oldUrl) setTimeout(() => URL.revokeObjectURL(oldUrl), 300);
      }
    }
  } catch {}
  finally { previewPolling = false; }
}, 950);

setInterval(() => {
  if (mirrorMode) { $("count").textContent = lastPreviewTs ? "ζωντανά από κινητό" : "αναμονή κινητού"; return; }
  if (noCamera) {
    $("count").textContent = sending ? "ανάλυση…" : (shownFrame ? "τελευταία φωτογραφία" : "");
    countdown -= 1;
    if (countdown <= 0 && !sending && !usingFile) {      // φωτογραφίες από /capture ή Telegram εμφανίζονται εδώ
      countdown = 4;
      fetch("/api/live/status").then(r => r.json()).then(s => { if (!sending) render(s); }).catch(() => {});
    }
    return;
  }
  if (paused || usingFile) { $("count").textContent = paused ? "σε παύση" : (usingFile ? "αρχείο εικόνας" : ""); return; }
  countdown -= 1;
  $("count").textContent = sending ? "ανάλυση…" : `${Math.max(countdown, 0)}s`;
  if (countdown <= 0) { countdown = interval; scan(); }
}, 1000);

new EventSource("/api/events").onmessage = m => {
  const ev = JSON.parse(m.data);
  if (ev.run_id !== "system" || Date.now() / 1000 - ev.ts > 6) return;
  if (["shelf_log", "live_frame", "live_report", "recommendation_feedback"].includes(ev.type)) {
    fetch("/api/live/status").then(r => r.json()).then(s => {
      if (!sending) {
        if ((mirrorMode || paused || !video.videoWidth) && !usingFile && s.frame && s.frame !== lastShownFrame && !lastPreviewTs) {
          lastShownFrame = s.frame;
          $("still").src = "/files/live/" + encodeURIComponent(s.frame);
          $("still").hidden = false;
          $("hint").hidden = true;
        }
        render(s);
      }
    });
  }
};

$("mirrorBtn").onclick = () => setMirror(!mirrorMode, true);
$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "Συνέχεια" : "Παύση"; };
$("now").onclick = () => {
  if (noCamera) { $("shot").click(); return; }
  usingFile = false; $("still").hidden = true; scan(true); countdown = interval;
};
$("shot").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  usingFile = false; shownFrame = null;
  $("still").src = URL.createObjectURL(f); $("still").hidden = false; $("hint").hidden = true;
  setLight("", "Ανάλυση φωτογραφίας…", "");
  await send(await shrink(f), true, true);
  e.target.value = "";
};
$("ref").onclick = async () => {
  let blob = null;
  if (video.videoWidth) {
    blob = await snapshot();
  } else if (!$("still").hidden && $("still").naturalWidth) {
    const c = document.createElement("canvas");
    c.width = $("still").naturalWidth; c.height = $("still").naturalHeight;
    c.getContext("2d").drawImage($("still"), 0, 0);
    blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.9));
  }
  if (!blob) return;
  const body = new FormData(); body.append("file", blob, "ref.jpg");
  const r = await fetch("/api/shelf/reference", { method: "POST", body });
  if (r.ok) {
    $("ref").textContent = "Αποθηκεύτηκε";
    setTimeout(() => $("ref").textContent = "Ορισμός αναφοράς", 2200);
    fetch("/api/live/status").then(r => r.json()).then(render);
  }
};
$("cam").onchange = e => openCamera(e.target.value);
$("file").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  usingFile = true; $("still").src = URL.createObjectURL(f); $("still").hidden = false; $("hint").hidden = true; send(f, true);
};
$("reset").onclick = async () => {
  await fetch("/api/live/reset", { method: "POST" });
  render(await (await fetch("/api/live/status")).json());
};
document.querySelectorAll("[data-mock]").forEach(b => b.onclick = async () => {
  await fetch("/api/live/mock/" + b.dataset.mock, { method: "POST" });
  usingFile = false;
  if (noCamera) { shownFrame = null; send(await (await fetch("/photo/" + b.dataset.mock)).blob(), true, true); return; }
  $("still").hidden = true; scan(true);
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-order]");
  if (b) {
    b.disabled = true;
    await fetch(`/api/tasks/${encodeURIComponent(b.dataset.order)}/order`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ approved: b.dataset.v === "1" })
    });
    render(await (await fetch("/api/live/status")).json());
    return;
  }

  const fb = e.target.closest("[data-rec]");
  if (fb) {
    fb.disabled = true;
    const rid = fb.dataset.rec, dec = fb.dataset.dec;
    await fetch(`/api/recommendations/${encodeURIComponent(rid)}/feedback`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ submission_id: `ui-${dec}-${Date.now()}`, decision: dec, decided_by: "manager" })
    });
    render(await (await fetch("/api/live/status")).json());
    return;
  }

  const tg = e.target.closest("[data-talker-toggle]");
  if (tg) {
    const rid = tg.dataset.talkerToggle;
    if (openTalkerForms.has(rid)) openTalkerForms.delete(rid); else openTalkerForms.add(rid);
    if (last) render(last);
    return;
  }

  const evBtn = e.target.closest("[data-evid]");
  if (evBtn) {
    const pid = evBtn.dataset.prop, sku = evBtn.dataset.evid;
    if (evidCache[pid]) { delete evidCache[pid]; if (last) render(last); return; }
    evBtn.disabled = true; evBtn.textContent = "…";
    try {
      const pack = await (await fetch(`/api/evidence/${encodeURIComponent(sku)}`)).json();
      const srcs = (pack.sources || []).slice(0, 3);
      evidCache[pid] = srcs.length
        ? srcs.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.domain || s.url)}</a>`).join("")
        : `<span>Περιθώριο ${esc(pack.margin_pct ?? "—")}% · Δεν βρέθηκαν εξωτερικές πηγές.</span>`;
    } catch { evidCache[pid] = "<span>Αδυναμία φόρτωσης τεκμηρίων.</span>"; }
    if (last) render(last);
  }
});

document.addEventListener("submit", async e => {
  const form = e.target.closest("[data-talker-form]");
  if (!form) return;
  e.preventDefault();
  const rid = form.dataset.talkerForm, sku = form.dataset.sku;
  const pname = form.elements.pname.value.trim();
  const pprice = parseFloat(form.elements.pprice.value);
  const btn = form.querySelector("button[type=submit]");
  btn.disabled = true; btn.textContent = "Δημιουργία…";
  try {
    await fetch(`/api/recommendations/${encodeURIComponent(rid)}/feedback`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        submission_id: `ui-corr-${Date.now()}`,
        decision: "corrected",
        decided_by: "manager",
        correction: {
          product: { sku: sku || null, name: pname },
          price: { amount: pprice, currency: "EUR", source: "owner_confirmation" }
        }
      })
    });
    const r = await fetch(`/api/recommendations/${encodeURIComponent(rid)}/talker`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ theme: "fresh" })
    });
    if (r.ok) openTalkerForms.delete(rid);
    render(await (await fetch("/api/live/status")).json());
  } finally {
    btn.disabled = false; btn.textContent = "Δημιουργία";
  }
});
window.addEventListener("resize", draw);
$("still").addEventListener("load", draw);
video.addEventListener("loadedmetadata", draw);

(async () => {
  const s = await (await fetch("/api/live/status")).json();
  interval = s.interval; render(s);
  $("mode").textContent = s.provider === "mock" ? "mock" : s.model;
  if (mirrorMode) { setMirror(true, false); return; }
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("no-live-camera");
    await openCamera(); $("hint").hidden = true; countdown = 2;
  } catch (e) {
    // Συνηθισμένη αιτία: κινητό σε http://<ip> (όχι HTTPS), όπου ο browser δεν επιτρέπει ζωντανή κάμερα.
    // Αν το κινητό ανοίξει το /cam, η οθόνη περνά μόνη της σε mirror (βλ. polling του preview παραπάνω).
    noCamera = true;
    video.hidden = true;
    $("now").textContent = "Λήψη φωτογραφίας";
    $("pause").hidden = true; $("ref").hidden = true;
    $("hint").innerHTML = `<div>Η ζωντανή κάμερα δεν είναι διαθέσιμη σε αυτή τη σύνδεση.<br>Πάτα «Λήψη φωτογραφίας» για να ελεγχθεί το ράφι.</div>`;
    $("hint").hidden = Boolean(s.frame);
    render(s);
  }
})();
</script>
</body>
</html>
