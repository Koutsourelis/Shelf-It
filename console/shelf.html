<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Οθόνη Ραφιού · ShelfSense</title>
<link rel="icon" href="/ui/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
<!-- Οθόνη ραφιού. Ξεκινά μόνη της: κάμερα → frame κάθε N s → POST /api/shelf/frame → κατάσταση, εργασίες, χρονολόγιο.
     Τα κουτιά έρχονται σε [ymin, xmin, ymax, xmax] 0–1000· η μετατροπή σε pixel γίνεται ΜΟΝΟ στο toPx().
     ?dev=1: εμφανίζει τα εργαλεία δοκιμής (mock, από αρχείο, επιλογή κάμερας, λεπτομέρειες frame). -->
<style>
  main.workstation {
    max-width: 1440px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 410px;
    gap: 20px;
    padding: 18px 22px 36px;
    align-items: start;
  }
  @media (max-width: 1040px) { main.workstation { grid-template-columns: 1fr; padding: 14px; } }

  /* Status banner directly above camera feed */
  .light {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: var(--r);
    margin-bottom: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .light .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--mut);
    flex: none;
  }
  .light.ok { background: var(--okbg); border-color: var(--okline); }
  .light.ok .dot { background: var(--ok); }
  .light.warn { background: var(--warnbg); border-color: var(--warnline); }
  .light.warn .dot { background: var(--warn); }
  .light.bad { background: var(--badbg); border-color: var(--badline); }
  .light.bad .dot { background: var(--bad); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .light b { font-size: 17px; font-weight: 700; letter-spacing: -0.015em; display: block; color: var(--fg); }
  .light span { font-size: 13.5px; color: var(--fg2); }
  .light .right {
    margin-left: auto;
    text-align: right;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--mut);
  }

  /* Camera viewport */
  .stage {
    position: relative;
    background: #111613;
    border: 1px solid var(--line-strong);
    border-radius: var(--r);
    overflow: hidden;
    aspect-ratio: 16 / 9;
    box-shadow: var(--shadow);
  }
  .stage video, .stage canvas, .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .stage canvas { pointer-events: none; }
  .stage .hint {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #cbd5cf;
    text-align: center;
    padding: 24px;
    font-size: 14px;
    line-height: 1.55;
  }
  .stage .hint[hidden], .stage img[hidden], .stage video[hidden] { display: none !important; }
  .stage .hint a { color: #6ee7b7; }
  .stage .hint code { background: #1e2722; border-color: #2f3d35; color: #e2ebe5; }
  .scan {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #34d399, transparent);
    top: 0;
    opacity: 0;
  }
  .scan.on { opacity: 1; animation: sweep 1.5s linear infinite; }
  @keyframes sweep { from { top: 0; } to { top: 100%; } }

  /* Controls toolbar */
  .bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .bar .count {
    font-family: var(--mono);
    color: var(--mut);
    font-size: 12.5px;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }
  .devbar {
    display: none;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px dashed var(--line-strong);
    border-radius: var(--r-sm);
  }
  .devbar .lbl {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--mut);
    margin-right: 4px;
  }
  .devonly { display: none !important; }
  body.dev .devonly { display: block !important; }
  body.dev .devbar { display: flex !important; }
  #devinfo {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--fg2);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 10px 12px;
    white-space: pre-wrap;
    margin-top: 10px;
    max-height: 220px;
    overflow: auto;
  }

  /* Right-hand operational rail */
  aside.rail { display: flex; flex-direction: column; gap: 14px; }
  aside.rail .card { padding: 16px 18px; }

  .task {
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr);
    gap: 12px;
    padding: 11px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    margin-bottom: 8px;
  }
  .task:last-child { margin-bottom: 0; }
  .task.in_progress { border-color: var(--warnline); background: var(--warnbg); }
  .task .img {
    width: 58px;
    height: 58px;
    border-radius: 6px;
    background: #141b17 center / cover no-repeat;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    color: #9fb0a6;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .task .img.no-img {
    background: var(--badbg);
    border-color: var(--badline);
    color: var(--bad);
  }
  .task .img.no-img.relocate, .task .img.no-img.tidy, .task .img.no-img.remove {
    background: var(--warnbg);
    border-color: var(--warnline);
    color: var(--warn);
  }
  .task b { display: block; font-size: 14px; line-height: 1.35; letter-spacing: -0.01em; }
  .task small {
    color: var(--mut);
    font-size: 12px;
    display: block;
    margin-top: 4px;
    line-height: 1.4;
  }
  .task .ord-tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    padding: 1px 6px;
    border-radius: 4px;
    margin-top: 4px;
  }
  .task .acts { margin-top: 8px; display: flex; gap: 6px; }
  .task .acts button { padding: 6px 10px; font-size: 12.5px; }

  /* Suggested shelf layout rows */
  .lay {
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr);
    gap: 3px 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .lay:last-child { border-bottom: 0; padding-bottom: 0; }
  .lay b {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--mut);
    padding-top: 2px;
  }
  .lay span { line-height: 1.4; font-weight: 500; color: var(--fg); }
  .lay small { grid-column: 2; font-size: 12px; line-height: 1.35; }

  /* Timeline log */
  .tl { list-style: none; margin: 0; padding: 0; max-height: 290px; overflow: auto; }
  .tl li {
    display: grid;
    grid-template-columns: 44px 10px minmax(0, 1fr);
    gap: 8px;
    align-items: baseline;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    line-height: 1.4;
  }
  .tl li:last-child { border-bottom: 0; }
  .tl time { font-family: var(--mono); font-size: 12px; color: var(--mut); font-variant-numeric: tabular-nums; }
  .tl .kind-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--line-strong);
    display: inline-block;
    transform: translateY(-1px);
  }
  .tl .kind-dot.ok { background: var(--ok); }
  .tl .kind-dot.bad { background: var(--bad); }
  .tl .kind-dot.warn { background: var(--warn); }
  .tl .kind-dot.accent { background: var(--accent); }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><img src="/ui/logo.svg" alt="">ShelfSense</a>
  <nav>
    <a class="on" href="/shelf">Ράφι</a>
    <a href="/tasks">Εργασίες</a>
    <a href="/portal/orders">Αποθήκη</a>
    <a href="/dev">Κονσόλα</a>
  </nav>
  <div class="right">
    <button type="button" class="subtle" id="devToggle" style="padding:5px 10px;font-size:12.5px">Δοκιμές</button>
    <span class="pill plain" id="mode">…</span>
  </div>
</header>

<main class="workstation">
  <section>
    <div class="light" id="light">
      <div class="dot"></div>
      <div>
        <b id="lightTitle">Εκκίνηση κάμερας…</b>
        <span id="lightSub"></span>
      </div>
      <div class="right" id="lightRight"></div>
    </div>

    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <img id="still" alt="" hidden>
      <canvas id="overlay"></canvas>
      <div class="scan" id="scan"></div>
      <div class="hint" id="hint" hidden></div>
    </div>

    <div class="bar">
      <button id="now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-2.64-6.36" stroke-linecap="round"/><polyline points="21 3 21 9 15 9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Έλεγχος τώρα
      </button>
      <button id="pause" class="ghost">Παύση</button>
      <button id="ref" class="ghost" title="Το τωρινό frame αποθηκεύεται ως εικόνα αναφοράς">Ορισμός ως σωστό ράφι</button>
      <span class="count" id="count"></span>
    </div>

    <div class="devbar">
      <span class="lbl">Δοκιμή</span>
      <select id="cam" class="btn ghost" title="Επιλογή κάμερας"></select>
      <button class="ghost" id="file">Από αρχείο…</button>
      <button class="ghost" data-mock="sample_before">Mock: Έλλειψη</button>
      <button class="ghost" data-mock="sample_after">Mock: Σωστό</button>
      <button class="ghost" id="reset">Μηδενισμός</button>
      <input id="fileInput" type="file" accept="image/*" hidden>
    </div>

    <div id="devinfo" class="devonly"></div>
  </section>

  <aside class="rail">
    <div class="card">
      <div class="sec-head">
        <h2 class="sec-title">Εργασίες υπαλλήλου</h2>
        <span class="pill plain" id="taskCount" style="font-size:11.5px;padding:2px 8px">0</span>
      </div>
      <div id="tasks"></div>
    </div>

    <div class="card">
      <div class="sec-head">
        <h2 class="sec-title">Διάταξη & Προτάσεις</h2>
      </div>
      <div id="plan" class="mut" style="font-size:13.5px">Αναμονή πρώτης λήψης…</div>
    </div>

    <div class="card">
      <div class="sec-head">
        <h2 class="sec-title">Χρονολόγιο ενεργειών</h2>
      </div>
      <ul class="tl" id="timeline"></ul>
    </div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let isDev = params.has("dev");
function applyDev() {
  document.body.classList.toggle("dev", isDev);
  $("devToggle").classList.toggle("on", isDev);
  $("devToggle").textContent = isDev ? "Κλείσιμο δοκιμών" : "Δοκιμές";
}
$("devToggle").onclick = () => {
  isDev = !isDev;
  const url = new URL(location.href);
  if (isDev) url.searchParams.set("dev", "1"); else url.searchParams.delete("dev");
  history.replaceState(null, "", url);
  applyDev();
};
applyDev();

const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
let interval = 30, countdown = 0, paused = false, last = null, sending = false, usingFile = false;

const COLORS = { ok: "#157347", low: "#d97706", missing: "#be2e26", misplaced: "#be2e26", unknown: "#6d28d9", gap: "#be2e26" };
const KIND_LABEL = { restock: "ΑΝΑΠΛ", relocate: "ΘΕΣΗ", remove: "ΞΕΝΟ", tidy: "ΤΑΞΗ" };
const KIND_DOT = { restock: "bad", relocate: "warn", remove: "warn", tidy: "warn", task: "bad",
                   order: "accent", done: "ok", claim: "warn", approval: "warn", setup: "accent",
                   proposal: "accent", agent: "accent", foreign: "warn" };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hhmm = ts => new Date(ts * 1000).toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit", hour12: false });

// ---- κάμερα ----------------------------------------------------------------
async function openCamera(deviceId) {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const v = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } };
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: v });
  await video.play();
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  $("cam").innerHTML = devices.map((d, i) => `<option value="${d.deviceId}">${esc(d.label || "Κάμερα " + (i + 1))}</option>`).join("");
}
function snapshot() {
  const c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext("2d").drawImage(video, 0, 0);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.88));
}

// ---- frame → server ----------------------------------------------------------
async function send(blob, force = false) {
  if (sending || !blob) return;
  sending = true; $("scan").classList.add("on");
  const body = new FormData(); body.append("file", blob, "frame.jpg");
  try {
    const r = await fetch("/api/shelf/frame" + (force ? "?force=1" : ""), { method: "POST", body });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    render(data);
  } catch (e) {
    setLight("warn", "Αδυναμία ανάγνωσης ραφιού", e.message);
  } finally { sending = false; $("scan").classList.remove("on"); }
}
async function scan(force = false) {
  if (usingFile) return;
  if (video.videoWidth) await send(await snapshot(), force);
}

// ---- σχέδιο πάνω στην εικόνα ------------------------------------------------
function frameRect() {
  const W = overlay.clientWidth, H = overlay.clientHeight;
  const el = usingFile ? $("still") : video;
  const vw = (usingFile ? el.naturalWidth : el.videoWidth) || 16, vh = (usingFile ? el.naturalHeight : el.videoHeight) || 9;
  const s = Math.min(W / vw, H / vh), w = vw * s, h = vh * s;
  return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}
function toPx(box, f) {
  const [y0, x0, y1, x1] = box;
  return [f.x + x0 * f.w / 1000, f.y + y0 * f.h / 1000, (x1 - x0) * f.w / 1000, (y1 - y0) * f.h / 1000];
}
function draw() {
  overlay.width = overlay.clientWidth; overlay.height = overlay.clientHeight;
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (!last || !last.shelves) return;
  const f = frameRect(), statusOf = {};
  (last.findings || []).forEach(x => { if (x.sku) statusOf[x.sku] = x.type; });
  ctx.lineWidth = 2.5;
  ctx.font = "600 12.5px 'IBM Plex Mono', ui-monospace, monospace";
  const box = (b, color, text) => {
    const [x, y, w, h] = toPx(b, f);
    ctx.strokeStyle = color;
    ctx.strokeRect(x, y, w, h);
    if (!text) return;
    const tw = ctx.measureText(text).width + 12;
    const ty = Math.max(y - 21, 0);
    ctx.fillStyle = color;
    ctx.fillRect(x, ty, tw, 21);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(text, x + 6, ty + 14.5);
  };
  (last.shelves || []).forEach(sh => (sh.items || []).forEach(it => {
    if (!it.box_2d) return;
    const st = !it.sku ? "unknown" : (statusOf[it.sku] || (it.placement_ok === false ? "misplaced" : "ok"));
    box(it.box_2d, COLORS[st], st === "ok" ? "" : (it.sku || "?"));
  }));
  (last.proposals || []).forEach(p => arrow(p, f));
}

function arrow(p, f) {
  const TEAL = "#0f6b4f", sides = [p.a, p.b].filter(s => s && s.box);
  ctx.save();
  ctx.strokeStyle = TEAL; ctx.fillStyle = TEAL; ctx.lineWidth = 3; ctx.setLineDash([8, 5]);
  sides.forEach(s => { const [x, y, w, h] = toPx(s.box, f); ctx.strokeRect(x - 3, y - 3, w + 6, h + 6); });
  ctx.setLineDash([]);
  if (sides.length === 2) {
    const mid = s => { const [x, y, w, h] = toPx(s.box, f); return [x + w / 2, y + h / 2]; };
    const [x0, y0] = mid(p.a), [x1, y1] = mid(p.b);
    const cx = (x0 + x1) / 2 + (y1 - y0) * 0.22, cy = (y0 + y1) / 2 - (x1 - x0) * 0.22;
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke();
    const head = (x, y, fx, fy) => {
      const a = Math.atan2(y - fy, x - fx), r = 14;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - r * Math.cos(a - 0.45), y - r * Math.sin(a - 0.45));
      ctx.lineTo(x - r * Math.cos(a + 0.45), y - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
    };
    head(x1, y1, cx, cy);
    if (p.kind === "swap") head(x0, y0, cx, cy);
    const label = p.kind === "swap" ? "Αλλαγή θέσης" : "+1 πρόσοψη";
    ctx.font = "600 12.5px 'Inter', system-ui, sans-serif";
    const tw = ctx.measureText(label).width + 14;
    const lx = (x0 + 2 * cx + x1) / 4, ly = (y0 + 2 * cy + y1) / 4;
    ctx.fillRect(lx - tw / 2, ly - 11, tw, 22);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(label, lx - tw / 2 + 7, ly + 4);
  }
  ctx.restore();
}

const RULE = { K3: "Χώρος στο ράφι", K4: "Ύψος ματιών", K5: "Κέντρο ραφιού" };
function propCard(p) {
  return `<div class="prop">
    <div class="prop-head"><span class="tag">${esc(p.rule || "ΠΡΟΤΑΣΗ")}</span><span class="rule-lbl">${esc(RULE[p.rule] || "Διάταξη")}</span></div>
    <b>${esc(p.text)}</b>
    <p class="why">${esc(p.reason)}</p>
    <div class="num">${esc(p.numbers)}</div>
    <small>${esc(p.note)} Πηγή: ${esc(p.source)}.</small>
  </div>`;
}

// ---- εμφάνιση ------------------------------------------------------------------
function setLight(cls, title, sub, right = "") {
  $("light").className = "light " + cls;
  $("lightTitle").textContent = title;
  $("lightSub").textContent = sub || "";
  $("lightRight").innerHTML = right;
}
function orderNote(orders) {
  const n = (orders || []).length;
  return n ? ` · ${n === 1 ? "1 αυτόματη παραγγελία" : n + " αυτόματες παραγγελίες"}` : "";
}
function ago(ts) {
  const m = Math.round((Date.now() / 1000 - ts) / 60);
  return m < 1 ? "μόλις τώρα" : `πριν από ${m}′`;
}
function taskCard(t) {
  const img = t.image ? `style="background-image:url('/files/${encodeURI(t.image)}')"` : "";
  const orderBadge = t.order && t.order.order_no
    ? `<span class="ord-tag">${esc(t.order.order_no)} · ${t.order.eur.toFixed(2)} €</span>`
    : t.order && t.order.rejected ? `<small class="warn">Η παραγγελία απορρίφθηκε</small>` : "";
  const appr = t.needs_approval
    ? `<div class="acts"><button class="ok" data-order="${esc(t.id)}" data-v="1">Έγκριση ${t.needs_approval.cases} κιβ. (${t.needs_approval.eur.toFixed(2)} €)</button>
       <button class="ghost" data-order="${esc(t.id)}" data-v="0">Απόρριψη</button></div><small class="warn">${esc(t.needs_approval.why)}</small>`
    : "";
  const worker = t.status === "in_progress" ? `Σε εξέλιξη (${esc(t.claimed_by || "υπάλληλος")}) · ` : "";
  const imgCls = t.image ? "img" : `img no-img ${esc(t.kind || "")}`;
  return `<div class="task ${t.status}">
    <div class="${imgCls}" ${img}>${t.image ? "" : (KIND_LABEL[t.kind] || "SKU")}</div>
    <div>
      <b>${esc(t.text)}</b>
      <small>${worker}${ago(t.created)}</small>
      ${orderBadge}
      ${appr}
    </div>
  </div>`;
}

function render(d) {
  last = d; draw();
  const tasks = d.tasks || [];
  $("taskCount").textContent = String(tasks.length);
  $("taskCount").className = "pill plain " + (tasks.length ? "bad" : "ok");

  if (d.unknown_shelf) setLight("warn", "Ράφι εκτός καταλόγου",
    "Αξιολόγηση διάταξης και εικόνας χωρίς αυτόματες παραγγελίες.");
  else if (d.status === "occluded") setLight("warn", "Περιορισμένη ορατότητα ραφιού",
    "Κάτι κρύβει το πλάνο· αναμονή για καθαρή λήψη.");
  else if (d.status === "idle") setLight("", "Αναμονή πρώτης λήψης…", "Η κάμερα ξεκινά αυτόματα.");
  else if (!tasks.length) setLight("ok", "Το ράφι είναι σωστό",
    d.done && d.done.length ? `Τελευταία αποκατάσταση: ${esc(d.done[0].text)}` : "Όλοι οι κωδικοί βρίσκονται στη θέση τους.");
  else setLight("bad", `${tasks.length} ${tasks.length === 1 ? "εκκρεμής εργασία" : "εκκρεμείς εργασίες"}`,
    "Στάλθηκαν στο κινητό του υπαλλήλου" + orderNote(d.orders));

  if (d.status === "pending") $("lightRight").innerHTML = `Επιβεβαίωση ${esc(d.confirm || "")}`;

  $("tasks").innerHTML = tasks.length
    ? tasks.map(taskCard).join("")
    : `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Καμία εκκρεμής εργασία</div>`;

  const planHtml = ((d.proposals || []).map(propCard).join(""))
    + (d.summary ? `<p class="mut" style="margin:0 0 10px;font-size:13px;line-height:1.45">${esc(d.summary)}</p>` : "")
    + (d.suggested_layout || []).map(l => `<div class="lay"><b>${esc({top:"Πάνω",eye:"Μάτια",bottom:"Κάτω"}[l.level] || l.level)}</b>
        <span>${esc((l.order || []).join(" → "))}</span><small class="mut">${esc(l.why || "")}</small></div>`).join("");
  $("plan").innerHTML = planHtml || `<span class="mut">Δεν υπάρχουν παρατηρήσεις διάταξης ακόμη.</span>`;

  $("timeline").innerHTML = (d.history || []).slice().reverse().map(h =>
    `<li><time>${hhmm(h.ts)}</time><span class="kind-dot ${KIND_DOT[h.kind] || ""}"></span><span>${esc(h.text)}</span></li>`
  ).join("") || `<li><time>—</time><span class="kind-dot"></span><span class="mut">Έλεγχος ανά ${interval} δευτερόλεπτα.</span></li>`;

  $("devinfo").textContent = `frame ${d.frame || "-"} · ${d.status} · ${d.seconds ?? "-"} s · επιβεβαίωση ${d.confirm || "-"} · ` +
    `${d.frames} frames / ${d.model_calls} κλήσεις μοντέλου` + (d.diff !== undefined ? ` · διαφορά ${d.diff}` : "") +
    (d.agent_run ? ` · agent ${d.agent_run}` : "") + "\n" + JSON.stringify(d.findings || [], null, 1).slice(0, 1500);
}

// ---- βρόχος -----------------------------------------------------------------
setInterval(() => {
  if (paused || usingFile) { $("count").textContent = paused ? "σε παύση" : (usingFile ? "προβολή αρχείου" : ""); return; }
  countdown -= 1;
  $("count").textContent = sending ? "ανάλυση εικόνας…" : `επόμενη σάρωση ${Math.max(countdown, 0)}s`;
  if (countdown <= 0) { countdown = interval; scan(); }
}, 1000);

new EventSource("/api/events").onmessage = m => {
  const ev = JSON.parse(m.data);
  if (ev.run_id === "system" && ev.type === "shelf_log" && Date.now() / 1000 - ev.ts < 5)
    fetch("/api/live/status").then(r => r.json()).then(s => { if (!sending) render(s); });
};

$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "Συνέχεια" : "Παύση"; };
$("now").onclick = () => { usingFile = false; $("still").hidden = true; scan(true); countdown = interval; };
$("ref").onclick = async () => {
  if (!video.videoWidth) return;
  const body = new FormData(); body.append("file", await snapshot(), "ref.jpg");
  const r = await fetch("/api/shelf/reference", { method: "POST", body });
  if (r.ok) {
    $("ref").textContent = "Αποθηκεύτηκε ως αναφορά";
    setTimeout(() => $("ref").textContent = "Ορισμός ως σωστό ράφι", 2500);
    fetch("/api/live/status").then(r => r.json()).then(render);
  }
};
$("cam").onchange = e => openCamera(e.target.value);
$("file").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  usingFile = true; $("still").src = URL.createObjectURL(f); $("still").hidden = false; $("hint").hidden = true; send(f, true);
};
$("reset").onclick = async () => {
  await fetch("/api/live/reset", { method: "POST" });
  render(await (await fetch("/api/live/status")).json());
};
document.querySelectorAll("[data-mock]").forEach(b => b.onclick = async () => {
  await fetch("/api/live/mock/" + b.dataset.mock, { method: "POST" });
  usingFile = false; $("still").hidden = true; scan(true);
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-order]"); if (!b) return;
  b.disabled = true;
  await fetch(`/api/tasks/${encodeURIComponent(b.dataset.order)}/order`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ approved: b.dataset.v === "1" })
  });
  render(await (await fetch("/api/live/status")).json());
});
window.addEventListener("resize", draw);
video.addEventListener("loadedmetadata", draw);

(async () => {
  const s = await (await fetch("/api/live/status")).json();
  interval = s.interval; render(s);
  $("mode").textContent = s.provider === "mock" ? "Μοντέλο: Mock" : s.model;
  $("mode").className = "pill " + (s.provider === "mock" ? "warn" : "ok");
  try { await openCamera(); $("hint").hidden = true; countdown = 2; }
  catch (e) {
    $("hint").hidden = false;
    $("hint").innerHTML = `<div>Δεν βρέθηκε ενεργή κάμερα (${esc(e.message)}).<br>Άνοιξε τη σελίδα από <code>localhost</code> ή HTTPS, ή ενεργοποίησε τις <a href="?dev=1">Δοκιμές</a> για φόρτωση εικόνας από αρχείο.</div>`;
  }
})();
</script>
</body>
</html>
